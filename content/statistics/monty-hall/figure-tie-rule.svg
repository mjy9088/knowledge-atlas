<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 255" role="img" aria-labelledby="title desc"><title id="title">두 꽝 사이에서 무작위로 선택</title><desc id="desc">처음 선택이 당첨이면 남은 두 문은 모두 꽝입니다. 예시의 진행자는 어느 쪽도 선호하지 않고 각각1/2로 공개합니다. 이는 전체 교환 승률2/3의 필수 조건이라고 주장하지 않습니다.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><rect width="600" height="255" rx="14" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="35" text-anchor="middle" font-size="24">가정: 고른 1번 문에 상품이 있다면</text><text x="300" y="85" text-anchor="middle" font-size="23">남은 2번과 3번은 모두 꽝입니다</text><path d="M300 100V120M150 120H450M150 120V145M450 120V145" stroke="#91aa96" fill="none"/><text x="150" y="180" text-anchor="middle" font-size="24">2번을 엶: 1/2</text><text x="450" y="180" text-anchor="middle" font-size="24">3번을 엶: 1/2</text><text x="300" y="230" text-anchor="middle" font-size="21">이 예시는 어느 꽝 문도 선호하지 않습니다</text></g></svg>
