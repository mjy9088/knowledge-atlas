<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-labelledby="title desc"><title id="title">두 개의 합법적 꽝 공개를 반반으로 선택</title><desc id="desc">처음 고른1번이 상품이면2번과3번 모두 꽝입니다. 진행자는 두 가능한 공개 중 하나를 각각1/2로 고릅니다. 그림의 두 문은 대안이며 동시에 두 문을 여는 것이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="375" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="34" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">고른 1번에 상품이 있다고 가정</text><g transform="translate(245 68) scale(0.85)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><path d="M60 40l8 17 19 3-14 13 3 19-16-9-17 9 4-19-14-13 19-3z" fill="#d5a23d" stroke="#8b6220" stroke-width="2"/><path d="M15 139h90" stroke="#365c42" stroke-width="5"/><text x="60" y="-7" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">1번</text></g><path d="M300 194Q300 213 170 232" fill="none" stroke="#74917c" stroke-width="2"/><g transform="translate(134 244) scale(0.6)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><circle cx="67" cy="69" r="19" fill="#f1eee7" stroke="#b2a995"/><path d="M58 60l18 18m0-18L58 78" stroke="#827861" stroke-width="4" stroke-linecap="round"/><path d="M23 11l27 15v91l-27 12z" fill="#d5dfcf" stroke="#6b8776" stroke-width="2"/><circle cx="42" cy="74" r="3" fill="#597763"/></g><text x="170" y="354" text-anchor="middle" font-size="23" fill="#39775e" font-weight="700">2번 공개 · 1/2</text><path d="M300 194Q300 213 430 232" fill="none" stroke="#74917c" stroke-width="2"/><g transform="translate(394 244) scale(0.6)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><circle cx="67" cy="69" r="19" fill="#f1eee7" stroke="#b2a995"/><path d="M58 60l18 18m0-18L58 78" stroke="#827861" stroke-width="4" stroke-linecap="round"/><path d="M23 11l27 15v91l-27 12z" fill="#d5dfcf" stroke="#6b8776" stroke-width="2"/><circle cx="42" cy="74" r="3" fill="#597763"/></g><text x="430" y="354" text-anchor="middle" font-size="23" fill="#39775e" font-weight="700">3번 공개 · 1/2</text></g></svg>
