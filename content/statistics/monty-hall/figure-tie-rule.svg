<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 454" role="img" aria-labelledby="title desc"><title id="title">두 개의 합법적 꽝 공개를 반반으로 선택</title><desc id="desc">처음 고른1번이 상품이면2번과3번 모두 꽝입니다. 진행자는 두 가능한 공개 중 하나를 각각1/2로 고릅니다. 그림의 두 문은 대안이며 동시에 두 문을 여는 것이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="454" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">고른 1번에 상품이 있다고 가정</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><g transform="translate(252.0 89) scale(0.8)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><path d="M60 41l21 28-21 28-21-28z" fill="#007d79"/><path d="M49 69l8 8 15-17" fill="none" stroke="#fff" stroke-width="4"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/><path d="M12 141H108" stroke="#0f62fe" stroke-width="5"/></g><text x="300" y="79" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">1번</text><path d="M300 211L300 226" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M150 226H450" stroke="#8d8d8d" stroke-width="1"/><path d="M150 226L150 251" stroke="#8d8d8d" stroke-width="1" fill="none"/><g transform="translate(111.0 273) scale(0.65)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><path d="M48 56l25 25m0-25L48 81" stroke="#da1e28" stroke-width="5"/><path d="M23 12l22 14v91l-22 12z" fill="#f4f4f4" stroke="#161616" stroke-width="2"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/></g><text x="150" y="263" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">2번</text><text x="150" y="392" font-size="24" fill="#0f62fe" text-anchor="middle" font-weight="600">2번 공개 · 1/2</text><path d="M450 226L450 251" stroke="#8d8d8d" stroke-width="1" fill="none"/><g transform="translate(411.0 273) scale(0.65)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><path d="M48 56l25 25m0-25L48 81" stroke="#da1e28" stroke-width="5"/><path d="M23 12l22 14v91l-22 12z" fill="#f4f4f4" stroke="#161616" stroke-width="2"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/></g><text x="450" y="263" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">3번</text><text x="450" y="392" font-size="24" fill="#0f62fe" text-anchor="middle" font-weight="600">3번 공개 · 1/2</text><text x="300" y="430" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">두 대안 중 하나만 공개합니다</text></g></svg>
