<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc"><title id="title">반복 뽑기에서 분모를 확인</title><desc id="desc">두 진행자에게 같은 상품 배치를 적용합니다. 문제는 꽝이 열린 뒤의 승률을 묻습니다. 상품을 연 게임은 이 조건에 맞지 않으므로, 꽝이 열린 게임 중 교환 승리를 셉니다. 이 그림에는 실제 표본 횟수를 꾸며 넣지 않았습니다.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="430" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">같은 상품 배치를 두 진행자에게 적용</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="24" y="94" font-size="24" fill="#161616" text-anchor="start" font-weight="600">알고 꽝 공개</text><rect x="24" y="114" width="552" height="22" fill="#f4f4f4" stroke="#e0e0e0"/><text x="24" y="171" font-size="23" fill="#007d79" text-anchor="start" font-weight="400">교환 승 횟수</text><text x="553" y="171" font-size="23" fill="#161616" text-anchor="end" font-weight="400">/ 꽝 공개 횟수</text><text x="24" y="222" font-size="24" fill="#161616" text-anchor="start" font-weight="600">모르고 무작위</text><rect x="24" y="242" width="552" height="22" fill="#f4f4f4" stroke="#e0e0e0"/><text x="24" y="299" font-size="23" fill="#007d79" text-anchor="start" font-weight="400">교환 승 횟수</text><text x="553" y="299" font-size="23" fill="#161616" text-anchor="end" font-weight="400">/ 꽝 공개 횟수</text><path d="M24 327H576" stroke="#161616" stroke-width="2"/><text x="300" y="366" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">상품을 연 게임은 조건 밖 · 분모에서 제외</text><text x="300" y="405" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">실제 표본 비율은 뽑을 때마다 흔들립니다</text></g></svg>
