<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc"><title id="title">두 공개 규칙을 비교합니다</title><desc id="desc">정답을 알고 항상 꽝을 여는 경우에는 여섯 단위가 남고 네 단위에서 바꾸면 승리합니다. 정답을 모르고 무작위로 여는 경우에는 네 단위가 남고 두 단위에서 바꾸면 승리합니다. 단위는 같은 확률의 계산 단위이며 실제 표본 결과가 아닙니다.</desc><metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="430" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">한 칸 = 확률 1/6 · 전체와 남은 부분을 비교</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="24" y="94" font-size="24" fill="#161616" text-anchor="start" font-weight="600">알고 꽝 공개</text><rect x="24" y="114" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="46.5" y="146.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="77" y="114" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="99.5" y="146.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="130" y="114" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="152.5" y="146.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="183" y="114" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="205.5" y="146.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="236" y="114" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="258.5" y="146.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="289" y="114" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="311.5" y="146.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><text x="572" y="147" font-size="27" fill="#007d79" text-anchor="end" font-weight="600">4/6 = 2/3</text><path d="M24 193H576" stroke="#e0e0e0" stroke-width="1"/><text x="24" y="239" font-size="24" fill="#161616" text-anchor="start" font-weight="600">모르고 무작위</text><rect x="24" y="259" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="46.5" y="291.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="77" y="259" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="99.5" y="291.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="130" y="259" width="45" height="45" fill="url(#hatch)" stroke="#8d8d8d"/><text x="152.5" y="291.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">×</text><rect x="183" y="259" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="205.5" y="291.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="236" y="259" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="258.5" y="291.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="289" y="259" width="45" height="45" fill="url(#hatch)" stroke="#8d8d8d"/><text x="311.5" y="291.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">×</text><text x="572" y="292" font-size="27" fill="#007d79" text-anchor="end" font-weight="600">2/4 = 1/2</text><path d="M24 338H576" stroke="#e0e0e0" stroke-width="1"/><text x="300" y="402" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">사선 칸은 상품 공개 · 꽝 공개 조건 밖</text></g></svg>
