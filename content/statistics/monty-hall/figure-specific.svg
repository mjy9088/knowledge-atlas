<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-labelledby="title desc"><title id="title">가능하면 2번의 꽝을 우선 여는 진행자</title><desc id="desc">처음 선택1번은 고정입니다. 닫힌 세 문 중2번을 먼저 여는 규칙이며,2번에 상품이 있어 열 수 없을 때는3번을 엽니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="350" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">별도 규칙 · 처음 선택은 1번</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><g transform="translate(50 88) scale(1)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><rect x="27" y="15" width="66" height="110" fill="#f4f4f4"/><path d="M73 72H85" stroke="#161616" stroke-width="3"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/><path d="M12 141H108" stroke="#0f62fe" stroke-width="5"/></g><text x="110" y="78" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">1번</text><text x="110" y="255" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">닫힌 문</text><text x="110" y="284" font-size="20" fill="#0f62fe" text-anchor="middle" font-weight="400">처음 선택</text><g transform="translate(240 88) scale(1)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><rect x="27" y="15" width="66" height="110" fill="#f4f4f4"/><path d="M73 72H85" stroke="#161616" stroke-width="3"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/></g><text x="300" y="78" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">2번</text><text x="300" y="255" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">닫힌 문</text><text x="300" y="284" font-size="20" fill="#0f62fe" text-anchor="middle" font-weight="600">가능하면 우선 공개</text><g transform="translate(430 88) scale(1)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><rect x="27" y="15" width="66" height="110" fill="#f4f4f4"/><path d="M73 72H85" stroke="#161616" stroke-width="3"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/></g><text x="490" y="78" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">3번</text><text x="490" y="255" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">닫힌 문</text><text x="490" y="284" font-size="20" fill="#525252" text-anchor="middle" font-weight="400"></text><text x="300" y="328" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">가능하면 2번의 꽝을 먼저 공개합니다</text></g></svg>
