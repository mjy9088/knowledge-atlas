<svg xmlns="http://www.w3.org/2000/svg" width="600" height="940" viewBox="0 0 600 940" role="img" aria-labelledby="title desc">
  <title id="title">2번이 열린 게임만 남겼을 때</title>
  <desc id="desc">처음 1번을 선택하고, 정답을 아는 진행자가 항상 미선택 오답 문을 열고 교환을 제안합니다. D2는 2번을 열어 오답을 보여 준 사건입니다. 상품이 1번일 때 진행자가 2번을 여는 확률 t에 따라 상품 위치 1,2,3번이 남는 확률은 t/3,0,1/3입니다. 교환 승률은 1/(1+t)로, t가 1/2,1,0일 때 각각 2/3,1/2,1입니다. 번호를 가리지 않은 전체 교환 전략의 승률과는 다른 조건부 질문입니다.</desc>
  <metadata>Original finite-case deduction and explanatory artwork, not historical data or a source figure. Review and publication remain pending.</metadata>
  <rect width="600" height="940" rx="18" fill="#f4f8f3"/>
  <g font-family="system-ui,Malgun Gothic,sans-serif" fill="#263e36">
    <text x="300" y="46" text-anchor="middle" font-size="28" font-weight="700">처음 1번 선택 · 이번 관측은 D2</text>
    <text x="300" y="87" text-anchor="middle" font-size="24">D2 = 진행자가 2번을 열어 오답을 보임</text>
    <text x="300" y="127" text-anchor="middle" font-size="24">정답을 아는 항상-오답 진행자</text>
    <text x="300" y="167" text-anchor="middle" font-size="24">상품이 1번일 때 2번을 고를 확률 = t</text>
    <path d="M30 190H570" stroke="#c4d7cc" stroke-width="2"/>
    <g text-anchor="middle" font-size="24" font-weight="700">
      <text x="120" y="233">상품 위치</text><text x="300" y="233">D2 우도</text><text x="480" y="233">남는 무게</text>
    </g>
    <g stroke="#c4d7cc" stroke-width="2">
      <rect x="30" y="258" width="540" height="80" rx="12" fill="#fff"/>
      <rect x="30" y="354" width="540" height="80" rx="12" fill="#fff"/>
      <rect x="30" y="450" width="540" height="80" rx="12" fill="#e1eee3"/>
    </g>
    <g text-anchor="middle" font-size="28">
      <text x="120" y="308">1번 · 1/3</text><text x="300" y="308">t</text><text x="480" y="308">t/3</text>
      <text x="120" y="404">2번 · 1/3</text><text x="300" y="404">0</text><text x="480" y="404">0</text>
      <text x="120" y="500">3번 · 1/3</text><text x="300" y="500">1</text><text x="480" y="500">1/3</text>
    </g>
    <text x="300" y="580" text-anchor="middle" font-size="24">교환하면 남은 3번으로 갑니다.</text>
    <text x="300" y="624" text-anchor="middle" font-size="28">P(D2) = t/3 + 1/3</text>
    <text x="300" y="670" text-anchor="middle" font-size="28" font-weight="700">교환 승률 = (1/3)/(t/3+1/3)</text>
    <text x="300" y="714" text-anchor="middle" font-size="32" font-weight="700">= 1/(1+t)</text>
    <path d="M30 748H570" stroke="#c4d7cc" stroke-width="2"/>
    <text x="300" y="794" text-anchor="middle" font-size="26">t=1/2 → 2/3 · t=1 → 1/2 · t=0 → 1</text>
    <text x="300" y="846" text-anchor="middle" font-size="24">전체 게임의 항상-교환 승률은 여전히 2/3</text>
    <text x="300" y="887" text-anchor="middle" font-size="24">지금은 ‘2번이 열린 게임’만 고른 것입니다.</text>
    <text x="300" y="924" text-anchor="middle" font-size="24">조건 사건이 달라지면 분모도 다시 만듭니다.</text>
  </g>
</svg>
