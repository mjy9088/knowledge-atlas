<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">어떤 정보에 조건을 걸었나요?</title><desc id="desc">아무 오답 문 공개와 특정 번호 문 공개는 서로 다른 조건 사건이다. 특정 번호를 조건으로 삼으면 동률 공개 정책이 중요할 수 있다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">어떤 정보에 조건을 걸었나요?</text><rect x="30" y="75" width="250" height="150" rx="12" fill="#e1eee3" stroke="#c4d7cc" stroke-width="2"/><rect x="320" y="75" width="250" height="150" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="155" y="120" text-anchor="middle" font-size="23" fill="#263e36">아무 오답 문 공개</text><text x="445" y="120" text-anchor="middle" font-size="23" fill="#263e36">특정 3번 문 공개</text><text x="155" y="178" text-anchor="middle" font-size="22" fill="#263e36">공개 번호를 무시</text><text x="445" y="178" text-anchor="middle" font-size="20" fill="#263e36">선택 정책의 우도 필요</text><text x="300" y="278" text-anchor="middle" font-size="22" fill="#263e36">같은 진행자여도 조건 사건이 다릅니다</text></g></svg>