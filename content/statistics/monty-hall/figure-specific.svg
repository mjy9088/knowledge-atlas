<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 455" role="img" aria-labelledby="title desc">
<title id="title">2번을 우선 여는 진행자의 게임을 골라 보기</title><desc id="desc">진행자는 항상 미선택 꽝을 열되 가능한 경우 2번을 우선합니다. 처음 1번 선택. 상품 1번과 3번에서 2번이 열리고, 상품 2번에서는 3번이 열립니다. 2번이 열린 경우만 고르면 상품 1번과 3번이 똑같이 남아 교환 승률은 1/2입니다.</desc>
<rect width="600" height="455" rx="16" fill="#f4f8f3"/>
<g font-family="system-ui,Malgun Gothic,sans-serif" fill="#263e36"><text x="300" y="35" font-size="23" text-anchor="middle" font-weight="700">정답을 아는 진행자 · 열 수 있으면 2번 우선</text><text x="300" y="71" font-size="22" text-anchor="middle">처음 1번 선택 · 2번이 열린 게임만 남기기</text><text x="90" y="114" font-size="20" text-anchor="middle">상품 위치</text><text x="280" y="114" font-size="20" text-anchor="middle">여는 문</text><text x="487" y="114" font-size="20" text-anchor="middle">2번이 열렸나?</text><rect x="20" y="135" width="560" height="51" rx="9" fill="#e1eee3" stroke="#b8cfc2"/><text x="90" y="168" font-size="22" text-anchor="middle">1번</text><text x="280" y="168" font-size="22" text-anchor="middle">2번</text><text x="487" y="168" font-size="22" text-anchor="middle">남김</text><rect x="20" y="197" width="560" height="51" rx="9" fill="#e8e7e3" stroke="#b8cfc2"/><text x="90" y="230" font-size="22" text-anchor="middle">2번</text><text x="280" y="230" font-size="22" text-anchor="middle">3번</text><text x="487" y="230" font-size="22" text-anchor="middle">제외</text><rect x="20" y="259" width="560" height="51" rx="9" fill="#e1eee3" stroke="#b8cfc2"/><text x="90" y="292" font-size="22" text-anchor="middle">3번</text><text x="280" y="292" font-size="22" text-anchor="middle">2번</text><text x="487" y="292" font-size="22" text-anchor="middle">남김</text><text x="300" y="355" font-size="23" text-anchor="middle">상품 1번과 3번만 같은 확률로 남습니다</text><text x="300" y="392" font-size="21" text-anchor="middle" font-weight="700">3번으로 바꾸면 두 경우 중 한 경우에서 승리: 1/2</text><text x="300" y="430" font-size="20" text-anchor="middle">전체 게임의 바꾸기 승률 2/3과는 다른 질문입니다</text></g></svg>
