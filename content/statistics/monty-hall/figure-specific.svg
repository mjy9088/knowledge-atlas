<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc"><title id="title">가능하면 2번의 꽝을 우선 여는 진행자</title><desc id="desc">처음 선택1번은 고정입니다. 닫힌 세 문 중2번을 먼저 여는 규칙이며,2번에 상품이 있어 열 수 없을 때는3번을 엽니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="260" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="33" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">별도 규칙 · 처음 선택은 1번</text><g transform="translate(68 76) scale(0.9)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/><path d="M15 139h90" stroke="#365c42" stroke-width="5"/><text x="60" y="-7" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">1번</text></g><g transform="translate(240 76) scale(0.9)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/><text x="60" y="-7" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">2번</text></g><g transform="translate(412 76) scale(0.9)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="