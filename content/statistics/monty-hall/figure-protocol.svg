<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-labelledby="title"><title id="title">표준 몬티 홀에서 정한 네 규칙</title><rect width="600" height="230" rx="16" fill="#f4f8f3"/>
<g fill="white" stroke="#c4d7cc" stroke-width="2"><rect x="15" y="85" width="125" height="105" rx="12"/><rect x="160" y="85" width="125" height="105" rx="12"/><rect x="305" y="85" width="125" height="105" rx="12"/><rect x="450" y="85" width="135" height="105" rx="12"/></g>
<g font-family="system-ui,sans-serif" font-size="24" fill="#263e36" text-anchor="middle"><text x="300" y="40">표준 문제에 추가한 규칙</text><text x="78" y="130">상품은</text><text x="78" y="165">균등 배치</text><text x="223" y="130">진행자는</text><text x="223" y="165">정답을 앎</text><text x="368" y="130">반드시</text><text x="368" y="165">꽝을 공개</text><text x="518" y="130">항상</text><text x="518" y="165">교환 제안</text></g></svg>
