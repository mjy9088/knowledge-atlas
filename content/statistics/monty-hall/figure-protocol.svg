<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 325" role="img" aria-labelledby="title desc"><title id="title">정답을 아는 진행자의 공개와 교환 규칙</title><desc id="desc">상품 위치는 세 문에 균등합니다. 그림은 상품과 첫 선택이1번인 한 가정 사례입니다. 진행자는 선택하지 않은 꽝2번을 열고 남은3번과 교환할 기회를 줍니다. 모든 게임에서 상품1번이라는 뜻이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="325" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="34" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">위치를 알고 · 꽝을 열고 · 교환 기회</text><g transform="translate(68 84) scale(0.9)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><path d="M60 40l8 17 19 3-14 13 3 19-16-9-17 9 4-19-14-13 19-3z" fill="#d5a23d" stroke="#8b6220" stroke-width="2"/><path d="M15 139h90" stroke="#365c42" stroke-width="5"/><text x="60" y="-7" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">1번</text></g><g transform="translate(240 84) scale(0.9)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><circle cx="67" cy="69" r="19" fill="#f1eee7" stroke="#b2a995"/><path d="M58 60l18 18m0-18L58 78" stroke="#827861" stroke-width="4" stroke-linecap="round"/><path d="M23 11l27 15v91l-27 12z" fill="#d5dfcf" stroke="#6b8776" stroke-width="2"/><circle cx="42" cy="74" r="3" fill="#597763"/><text x="60" y="-7" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">2번</text></g><g transform="translate(412 84) scale(0.9)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/><text x="60" y="-7" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">3번</text></g><text x="122" y="239" text-anchor="middle" font-size="20" fill="#263f36" font-weight="400">예시: 상품·내 선택</text><text x="294" y="239" text-anchor="middle" font-size="21" fill="#39775e" font-weight="400">꽝만 공개</text><text x="466" y="239" text-anchor="middle" font-size="21" fill="#263f36" font-weight="400">남은 문</text><path d="M125 261Q295 305 465 261" fill="none" stroke="#39775e" stroke-width="3"/><text x="300" y="303" text-anchor="middle" font-size="20" fill="#263f36" font-weight="400">항상 바꿀 기회를 줍니다</text></g></svg>
