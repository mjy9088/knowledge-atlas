<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 397" role="img" aria-labelledby="title desc"><title id="title">정답을 아는 진행자의 공개와 교환 규칙</title><desc id="desc">상품은 세 문에 균등합니다. 정답을 아는 진행자는 선택하지 않은 꽝만 공개하고 항상 교환 기회를 줍니다. 가능한 꽝이 두 개면 각각1/2로 고릅니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="397" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">알고 꽝을 여는 진행자의 규칙</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="36" y="87" font-size="22" fill="#0f62fe" text-anchor="middle" font-weight="600">01</text><text x="77" y="87" font-size="24" fill="#161616" text-anchor="start" font-weight="600">상품 위치를 알고 있음</text><text x="77" y="116" font-size="22" fill="#525252" text-anchor="start" font-weight="400">상품은 세 문에 균등하게 배치</text><path d="M77 130H576" stroke="#e0e0e0" stroke-width="1"/><text x="36" y="162" font-size="22" fill="#0f62fe" text-anchor="middle" font-weight="600">02</text><text x="77" y="162" font-size="24" fill="#161616" text-anchor="start" font-weight="600">선택하지 않은 꽝만 공개</text><text x="77" y="191" font-size="22" fill="#525252" text-anchor="start" font-weight="400">고른 문과 상품은 열지 않음</text><path d="M77 205H576" stroke="#e0e0e0" stroke-width="1"/><text x="36" y="237" font-size="22" fill="#0f62fe" text-anchor="middle" font-weight="600">03</text><text x="77" y="237" font-size="24" fill="#161616" text-anchor="start" font-weight="600">항상 교환 기회를 제공</text><text x="77" y="266" font-size="22" fill="#525252" text-anchor="start" font-weight="400">닫힌 나머지 문으로 바꿀 수 있음</text><path d="M77 280H576" stroke="#e0e0e0" stroke-width="1"/><text x="36" y="312" font-size="22" fill="#0f62fe" text-anchor="middle" font-weight="600">04</text><text x="77" y="312" font-size="24" fill="#161616" text-anchor="start" font-weight="600">꽝 둘이면 반반 선택</text><text x="77" y="341" font-size="22" fill="#525252" text-anchor="start" font-weight="400">가능한 두 공개를 각각 1/2로</text><path d="M77 355H576" stroke="#e0e0e0" stroke-width="1"/></g></svg>
