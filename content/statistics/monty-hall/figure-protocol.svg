<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">표준 문제에서 정한 공개 규칙</title><desc id="desc">상품 균등 → 정답을 앎 → 항상 오답 → 항상 교환. 오답 둘 중 고를 수 있으면 균등하게 선택</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">표준 문제에서 정한 공개 규칙</text><rect x="18" y="95" width="119.5" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="77.75" y="155" text-anchor="middle" font-size="20" fill="#263e36">상품 균등</text><path d="M138.5 145 L151.5 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="155.5" y="95" width="119.5" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="215.25" y="155" text-anchor="middle" font-size="20" fill="#263e36">정답을 앎</text><path d="M276 145 L289 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="293" y="95" width="119.5" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="352.75" y="155" text-anchor="middle" font-size="20" fill="#263e36">항상 오답</text><path d="M413.5 145 L426.5 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="430.5" y="95" width="119.5" height="100" rx="12" fill="#e1eee3" stroke="#c4d7cc" stroke-width="2"/><text x="490.25" y="155" text-anchor="middle" font-size="20" fill="#263e36">항상 교환</text><text x="300" y="252" text-anchor="middle" font-size="20" fill="#263e36">오답 둘 중 고를 수 있으면 균등하게 선택</text></g></svg>