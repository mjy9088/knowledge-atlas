<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 335" role="img" aria-labelledby="title desc"><title id="title">모르는 진행자의 공개 경로와 제외</title><desc id="desc">처음 선택1번. 상품 위치각1/3, 공개 문 선택각1/2. 여섯 경로는각1/6입니다. 문제는 꽝이 열린 뒤의 승률을 묻기 때문에 상품을 연 두 경로는 조건에 맞지 않습니다.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><rect width="600" height="335" rx="14" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="30" text-anchor="middle" font-size="23">처음 1번 선택 → 상품 위치 → 공개 문</text><path d="M300 40V52M150.0 52H450.0" stroke="#91aa96" fill="none"/><path d="M150.0 52V70" stroke="#91aa96"/><text x="150.0" y="88" text-anchor="middle" font-size="20">상품 2번 · 1/3</text><text x="150.0" y="114" text-anchor="middle" font-size="18">처음 틀림</text><path d="M61.0 121V168H67.0" stroke="#91aa96" fill="none"/><rect x="67.0" y="132" width="170" height="69" rx="7" fill="#eeece7" stroke="#b8c9ba" stroke-dasharray="4 3"/><text x="150.0" y="151" text-anchor="middle" font-size="18">2번 엶 (1/2)</text><text x="150.0" y="173" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="150.0" y="194" text-anchor="middle" font-size="18">× 조건 밖</text><path d="M61.0 121V246H67.0" stroke="#91aa96" fill="none"/><rect x="67.0" y="210" width="170" height="69" rx="7" fill="#e3f0e5" stroke="#b8c9ba"/><text x="150.0" y="229" text-anchor="middle" font-size="18">3번 엶 (1/2)</text><text x="150.0" y="251" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="150.0" y="272" text-anchor="middle" font-size="18">교환: 상품</text><path d="M450.0 52V70" stroke="#91aa96"/><text x="450.0" y="88" text-anchor="middle" font-size="20">상품 3번 · 1/3</text><text x="450.0" y="114" text-anchor="middle" font-size="18">처음 틀림</text><path d="M361.0 121V168H367.0" stroke="#91aa96" fill="none"/><rect x="367.0" y="132" width="170" height="69" rx="7" fill="#e3f0e5" stroke="#b8c9ba"/><text x="450.0" y="151" text-anchor="middle" font-size="18">2번 엶 (1/2)</text><text x="450.0" y="173" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="450.0" y="194" text-anchor="middle" font-size="18">교환: 상품</text><path d="M361.0 121V246H367.0" stroke="#91aa96" fill="none"/><rect x="367.0" y="210" width="170" height="69" rx="7" fill="#eeece7" stroke="#b8c9ba" stroke-dasharray="4 3"/><text x="450.0" y="229" text-anchor="middle" font-size="18">3번 엶 (1/2)</text><text x="450.0" y="251" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="450.0" y="272" text-anchor="middle" font-size="18">× 조건 밖</text><text x="300" y="316" text-anchor="middle" font-size="19">문제의 조건은 꽝 공개: 상품 공개는 조건 밖</text></g></svg>
