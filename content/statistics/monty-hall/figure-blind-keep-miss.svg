<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 432" role="img" aria-labelledby="title desc"><title id="title">모르는 진행자의 공개 경로와 제외</title><desc id="desc">처음 선택1번. 상품 위치각1/3, 공개 문 선택각1/2. 여섯 경로는각1/6입니다. 문제는 꽝이 열린 뒤의 승률을 묻기 때문에 상품을 연 두 경로는 조건에 맞지 않습니다.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="432" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">처음 선택 1번 → 상품 위치 → 공개 문</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><path d="M300 52L300 70" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M150 70H450" stroke="#8d8d8d" stroke-width="1"/><path d="M150 70L150 91" stroke="#8d8d8d" stroke-width="1" fill="none"/><text x="150" y="113" font-size="22" fill="#161616" text-anchor="middle" font-weight="600">상품 2번 · 1/3</text><text x="150" y="139" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">처음 틀림</text><path d="M68 151H232" stroke="#161616" stroke-width="2"/><path d="M60 151L60 213" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M60 213H71" stroke="#8d8d8d" stroke-width="1"/><rect x="220" y="163" width="8" height="91" fill="url(#hatch)"/><text x="150" y="183" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">2번 엶 · 1/2</text><text x="150" y="209" font-size="21" fill="#525252" text-anchor="middle" font-weight="400">1/3×1/2=1/6</text><rect x="142.0" y="219" width="16" height="7" fill="url(#hatch)"/><text x="150" y="251" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">× 조건 밖</text><path d="M72 262H228" stroke="#e0e0e0" stroke-width="1"/><path d="M60 151L60 316" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M60 316H71" stroke="#8d8d8d" stroke-width="1"/><text x="150" y="286" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">3번 엶 · 1/2</text><text x="150" y="312" font-size="21" fill="#525252" text-anchor="middle" font-weight="400">1/3×1/2=1/6</text><rect x="142.0" y="322" width="16" height="7" fill="#007d79"/><text x="150" y="354" font-size="22" fill="#007d79" text-anchor="middle" font-weight="400">교환: 상품</text><path d="M72 365H228" stroke="#e0e0e0" stroke-width="1"/><path d="M450 70L450 91" stroke="#8d8d8d" stroke-width="1" fill="none"/><text x="450" y="113" font-size="22" fill="#161616" text-anchor="middle" font-weight="600">상품 3번 · 1/3</text><text x="450" y="139" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">처음 틀림</text><path d="M368 151H532" stroke="#161616" stroke-width="2"/><path d="M360 151L360 213" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M360 213H371" stroke="#8d8d8d" stroke-width="1"/><text x="450" y="183" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">2번 엶 · 1/2</text><text x="450" y="209" font-size="21" fill="#525252" text-anchor="middle" font-weight="400">1/3×1/2=1/6</text><rect x="442.0" y="219" width="16" height="7" fill="#007d79"/><text x="450" y="251" font-size="22" fill="#007d79" text-anchor="middle" font-weight="400">교환: 상품</text><path d="M372 262H528" stroke="#e0e0e0" stroke-width="1"/><path d="M360 151L360 316" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M360 316H371" stroke="#8d8d8d" stroke-width="1"/><rect x="520" y="266" width="8" height="91" fill="url(#hatch)"/><text x="450" y="286" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">3번 엶 · 1/2</text><text x="450" y="312" font