<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 396" role="img" aria-labelledby="title desc"><title id="title">남긴 두 배치의 한 승리와 전체 세 배치의 두 승리</title><desc id="desc">2번을 연 배치만 보면 상품1번과3번 중3번에서 교환 승리하여1/2입니다. 전체 배치에서는 상품2번과3번에서 이겨2/3입니다. 칸은 같은 확률의 상품 배치이며 실제 표본이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="396" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">같은 상품 배치 · 서로 다른 집계 범위</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="285" y="86" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">상품 1번</text><text x="385" y="86" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">상품 2번</text><text x="485" y="86" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">상품 3번</text><text x="24" y="134" font-size="24" fill="#161616" text-anchor="start" font-weight="600">2번의 꽝을 연 배치만</text><rect x="259" y="108" width="52" height="52" fill="#ffffff" stroke="#8d8d8d"/><text x="285.0" y="145.44" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="359" y="108" width="52" height="52" fill="url(#hatch)" stroke="#8d8d8d"/><text x="385.0" y="145.44" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">×</text><rect x="459" y="108" width="52" height="52" fill="#007d79" stroke="#007d79"/><text x="485.0" y="145.44" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><text x="24" y="193" font-size="22" fill="#161616" text-anchor="start" font-weight="400">교환 승률</text><text x="552" y="193" font-size="28" fill="#007d79" text-anchor="end" font-weight="600">1 / 2 = 1/2</text><path d="M24 211H576" stroke="#e0e0e0" stroke-width="1"/><text x="24" y="254" font-size="24" fill="#161616" text-anchor="start" font-weight="600">전체 상품 배치</text><rect x="259" y="228" width="52" height="52" fill="#ffffff" stroke="#8d8d8d"/><text x="285.0" y="265.44" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="359" y="228" width="52" height="52" fill="#007d79" stroke="#007d79"/><text x="385.0" y="265.44" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="459" y="228" width="52" height="52" fill="#007d79" stroke="#007d79"/><text x="485.0" y="265.44" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><text x="24" y="313" font-size="22" fill="#161616" text-anchor="start" font-weight="400">교환 승률</text><text x="552" y="313" font-size="28" fill="#007d79" text-anchor="end" font-weight="600">2 / 3 = 2/3</text><path d="M24 331H576" stroke="#e0e0e0" stroke-width="1"/><text x="300" y="373" font-size="21" fill="#525252" text-anchor="middle" font-weight="400">각 칸은 같은 확률의 상품 배치 · 표본이 아닙니다</text></g></svg>
