<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 295" role="img" aria-labelledby="title desc"><title id="title">남긴 두 배치의 한 승리와 전체 세 배치의 두 승리</title><desc id="desc">2번을 연 배치만 보면 상품1번과3번 중3번에서 교환 승리하여1/2입니다. 전체 배치에서는 상품2번과3번에서 이겨2/3입니다. 동그라미는 같은 확률의 상품 배치이며 실제 표본이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="295" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="33" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">같은 상품 배치, 서로 다른 집계 범위</text><text x="80" y="118" text-anchor="middle" font-size="21" fill="#263f36" font-weight="400">2번 공개만</text><circle cx="205" cy="110" r="29" fill="#ece8dd" stroke="#a8b5a8" /><text x="205" y="120" text-anchor="middle" font-size="29" fill="#263f36" font-weight="400">×</text><text x="205" y="161" text-anchor="middle" font-size="17" fill="#263f36" font-weight="400">상품 1번</text><circle cx="305" cy="110" r="29" fill="#f6f9f2" stroke="#a8b5a8" stroke-dasharray="4 4"/><text x="305" y="120" text-anchor="middle" font-size="29" fill="#263f36" font-weight="400">—</text><text x="305" y="161" text-anchor="middle" font-size="17" fill="#263f36" font-weight="400">상품 2번</text><circle cx="405" cy="110" r="29" fill="#39775e" stroke="#39775e" /><text x="405" y="120" text-anchor="middle" font-size="29" fill="#fff" font-weight="400">✓</text><text x="405" y="161" text-anchor="middle" font-size="17" fill="#263f36" font-weight="400">상품 3번</text><text x="534" y="122" text-anchor="middle" font-size="34" fill="#39775e" font-weight="700">1/2</text><text x="80" y="233" text-anchor="middle" font-size="21" fill="#263f36" font-weight="400">전체 게임</text><circle cx="205" cy="225" r="29" fill="#ece8dd" stroke="#a8b5a8" /><text x="205" y="235" text-anchor="middle" font-size="29" fill="#263f36" font-weight="400">×</text><text x="205" y="276" text-anchor="middle" font-size="17" fill="#263f36" font-weight="400">상품 1번</text><circle cx="305" cy="225" r="29" fill="#39775e" stroke="#39775e" /><text x="305" y="235" text-anchor="middle" font-size="29" fill="#fff" font-weight="400">✓</text><text x="305" y="276" text-anchor="middle" font-size="17" fill="#263f36" font-weight="400">상품 2번</text><circle cx="405" cy="225" r="29" fill="#39775e" stroke="#39775e" /><text x="405" y="235" text-anchor="middle" font-size="29" fill="#fff" font-weight="400">✓</text><text x="405" y="276" text-anchor="middle" font-size="17" fill="#263f36" font-weight="400">상품 3번</text><text x="534" y="237" text-anchor="middle" font-size="34" fill="#39775e" font-weight="700">2/3</text></g></svg>
