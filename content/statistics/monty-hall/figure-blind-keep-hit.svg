<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" role="img" aria-labelledby="title desc">
<title id="title">처음 맞힌 경우: 두 경우 모두 남음</title><desc id="desc">처음 선택 1번. 상품 위치와 균등한 공개 문 선택을 합친 같은 확률의 경우입니다. 상품을 연 경우는 제외합니다.</desc>
<metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata>
<rect width="600" height="190" rx="16" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="35" font-size="23" text-anchor="middle">처음 맞힌 경우: 두 경우 모두 남음</text><rect x="20" y="60" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="155" y="86" font-size="20" text-anchor="middle">상품 1번 · 2번을 엶</text><text x="155" y="118" font-size="20" text-anchor="middle">✓ 남김 · 바꾸면 꽝</text><rect x="310" y="60" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="445" y="86" font-size="20" text-anchor="middle">상품 1번 · 3번을 엶</text><text x="445" y="118" font-size="20" text-anchor="middle">✓ 남김 · 바꾸면 꽝</text><text x="300" y="175" font-size="21" text-anchor="middle">각 칸은 같은 확률의 한 경우입니다</text></g></svg>
