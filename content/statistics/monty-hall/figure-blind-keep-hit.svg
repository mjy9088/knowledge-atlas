<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 335" role="img" aria-labelledby="title desc"><title id="title">모르는 진행자의 공개 경로와 제외</title><desc id="desc">처음 선택1번. 상품 위치각1/3, 공개 문 선택각1/2. 여섯 경로는각1/6이며 상품을 연 두 경로는 꽝을 본 게임에서 제외합니다.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><rect width="600" height="335" rx="14" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="30" text-anchor="middle" font-size="23">처음 1번 선택 → 상품 위치 → 공개 문</text><path d="M300 40V52M300.0 52H300.0" stroke="#91aa96" fill="none"/><path d="M300.0 52V70" stroke="#91aa96"/><text x="300.0" y="88" text-anchor="middle" font-size="20">상품 1번 · 1/3</text><text x="300.0" y="114" text-anchor="middle" font-size="18">처음 맞음</text><path d="M211.0 121V168H217.0" stroke="#91aa96" fill="none"/><rect x="217.0" y="132" width="170" height="69" rx="7" fill="#fff" stroke="#b8c9ba"/><text x="300.0" y="151" text-anchor="middle" font-size="18">2번 엶 (1/2)</text><text x="300.0" y="173" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="300.0" y="194" text-anchor="middle" font-size="18">교환: 꽝</text><path d="M211.0 121V246H217.0" stroke="#91aa96" fill="none"/><rect x="217.0" y="210" width="170" height="69" rx="7" fill="#fff" stroke="#b8c9ba"/><text x="300.0" y="229" text-anchor="middle" font-size="18">3번 엶 (1/2)</text><text x="300.0" y="251" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="300.0" y="272" text-anchor="middle" font-size="18">교환: 꽝</text><text x="300" y="316" text-anchor="middle" font-size="19">상품 공개 경로는 꽝 관측의 집계에서 제외합니다</text></g></svg>
