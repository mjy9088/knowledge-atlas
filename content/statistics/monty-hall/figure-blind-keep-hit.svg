<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 432" role="img" aria-labelledby="title desc"><title id="title">모르는 진행자의 공개 경로와 제외</title><desc id="desc">처음 선택1번. 상품 위치각1/3, 공개 문 선택각1/2. 여섯 경로는각1/6이며 상품을 연 두 경로는 꽝을 본 게임에서 제외합니다.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="432" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">처음 선택 1번 → 상품 위치 → 공개 문</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><path d="M300 52L300 70" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M300 70H300" stroke="#8d8d8d" stroke-width="1"/><path d="M300 70L300 91" stroke="#8d8d8d" stroke-width="1" fill="none"/><text x="300" y="113" font-size="22" fill="#161616" text-anchor="middle" font-weight="600">상품 1번 · 1/3</text><text x="300" y="139" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">처음 맞음</text><path d="M218 151H382" stroke="#161616" stroke-width="2"/><path d="M210 151L210 213" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M210 213H221" stroke="#8d8d8d" stroke-width="1"/><text x="300" y="183" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">2번 엶 · 1/2</text><text x="300" y="209" font-size="21" fill="#525252" text-anchor="middle" font-weight="400">1/3×1/2=1/6</text><rect x="292.0" y="219" width="16" height="7" fill="#525252"/><text x="300" y="251" font-size="22" fill="#da1e28" text-anchor="middle" font-weight="400">교환: 꽝</text><path d="M222 262H378" stroke="#e0e0e0" stroke-width="1"/><path d="M210 151L210 316" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M210 316H221" stroke="#8d8d8d" stroke-width="1"/><text x="300" y="286" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">3번 엶 · 1/2</text><text x="300" y="312" font-size="21" fill="#525252" text-anchor="middle" font-weight="400">1/3×1/2=1/6</text><rect x="292.0" y="322" width="16" height="7" fill="#525252"/><text x="300" y="354" font-size="22" fill="#da1e28" text-anchor="middle" font-weight="400">교환: 꽝</text><path d="M222 365H378" stroke="#e0e0e0" stroke-width="1"/><text x="300" y="410" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">한 칸 = 확률 1/6 · 실제 실험 횟수가 아닙니다</text></g></svg>
