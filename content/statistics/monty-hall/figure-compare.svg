<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">남은 네 경우 중 두 경우에서 교환 승리</title><desc id="desc">처음 선택 1번. 상품 위치와 균등한 공개 문 선택을 합친 같은 확률의 경우입니다. 상품을 연 경우는 제외합니다.</desc>
<metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata>
<rect width="600" height="370" rx="16" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="35" font-size="23" text-anchor="middle">남은 네 경우 중 두 경우에서 교환 승리</text><rect x="20" y="60" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="155" y="86" font-size="20" text-anchor="middle">상품 1번 · 2번을 엶</text><text x="155" y="118" font-size="20" text-anchor="middle">✓ 남김 · 바꾸면 꽝</text><rect x="310" y="60" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="445" y="86" font-size="20" text-anchor="middle">상품 1번 · 3번을 엶</text><text x="445" y="118" font-size="20" text-anchor="middle">✓ 남김 · 바꾸면 꽝</text><rect x="20" y="150" width="270" height="77" rx="8" fill="#eceae5" stroke="#b8c9ba"/><text x="155" y="176" font-size="20" text-anchor="middle">상품 2번 · 2번을 엶</text><text x="155" y="208" font-size="20" text-anchor="middle">× 상품 공개로 제외</text><rect x="310" y="150" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="445" y="176" font-size="20" text-anchor="middle">상품 2번 · 3번을 엶</text><text x="445" y="208" font-size="20" text-anchor="middle">✓ 남김 · 바꾸면 상품</text><rect x="20" y="240" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="155" y="266" font-size="20" text-anchor="middle">상품 3번 · 2번을 엶</text><text x="155" y="298" font-size="20" text-anchor="middle">✓ 남김 · 바꾸면 상품</text><rect x="310" y="240" width="270" height="77" rx="8" fill="#eceae5" stroke="#b8c9ba"/><text x="445" y="266" font-size="20" text-anchor="middle">상품 3번 · 3번을 엶</text><text x="445" y="298" font-size="20" text-anchor="middle">× 상품 공개로 제외</text><text x="300" y="355" font-size="21" text-anchor="middle">2/4 = 1/2</text></g></svg>
