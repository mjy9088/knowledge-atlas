<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="title desc">
<title id="title">상품을 연 두 칸을 제외하면 네 칸이 남습니다</title><desc id="desc">처음 1번 선택. 상품과 연 문 조합은 같은 확률의 여섯 가지. 상품 2번을 연 경우와 3번을 연 경우를 제외하면 네 가지가 남고, 그중 두 가지에서 바꾸면 상품을 얻습니다.</desc>
<rect width="600" height="490" rx="16" fill="#f4f8f3"/>
<g font-family="system-ui,Malgun Gothic,sans-serif" fill="#263e36"><text x="300" y="35" font-size="24" text-anchor="middle" font-weight="700">정답을 모르고 두 문 중 하나를 엽니다</text><text x="83" y="76" font-size="20" text-anchor="middle">상품</text><text x="209" y="76" font-size="20" text-anchor="middle">여는 문</text><text x="368" y="76" font-size="20" text-anchor="middle">꽝을 본 게임만</text><text x="519" y="76" font-size="20" text-anchor="middle">바꾸면</text><rect x="20" y="94" width="560" height="39" rx="9" fill="#fff" stroke="#b8cfc2"/><text x="83" y="121" font-size="20" text-anchor="middle">1번</text><text x="209" y="121" font-size="20" text-anchor="middle">2번</text><text x="368" y="121" font-size="19" text-anchor="middle">남김</text><text x="519" y="121" font-size="20" text-anchor="middle">꽝</text><rect x="20" y="139" width="560" height="39" rx="9" fill="#fff" stroke="#b8cfc2"/><text x="83" y="166" font-size="20" text-anchor="middle">1번</text><text x="209" y="166" font-size="20" text-anchor="middle">3번</text><text x="368" y="166" font-size="19" text-anchor="middle">남김</text><text x="519" y="166" font-size="20" text-anchor="middle">꽝</text><rect x="20" y="184" width="560" height="39" rx="9" fill="#e8e7e3" stroke="#b8cfc2"/><text x="83" y="211" font-size="20" text-anchor="middle">2번</text><text x="209" y="211" font-size="20" text-anchor="middle">2번</text><text x="368" y="211" font-size="19" text-anchor="middle">상품 공개 · 제외</text><text x="519" y="211" font-size="20" text-anchor="middle">—</text><path d="M30 203H570" stroke="#69716c" stroke-width="1.5"/><rect x="20" y="229" width="560" height="39" rx="9" fill="#e1eee3" stroke="#b8cfc2"/><text x="83" y="256" font-size="20" text-anchor="middle">2번</text><text x="209" y="256" font-size="20" text-anchor="middle">3번</text><text x="368" y="256" font-size="19" text-anchor="middle">남김</text><text x="519" y="256" font-size="20" text-anchor="middle">상품</text><rect x="20" y="274" width="560" height="39" rx="9" fill="#e1eee3" stroke="#b8cfc2"/><text x="83" y="301" font-size="20" text-anchor="middle">3번</text><text x="209" y="301" font-size="20" text-anchor="middle">2번</text><text x="368" y="301" font-size="19" text-anchor="middle">남김</text><text x="519" y="301" font-size="20" text-anchor="middle">상품</text><rect x="20" y="319" width="560" height="39" rx="9" fill="#e8e7e3" stroke="#b8cfc2"/><text x="83" y="346" font-size="20" text-anchor="middle">3번</text><text x="209" y="346" font-size="20" text-anchor="middle">3번</text><text x="368" y="346" font-size="19" text-anchor="middle">상품 공개 · 제외</text><text x="519" y="346" font-size="20" text-anchor="middle">—</text><path d="M30 338H570" stroke="#69716c" stroke-width="1.5"/><text x="300" y="398" font-size="21" text-anchor="middle" font-weight="700">같은 확률의 여섯 칸 → 네 칸 남음 → 두 칸 승리</text><text x="300" y="433" font-size="24" text-anchor="middle" font-weight="700">바꾸기 승률: 2/4 = 1/2</text><text x="300" y="467" font-size="18" text-anchor="middle">계산을 위한 여섯 칸 · 실제 여섯 번의 결과가 아님</text></g></svg>
