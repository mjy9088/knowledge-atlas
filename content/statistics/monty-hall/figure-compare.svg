<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">같은 오답 관측, 다른 과정</title><desc id="desc">정답을 알고 항상 오답을 공개하면 교환 승률 2/3. 모르고 무작위로 공개한 뒤 오답을 본 실행만 남기면 가중치가 1/3 대 1/3으로 같아져 교환 승률 1/2.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">같은 오답 관측, 다른 과정</text><rect x="20" y="65" width="265" height="170" rx="12" fill="#e1eee3" stroke="#c4d7cc" stroke-width="2"/><rect x="315" y="65" width="265" height="170" rx="12" fill="#e1eafa" stroke="#c4d7cc" stroke-width="2"/><text x="152" y="105" text-anchor="middle" font-size="22" fill="#263e36">정답을 아는 진행자</text><text x="447" y="105" text-anchor="middle" font-size="22" fill="#263e36">모르고 무작위 공개</text><text x="152" y="155" text-anchor="middle" font-size="20" fill="#263e36">맞음 1/3 · 틀림 2/3</text><text x="447" y="155" text-anchor="middle" font-size="20" fill="#263e36">1/3×1 · 2/3×1/2</text><text x="152" y="207" text-anchor="middle" font-size="30" fill="#263e36">교환: 2/3</text><text x="447" y="207" text-anchor="middle" font-size="30" fill="#263e36">교환: 1/2</text><text x="300" y="278" text-anchor="middle" font-size="22" fill="#263e36">오답을 공개한 실행에 조건을 걸었어요</text></g></svg>