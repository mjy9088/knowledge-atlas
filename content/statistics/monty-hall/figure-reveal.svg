<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-labelledby="title desc">
<title id="title">꽝이 공개된 뒤 남은 두 문</title><desc id="desc">선택 1번, 공개 3번은 꽝, 남은 문은 2번입니다. 이것은 한 장면의 예시이며 진행자 규칙을 입증하지 않습니다.</desc>
<metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata>
<rect width="600" height="270" rx="16" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="37" font-size="24" text-anchor="middle">예시: 1번 선택 → 3번에서 꽝 공개</text><rect x="30" y="65" width="160" height="155" rx="10" fill="#fff" stroke="#365c42" stroke-width="3"/><text x="110" y="103" font-size="22" text-anchor="middle">1번 문</text><text x="110" y="155" font-size="24" text-anchor="middle">닫힌 문</text><text x="110" y="197" font-size="18" text-anchor="middle">내 선택</text><rect x="220" y="65" width="160" height="155" rx="10" fill="#fff" stroke="#b8c9ba" stroke-width="3"/><text x="300" y="103" font-size="22" text-anchor="middle">2번 문</text><text x="300" y="155" font-size="24" text-anchor="middle">닫힌 문</text><text x="300" y="197" font-size="18" text-anchor="middle"></text><rect x="410" y="65" width="160" height="155" rx="10" fill="#eee8df" stroke="#b8c9ba" stroke-width="3"/><text x="490" y="103" font-size="22" text-anchor="middle">3번 문</text><text x="490" y="155" font-size="24" text-anchor="middle">꽝 공개</text><text x="490" y="197" font-size="18" text-anchor="middle">진행자가 엶</text></g></svg>
