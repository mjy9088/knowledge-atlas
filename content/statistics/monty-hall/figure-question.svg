<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-labelledby="title desc">
<title id="title">먼저 문 하나를 골라 보세요</title><desc id="desc">세 문은 모두 닫혀 있으며 상품 위치와 당첨 확률의 답은 표시되지 않았습니다.</desc>
<metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata>
<rect width="600" height="270" rx="16" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="37" font-size="23" text-anchor="middle">셋 중 하나만 당첨 · 아직 모두 닫혀 있습니다</text><rect x="30" y="65" width="160" height="155" rx="10" fill="#fff" stroke="#b8c9ba" stroke-width="3"/><text x="110" y="103" font-size="22" text-anchor="middle">1번 문</text><text x="110" y="155" font-size="24" text-anchor="middle">닫힌 문</text><text x="110" y="197" font-size="18" text-anchor="middle"></text><rect x="220" y="65" width="160" height="155" rx="10" fill="#fff" stroke="#b8c9ba" stroke-width="3"/><text x="300" y="103" font-size="22" text-anchor="middle">2번 문</text><text x="300" y="155" font-size="24" text-anchor="middle">닫힌 문</text><text x="300" y="197" font-size="18" text-anchor="middle"></text><rect x="410" y="65" width="160" height="155" rx="10" fill="#fff" stroke="#b8c9ba" stroke-width="3"/><text x="490" y="103" font-size="22" text-anchor="middle">3번 문</text><text x="490" y="155" font-size="24" text-anchor="middle">닫힌 문</text><text x="490" y="197" font-size="18" text-anchor="middle"></text></g></svg>
