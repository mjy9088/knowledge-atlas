<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">둘 남았다는 사실만으로 충분할까요?</title><desc id="desc">1번 문은 내 선택, 3번 문은 오답으로 공개됐고 2번 문은 남아 있다. 공개 규칙은 아직 주어지지 않았다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">둘 남았다는 사실만으로 충분할까요?</text><rect x="45" y="70" width="145" height="155" rx="12" fill="#dce9fb" stroke="#c4d7cc" stroke-width="2"/><text x="117" y="120" text-anchor="middle" font-size="27" fill="#263e36">1번 문</text><text x="117" y="180" text-anchor="middle" font-size="23" fill="#263e36">내 선택</text><rect x="225" y="70" width="145" height="155" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="297" y="120" text-anchor="middle" font-size="27" fill="#263e36">2번 문</text><text x="297" y="180" text-anchor="middle" font-size="23" fill="#263e36">남은 문</text><rect x="405" y="70" width="145" height="155" rx="12" fill="#f5e7d4" stroke="#c4d7cc" stroke-width="2"/><text x="477" y="120" text-anchor="middle" font-size="27" fill="#263e36">3번 문</text><text x="477" y="180" text-anchor="middle" font-size="23" fill="#263e36">오답 공개</text><text x="300" y="278" text-anchor="middle" font-size="22" fill="#263e36">진행자는 어떤 규칙으로 문을 열었나요?</text></g></svg>