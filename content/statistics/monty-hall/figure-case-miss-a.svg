<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title desc"><title id="title">상품 2번을 가정한 경우</title><desc id="desc">처음 선택 1번, 상품 2번. 진행자는 3번의 꽝을 엽니다. 2번으로 바꾸면 상품.</desc><metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="410" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">가정 B · 상품이 2번에 있다면</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><g transform="translate(50 88) scale(1)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><rect x="27" y="15" width="66" height="110" fill="#f4f4f4"/><path d="M73 72H85" stroke="#161616" stroke-width="3"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/><path d="M12 141H108" stroke="#0f62fe" stroke-width="5"/></g><text x="110" y="78" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">1번</text><text x="110" y="255" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">닫힌 문</text><text x="110" y="284" font-size="20" fill="#0f62fe" text-anchor="middle" font-weight="400">처음 선택</text><g transform="translate(240 88) scale(1)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><path d="M60 41l21 28-21 28-21-28z" fill="#007d79"/><path d="M49 69l8 8 15-17" fill="none" stroke="#fff" stroke-width="4"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/></g><text x="300" y="78" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">2번</text><text x="300" y="255" font-size="22" fill="#007d79" text-anchor="middle" font-weight="400">상품</text><text x="300" y="284" font-size="20" fill="#525252" text-anchor="middle" font-weight="400"></text><g transform="translate(430 88) scale(1)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><path d="M48 56l25 25m0-25L48 81" stroke="#da1e28" stroke-width="5"/><path d="M23 12l22 14v91l-22 12z" fill="#f4f4f4" stroke="#161616" stroke-width="2"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/></g><text x="490" y="78" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">3번</text><text x="490" y="255" font-size="22" fill="#da1e28" text-anchor="middle" font-weight="400">꽝 공개</text><text x="490" y="284" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">진행자가 엶</text><path d="M110 306V320H300V306" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="205.0" y="349" font-size="22" fill="#0f62fe" text-anchor="middle" font-weight="400">교환</text><text x="300" y="385" font-size="22" fill="#161616" text-anchor="middle" font-weight="400">처음 틀림 → 바꾸면 상품</text></g></svg>
