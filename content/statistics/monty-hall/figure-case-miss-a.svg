<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" role="img" aria-labelledby="title desc">
<title id="title">상품 2번을 가정한 경우</title><desc id="desc">처음 선택 1번, 상품 2번. 진행자는 3번의 꽝을 엽니다. 2번으로 바꾸면 상품.</desc>
<metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata>
<rect width="600" height="275" rx="16" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="37" font-size="24" text-anchor="middle">가정: 상품이 2번에 있다면</text><rect x="30" y="65" width="160" height="155" rx="10" fill="#fff" stroke="#365c42" stroke-width="3"/><text x="110" y="103" font-size="22" text-anchor="middle">1번 문</text><text x="110" y="155" font-size="24" text-anchor="middle">닫힌 문</text><text x="110" y="197" font-size="18" text-anchor="middle">내 선택</text><rect x="220" y="65" width="160" height="155" rx="10" fill="#e0edde" stroke="#b8c9ba" stroke-width="3"/><text x="300" y="103" font-size="22" text-anchor="middle">2번 문</text><text x="300" y="155" font-size="24" text-anchor="middle">상품</text><text x="300" y="197" font-size="18" text-anchor="middle"></text><rect x="410" y="65" width="160" height="155" rx="10" fill="#eee8df" stroke="#b8c9ba" stroke-width="3"/><text x="490" y="103" font-size="22" text-anchor="middle">3번 문</text><text x="490" y="155" font-size="24" text-anchor="middle">꽝 공개</text><text x="490" y="197" font-size="18" text-anchor="middle">진행자가 엶</text><text x="300" y="253" font-size="23" text-anchor="middle">2번으로 바꾸면 상품</text></g></svg>
