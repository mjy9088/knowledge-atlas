<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">처음 틀렸다면 바꾸면 이기는 이유</title><desc id="desc">처음 1번 선택. 상품 1번이면 바꾸면 꽝. 상품 2번이면 진행자는 3번을 열어야 하고, 상품 3번이면 2번을 열어야 하므로 두 경우 모두 바꾸면 상품.</desc><metadata>Original authored finite teaching illustration. Not measured observations. Source review and publication remain separate.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="380" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">동일하게 가능한 세 상품 위치</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="30" y="95" font-size="24" fill="#161616" text-anchor="start" font-weight="600">상품 1번</text><text x="225" y="95" font-size="22" fill="#525252" text-anchor="start" font-weight="400">처음 맞음</text><text x="550" y="95" font-size="24" fill="#da1e28" text-anchor="end" font-weight="600">교환: 꽝</text><path d="M24 125H576" stroke="#e0e0e0" stroke-width="1"/><text x="30" y="174" font-size="24" fill="#161616" text-anchor="start" font-weight="600">상품 2번</text><text x="225" y="174" font-size="22" fill="#525252" text-anchor="start" font-weight="400">처음 틀림</text><text x="550" y="174" font-size="24" fill="#007d79" text-anchor="end" font-weight="600">교환: 상품</text><path d="M24 204H576" stroke="#e0e0e0" stroke-width="1"/><text x="30" y="253" font-size="24" fill="#161616" text-anchor="start" font-weight="600">상품 3번</text><text x="225" y="253" font-size="22" fill="#525252" text-anchor="start" font-weight="400">처음 틀림</text><text x="550" y="253" font-size="24" fill="#007d79" text-anchor="end" font-weight="600">교환: 상품</text><path d="M24 283H576" stroke="#e0e0e0" stroke-width="1"/><text x="300" y="354" font-size="23" fill="#007d79" text-anchor="middle" font-weight="400">처음 틀린 두 경우 → 교환하면 이깁니다</text></g></svg>
