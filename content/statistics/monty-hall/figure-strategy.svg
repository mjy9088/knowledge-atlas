<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">상품 위치별로 항상 바꾸면</title><desc id="desc">처음 선택이 1번일 때 상품이 1번이면 교환 패, 2번 또는 3번이면 교환 승. 세 경우는 각각 1/3.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">상품 위치별로 항상 바꾸면</text><rect x="25" y="65" width="175" height="175" rx="12" fill="#f7e4df" stroke="#c4d7cc" stroke-width="2"/><text x="112" y="110" text-anchor="middle" font-size="26" fill="#263e36">상품 1번</text><text x="112" y="157" text-anchor="middle" font-size="22" fill="#263e36">처음 맞음</text><text x="112" y="210" text-anchor="middle" font-size="26" fill="#263e36">교환: 패</text><rect x="220" y="65" width="175" height="175" rx="12" fill="#dceede" stroke="#c4d7cc" stroke-width="2"/><text x="307" y="110" text-anchor="middle" font-size="26" fill="#263e36">상품 2번</text><text x="307" y="157" text-anchor="middle" font-size="22" fill="#263e36">처음 틀림</text><text x="307" y="210" text-anchor="middle" font-size="26" fill="#263e36">교환: 승</text><rect x="415" y="65" width="175" height="175" rx="12" fill="#dceede" stroke="#c4d7cc" stroke-width="2"/><text x="502" y="110" text-anchor="middle" font-size="26" fill="#263e36">상품 3번</text><text x="502" y="157" text-anchor="middle" font-size="22" fill="#263e36">처음 틀림</text><text x="502" y="210" text-anchor="middle" font-size="26" fill="#263e36">교환: 승</text><text x="300" y="280" text-anchor="middle" font-size="24" fill="#263e36">각 경우 1/3 → 교환 승률 2/3</text></g></svg>