<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 365" role="img" aria-labelledby="title desc">
<title id="title">처음 틀렸다면 바꾸면 이기는 이유</title><desc id="desc">처음 1번 선택. 상품 1번이면 바꾸면 꽝. 상품 2번이면 진행자는 3번을 열어야 하고, 상품 3번이면 2번을 열어야 하므로 두 경우 모두 바꾸면 상품.</desc>
<rect width="600" height="365" rx="16" fill="#f4f8f3"/>
<g font-family="system-ui,Malgun Gothic,sans-serif" fill="#263e36"><text x="300" y="36" font-size="24" text-anchor="middle" font-weight="700">처음 1번 선택 · 진행자는 반드시 꽝을 엽니다</text><text x="90" y="82" font-size="21" text-anchor="middle">상품 위치</text><text x="280" y="82" font-size="21" text-anchor="middle">진행자가 여는 문</text><text x="490" y="82" font-size="21" text-anchor="middle">바꾸면</text><rect x="20" y="105" width="560" height="57" rx="9" fill="#f5e9df" stroke="#b8cfc2"/><text x="90" y="142" font-size="22" text-anchor="middle">1번</text><text x="280" y="142" font-size="22" text-anchor="middle">2번 또는 3번</text><text x="490" y="142" font-size="22" text-anchor="middle" font-weight="700">꽝</text><rect x="20" y="173" width="560" height="57" rx="9" fill="#e1eee3" stroke="#b8cfc2"/><text x="90" y="210" font-size="22" text-anchor="middle">2번</text><text x="280" y="210" font-size="22" text-anchor="middle">3번만 가능</text><text x="490" y="210" font-size="22" text-anchor="middle" font-weight="700">상품</text><rect x="20" y="241" width="560" height="57" rx="9" fill="#e1eee3" stroke="#b8cfc2"/><text x="90" y="278" font-size="22" text-anchor="middle">3번</text><text x="280" y="278" font-size="22" text-anchor="middle">2번만 가능</text><text x="490" y="278" font-size="22" text-anchor="middle" font-weight="700">상품</text><text x="300" y="339" font-size="22" text-anchor="middle" font-weight="700">같은 확률의 세 경우 중 두 경우에서 승리 → 2/3</text></g></svg>
