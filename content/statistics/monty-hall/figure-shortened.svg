<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-labelledby="title"><title id="title">관측 사실과 빠진 공개 규칙</title><rect width="600" height="230" rx="16" fill="#f4f8f3"/>
<g fill="white" stroke="#c4d7cc" stroke-width="2"><rect x="20" y="85" width="165" height="105" rx="12"/><rect x="215" y="85" width="165" height="105" rx="12"/><rect x="410" y="85" width="165" height="105" rx="12"/></g>
<g font-family="system-ui,sans-serif" font-size="24" fill="#263e36" text-anchor="middle"><text x="300" y="40">처음 설명에 없던 정보는?</text><text x="103" y="145">꽝을 보았다</text><text x="298" y="130">어떤 규칙으로</text><text x="298" y="165">열었을까?</text><text x="493" y="130">그 장면 뒤의</text><text x="493" y="165">확률은?</text></g></svg>
