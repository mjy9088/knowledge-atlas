<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 365" role="img" aria-labelledby="title desc"><title id="title">열린 꽝 문은 같아도 진행자의 규칙은 다릅니다</title><desc id="desc">양쪽 모두1번 선택,2번 꽝 공개,3번 닫힘을 보여줍니다. 한 진행자는 알고 반드시 꽝을 열며, 다른 진행자는 모르고 무작위로 열었는데 이번에 꽝이 나왔습니다. 같은 장면만으로 어느 규칙인지 결정할 수 없습니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="365" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">눈앞의 공개는 같아도 · 생성 규칙은 다릅니다</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="165" y="103" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">알고 꽝 공개</text><path d="M55 123H275" stroke="#161616" stroke-width="2"/><text x="165" y="165" font-size="23" fill="#525252" text-anchor="middle" font-weight="400">반드시 꽝을 공개</text><text x="165" y="215" font-size="32" fill="#0f62fe" text-anchor="middle" font-weight="400">↓</text><text x="165" y="264" font-size="24" fill="#0f62fe" text-anchor="middle" font-weight="600">꽝을 봄</text><text x="435" y="103" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">모르고 무작위</text><path d="M325 123H545" stroke="#161616" stroke-width="2"/><text x="435" y="165" font-size="23" fill="#525252" text-anchor="middle" font-weight="400">상품도 열 수 있음</text><text x="435" y="215" font-size="32" fill="#0f62fe" text-anchor="middle" font-weight="400">↓</text><text x="435" y="264" font-size="24" fill="#0f62fe" text-anchor="middle" font-weight="600">우연히 꽝을 봄</text><path d="M300 78L300 290" stroke="#e0e0e0" stroke-width="1" fill="none"/><text x="300" y="337" font-size="23" fill="#161616" text-anchor="middle" font-weight="400">공개 결과와 진행자의 규칙을 함께 봅니다</text></g></svg>
