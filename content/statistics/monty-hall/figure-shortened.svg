<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" role="img" aria-labelledby="title desc"><title id="title">열린 꽝 문은 같아도 진행자의 규칙은 다릅니다</title><desc id="desc">양쪽 모두1번 선택,2번 꽝 공개,3번 닫힘을 보여줍니다. 한 진행자는 알고 반드시 꽝을 열며, 다른 진행자는 모르고 무작위로 열었는데 이번에 꽝이 나왔습니다. 같은 장면만으로 어느 규칙인지 결정할 수 없습니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="305" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="33" text-anchor="middle" font-size="25" fill="#263f36" font-weight="700">같은 장면을 만드는 두 공개 규칙</text><text x="150" y="78" text-anchor="middle" font-size="21" fill="#263f36" font-weight="700">알고 꽝 공개</text><text x="60" y="105" text-anchor="middle" font-size="22" fill="#263f36" font-weight="400">1번</text><g transform="translate(22 114) scale(0.63)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/><path d="M15 139h90" stroke="#365c42" stroke-width="5"/></g><text x="143" y="105" text-anchor="middle" font-size="22" fill="#263f36" font-weight="400">2번</text><g transform="translate(105 114) scale(0.63)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><circle cx="67" cy="69" r="19" fill="#f1eee7" stroke="#b2a995"/><path d="M58 60l18 18m0-18L58 78" stroke="#827861" stroke-width="4" stroke-linecap="round"/><path d="M23 11l27 15v91l-27 12z" fill="#d5dfcf" stroke="#6b8776" stroke-width="2"/><circle cx="42" cy="74" r="3" fill="#597763"/></g><text x="226" y="105" text-anchor="middle" font-size="22" fill="#263f36" font-weight="400">3번</text><g transform="translate(188 114) scale(0.63)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/></g><text x="150" y="232" text-anchor="middle" font-size="20" fill="#39775e" font-weight="400">반드시 꽝</text><text x="450" y="78" text-anchor="middle" font-size="21" fill="#263f36" font-weight="700">모르고 무작위 공개</text><text x="360" y="105" text-anchor="middle" font-size="22" fill="#263f36" font-weight="400">1번</text><g transform="translate(322 114) scale(0.63)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/><path d="M15 139h90" stroke="#365c42" stroke-width="5"/></g><text x="443" y="105" text-anchor="middle" font-size="22" fill="#263f36" font-weight="400">2번</text><g transform="translate(405 114) scale(0.63)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><circle cx="67" cy="69" r="19" fill="#f1eee7" stroke="#b2a995"/><path d="M58 60l18 18m0-18L58 78" stroke="#827861" stroke-width="4" stroke-linecap="round"/><path d="M23 11l27 15v91l-27 12z" fill="#d5dfcf" stroke="#6b8776" stroke-width="2"/><circle cx="42" cy="74" r="3" fill="#597763"/></g><text x="526" y="105" text-anchor="middle" font-size="22" fill="#263f36" font-weight="400">3번</text><g transform="translate(488 114) scale(0.63)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><rect x="25" y="12" width="70" height="115" rx="2" fill="#dce7d6" stroke="#75917d"/><rect x="33" y="23" width="54" height="35" rx="2" fill="#eaf0e4" stroke="#9db09a"/><rect x="33" y="68" width="54" height="47" rx="2" fill="#eaf0e4" stroke="#9db09a"/><circle cx="84" cy="66" r="4" fill="#9c7739"/></g><text x="450" y="232" text-anchor="middle" font-size="20" fill="#b5842f" font-weight="400">이번에는 꽝이 나옴</text><text x="300" y="276" text-anchor="middle" font-size="20" fill="#263f36" font-weight="400">보인 결과와, 그 결과를 만든 규칙을 구별합니다</text></g></svg>
