<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">축약판에서 빠진 것</title><desc id="desc">오답 문 공개 → 공개 정책 ? → 사후확률 ?. “오답을 봤다”와 “항상 오답만 연다”를 구분</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">축약판에서 빠진 것</text><rect x="18" y="95" width="165.33333333333334" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="100.66666666666667" y="155" text-anchor="middle" font-size="24" fill="#263e36">오답 문 공개</text><path d="M184.33333333333334 145 L197.33333333333334 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="201.33333333333334" y="95" width="165.33333333333334" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="284" y="155" text-anchor="middle" font-size="24" fill="#263e36">공개 정책 ?</text><path d="M367.6666666666667 145 L380.6666666666667 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="384.6666666666667" y="95" width="165.33333333333334" height="100" rx="12" fill="#e1eee3" stroke="#c4d7cc" stroke-width="2"/><text x="467.33333333333337" y="155" text-anchor="middle" font-size="24" fill="#263e36">사후확률 ?</text><text x="300" y="252" text-anchor="middle" font-size="20" fill="#263e36">“오답을 봤다”와 “항상 오답만 연다”를 구분</text></g></svg>