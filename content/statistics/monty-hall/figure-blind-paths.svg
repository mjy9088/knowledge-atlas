<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">같은 확률의 여섯 경우</title><desc id="desc">처음 선택 1번. 상품 위치와 균등한 공개 문 선택을 합친 같은 확률의 경우입니다. 실제 여섯 번의 실험 결과를 뜻하지 않습니다.</desc>
<metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata>
<rect width="600" height="370" rx="16" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="35" font-size="23" text-anchor="middle">같은 확률의 여섯 경우</text><rect x="20" y="60" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="155" y="86" font-size="20" text-anchor="middle">상품 1번 · 2번을 엶</text><text x="155" y="118" font-size="20" text-anchor="middle">꽝 공개</text><rect x="310" y="60" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="445" y="86" font-size="20" text-anchor="middle">상품 1번 · 3번을 엶</text><text x="445" y="118" font-size="20" text-anchor="middle">꽝 공개</text><rect x="20" y="150" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="155" y="176" font-size="20" text-anchor="middle">상품 2번 · 2번을 엶</text><text x="155" y="208" font-size="20" text-anchor="middle">상품 공개</text><rect x="310" y="150" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="445" y="176" font-size="20" text-anchor="middle">상품 2번 · 3번을 엶</text><text x="445" y="208" font-size="20" text-anchor="middle">꽝 공개</text><rect x="20" y="240" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="155" y="266" font-size="20" text-anchor="middle">상품 3번 · 2번을 엶</text><text x="155" y="298" font-size="20" text-anchor="middle">꽝 공개</text><rect x="310" y="240" width="270" height="77" rx="8" fill="#fff" stroke="#b8c9ba"/><text x="445" y="266" font-size="20" text-anchor="middle">상품 3번 · 3번을 엶</text><text x="445" y="298" font-size="20" text-anchor="middle">상품 공개</text><text x="300" y="355" font-size="21" text-anchor="middle">각 칸은 같은 확률의 한 경우입니다</text></g></svg>
