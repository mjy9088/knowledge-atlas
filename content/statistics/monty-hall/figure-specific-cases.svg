<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" role="img" aria-labelledby="title desc"><title id="title">상품 위치와 실제 공개 문을 세 경우로 비교</title><desc id="desc">처음1번을 고르고2번의 꽝을 우선 엽니다. 상품1번과3번이면2번을 열어 조건에 맞고, 상품2번이면3번을 열어 조건 밖입니다. 각 상품 배치는1/3입니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="392" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">2번의 꽝 공개 조건 · 처음 선택 1번</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="278" y="96" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">1번</text><text x="401" y="96" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">2번</text><text x="524" y="96" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">3번</text><text x="24" y="148" font-size="23" fill="#161616" text-anchor="start" font-weight="600">상품 1번</text><text x="24" y="180" font-size="22" fill="#007d79" text-anchor="start" font-weight="400">2번 · 조건에 맞음</text><g transform="translate(249.2 120) scale(0.48)"><rect x="22" y="10" width="76" height="120" fill="#ffffff" stroke="#161616"/><path d="M60 41l21 28-21 28-21-28z" fill="#007d79"/><path d="M49 69l8 8 15-17" fill="none" stroke="#fff" stroke-width="4"/><path d="M12 132H108" stroke="#8d8d8d" stroke-width="2"/><path d="M12 141H108" stroke="#0f62fe" stroke-width="5"/></g><g transfo