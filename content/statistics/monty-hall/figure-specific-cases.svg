<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">상품 위치와 실제 공개 문을 세 경우로 비교</title><desc id="desc">처음1번을 고르고2번의 꽝을 우선 엽니다. 상품1번과3번이면2번을 열어 조건에 맞고, 상품2번이면3번을 열어 조건 밖입니다. 각 상품 배치는1/3입니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="380" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="31" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">어느 상품 배치가 ‘2번 공개’에 맞을까요?</text><text x="187" y="55" text-anchor="middle" font-size="23" fill="#263f36" font-weight="400">1번</text><text x="274" y="55" text-anchor="middle" font-size="23" fill="#263f36" font-weight="400">2번</text><text x="361" y="55" text-anchor="middle" font-size="23" fill="#263f36" font-weight="400">3번</text><rect x="15" y="59" width="570" height="96" rx="8" fill="#fff" stroke="#b7cab9"/><text x="75" y="92" text-anchor="middle" font-size="22" fill="#263f36" font-weight="700">상품 1번</text><text x="75" y="122" text-anchor="middle" font-size="18" fill="#748778" font-weight="400">각 1/3</text><g transform="translate(158 73) scale(0.48)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><path d="M60 40l8 17 19 3-14 13 3 19-16-9-17 9 4-19-14-13 19-3z" fill="#d5a23d" stroke="#8b6220" stroke-width="2"/><path d="M15 139h90" stroke="#365c42" stroke-width="5"/></g><g transform="translate(245 73) scale(0.48)"><path d="M16 132h88" stroke="#a9b9aa" stroke-width="3"/><rect x="21" y="8" width="78" height="123" rx="3" fill="#f9fbf4" stroke="#6b8776" stroke-width="3"/><circle cx="67" cy="69" r="19" fill="#f1eee7" stroke="#b2a995"/><path d="M58 60l18 18m0-18L58 78" stroke="#827861" stroke-width="4" stroke-linecap="round"/><path d="M23 11l27