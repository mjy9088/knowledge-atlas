<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 335" role="img" aria-labelledby="title desc"><title id="title">정답을 아는 진행자의 확률 트리</title><desc id="desc">처음 선택1번. 상품1번에서 공개2번과3번은 각각1/2여서 경로 확률각1/6. 상품2번과3번에서는 강제된 꽝 공개가 확률1이고 각 경로는1/3.</desc><metadata>Original authored finite teaching model, not measured sample data. Default choice1. Review and publication pending.</metadata><rect width="600" height="335" rx="14" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif" fill="#293f35"><text x="300" y="30" text-anchor="middle" font-size="23">처음 1번 선택 → 상품 위치 → 공개 문</text><path d="M300 40V52M100.0 52H500.0" stroke="#91aa96" fill="none"/><path d="M100.0 52V70" stroke="#91aa96"/><text x="100.0" y="88" text-anchor="middle" font-size="20">상품 1번 · 1/3</text><text x="100.0" y="114" text-anchor="middle" font-size="18">처음 맞음</text><path d="M11.0 121V168H17.0" stroke="#91aa96" fill="none"/><rect x="17.0" y="132" width="170" height="69" rx="7" fill="#fff" stroke="#b8c9ba"/><text x="100.0" y="151" text-anchor="middle" font-size="18">2번 엶 (1/2)</text><text x="100.0" y="173" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="100.0" y="194" text-anchor="middle" font-size="18">교환: 꽝</text><path d="M11.0 121V246H17.0" stroke="#91aa96" fill="none"/><rect x="17.0" y="210" width="170" height="69" rx="7" fill="#fff" stroke="#b8c9ba"/><text x="100.0" y="229" text-anchor="middle" font-size="18">3번 엶 (1/2)</text><text x="100.0" y="251" text-anchor="middle" font-size="18">1/3×1/2=1/6</text><text x="100.0" y="272" text-anchor="middle" font-size="18">교환: 꽝</text><path d="M300.0 52V70" stroke="#91aa96"/><text x="300.0" y="88" text-anchor="middle" font-size="20">상품 2번 · 1/3</text><text x="300.0" y="114" text-anchor="middle" font-size="18">처음 틀림</text><path d="M211.0 121V168H217.0" stroke="#91aa96" fill="none"/><rect x="217.0" y="132" width="170" height="69" rx="7" fill="#e3f0e5" stroke="#b8c9ba"/><text x="300.0" y="151" text-anchor="middle" font-size="18">3번 엶 (1)</text><text x="300.0" y="173" text-anchor="middle" font-size="18">1/3×1=1/3</text><text x="300.0" y="194" text-anchor="middle" font-size="18">교환: 상품</text><path d="M500.0 52V70" stroke="#91aa96"/><text x="500.0" y="88" text-anchor="middle" font-size="20">상품 3번 · 1/3</text><text x="500.0" y="114" text-anchor="middle" font-size="18">처음 틀림</text><path d="M411.0 121V168H417.0" stroke="#91aa96" fill="none"/><rect x="417.0" y="132" width="170" height="69" rx="7" fill="#e3f0e5" stroke="#b8c9ba"/><text x="500.0" y="151" text-anchor="middle" font-size="18">2번 엶 (1)</text><text x="500.0" y="173" text-anchor="middle" font-size="18">1/3×1=1/3</text><text x="500.0" y="194" text-anchor="middle" font-size="18">교환: 상품</text><text x="300" y="316" text-anchor="middle" font-size="19">가지 끝의 개수보다 각 경로의 확률을 확인합니다</text></g></svg>
