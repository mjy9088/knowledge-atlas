<g font-family="system-ui,sans-serif" font-size="24" fill="#263e36" text-anchor="middle"><text x="300" y="40">숫자보다 먼저 정보가 생긴 과정</text><text x="78" y="145">처음 경우</text><text x="223" y="145">공개 규칙</text><text x="368" y="145">실제 관측</text><text x="518" y="145">다시 계산</text></g></svg>
