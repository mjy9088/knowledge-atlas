<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title desc"><title id="title">같은 여섯 확률 칸에서 조건에 남는 수를 비교</title><desc id="desc">알고 꽝을 열면6칸 모두 남고 교환 승리4칸으로2/3입니다. 무작위 공개에서 꽝이 열린 경우만 보면 상품 공개2칸은 조건 밖이고4칸 중2칸 승리로1/2입니다. 칸은 정확한 확률 단위이며 기록된 표본이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="410" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">같은 관측 조건 · 진행자의 규칙을 구별</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="24" y="95" font-size="24" fill="#161616" text-anchor="start" font-weight="600">알고 꽝 공개</text><rect x="24" y="115" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="46.5" y="147.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="77" y="115" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="99.5" y="147.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="130" y="115" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="152.5" y="147.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="183" y="115" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="205.5" y="147.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="236" y="115" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="258.5" y="147.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="289" y="115" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="311.5" y="147.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><text x="572" y="148" font-size="27" fill="#007d79" text-anchor="end" font-weight="600">4/6 = 2/3</text><path d="M24 191H576" stroke="#e0e0e0" stroke-width="1"/><text x="24" y="230" font-size="24" fill="#161616" text-anchor="start" font-weight="600">모르고 무작위</text><rect x="24" y="250" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="46.5" y="282.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="77" y="250" width="45" height="45" fill="#ffffff" stroke="#8d8d8d"/><text x="99.5" y="282.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">−</text><rect x="130" y="250" width="45" height="45" fill="url(#hatch)" stroke="#8d8d8d"/><text x="152.5" y="282.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">×</text><rect x="183" y="250" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="205.5" y="282.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="236" y="250" width="45" height="45" fill="#007d79" stroke="#007d79"/><text x="258.5" y="282.4" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="400">✓</text><rect x="289" y="250" width="45" height="45" fill="url(#hatch)" stroke="#8d8d8d"/><text x="311.5" y="282.4" font-size="26" fill="#525252" text-anchor="middle" font-weight="400">×</text><text x="572" y="283" font-size="27" fill="#007d79" text-anchor="end" font-weight="600">2/4 = 1/2</text><path d="M24 326H576" stroke="#e0e0e0" stroke-width="1"/><text x="300" y="383" font-size="20" fill="#525252" text-anchor="middle" font-weight="400">한 칸 = 확률 1/6 · 실제 여섯 번의 결과가 아닙니다</text></g></svg>
