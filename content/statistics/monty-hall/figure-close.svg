<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" role="img" aria-labelledby="title desc">
<title id="title">같은 장면도 다른 규칙으로 생길 수 있습니다</title><desc id="desc">반드시 꽝을 여는 진행자에서는 처음 틀린 게임이 모두 남아 바꾸기 승률 2/3. 모르고 무작위로 여는 진행자에서는 처음 틀린 게임의 절반이 제외되어 꽝을 본 게임의 승률은 1/2.</desc>
<rect width="600" height="305" rx="16" fill="#f4f8f3"/>
<g font-family="system-ui,Malgun Gothic,sans-serif" fill="#263e36"><text x="300" y="36" font-size="24" text-anchor="middle" font-weight="700">같은 조건: 꽝이 열린 게임에서 비교</text><rect x="20" y="65" width="560" height="103" rx="9" fill="#fff" stroke="#b8cfc2"/><text x="300" y="95" font-size="22" text-anchor="middle" font-weight="700">정답을 알고 반드시 꽝을 열면</text><text x="300" y="126" font-size="20" text-anchor="middle">처음 틀린 게임도 모두 남음</text><text x="300" y="153" font-size="22" text-anchor="middle">바꾸면 승리 → 2/3</text><rect x="20" y="180" width="560" height="103" rx="9" fill="#fff" stroke="#b8cfc2"/><text x="300" y="210" font-size="22" text-anchor="middle" font-weight="700">모르고 두 문 중 하나를 열었다면</text><text x="300" y="241" font-size="20" text-anchor="middle">처음 틀린 게임의 절반은 상품 공개로 제외</text><text x="300" y="268" font-size="22" text-anchor="middle">꽝을 본 게임에서 바꾸면 승리 → 1/2</text></g></svg>
