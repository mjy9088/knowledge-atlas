<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 365" role="img" aria-labelledby="title desc"><title id="title">같은 여섯 확률 칸에서 조건에 남는 수를 비교</title><desc id="desc">알고 꽝을 열면6칸 모두 남고 교환 승리4칸으로2/3입니다. 무작위 공개에서 꽝이 열린 경우만 보면 상품 공개2칸은 조건 밖이고4칸 중2칸 승리로1/2입니다. 칸은 정확한 확률 단위이며 기록된 표본이 아닙니다.</desc><metadata>Original owned vector diagram of the stated teaching model. Not measured observations. Visual revision trial; expert, learner and publication approval pending.</metadata><rect width="600" height="365" rx="16" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="34" text-anchor="middle" font-size="23" fill="#263f36" font-weight="700">문제의 조건: 꽝이 열린 게임에서 비교</text><text x="25" y="79" text-anchor="start" font-size="22" fill="#263f36" font-weight="700">알고 꽝 공개</text><rect x="39" y="100" width="52" height="45" rx="8" fill="#e8dfce" stroke="#73917d"/><text x="65" y="131" text-anchor="middle" font-size="28" fill="#263f36" font-weight="400">−</text><rect x="105" y="100" width="52" height="45" rx="8" fill="#e8dfce" stroke="#73917d"/><text x="131" y="131" text-anchor="middle" font-size="28" fill="#263f36" font-weight="400">−</text><rect x="171" y="100" width="52" height="45" rx="8" fill="#39775e" stroke="#73917d"/><text x="197" y="131" text-anchor="middle" font-size="28" fill="#fff" font-weight="400">✓</text><rect x="237" y="100" width="52" height="45" rx="8" fill="#39775e" stroke="#73917d"/><text x="263" y="131" text-anchor="middle" font-size="28" fill="#fff" font-weight="400">✓</text><rect x="303" y="100" width="52" height="45" rx="8" fill="#39775e" stroke="#73917d"/><text x="329" y="131" text-anchor="middle" font-size="28" fill="#fff" font-weight="400">✓</text><rect x="369" y="100" width="52" height="45" rx="8" fill="#39775e" stroke="#73917d"/><text x="395" y="131" text-anchor="middle" font-size="28" fill="#fff" font-weight="400">✓</text><text x="512" y="131" text-anchor="middle" font-size="24" fill="#39775e" font-weight="700">4/6 = 2/3</text><text x="25" y="202" text-anchor="start" font-size="22" fill="#263f36" font-weight="700">모르고 무작위</text><rect x="39" y="223" width="52" height="45" rx="8" fill="#e8dfce" stroke="#73917d"/><text x="65" y="254" text-anchor="middle" font-size="28" fill="#263f36" font-weight="400">−</text><rect x="105" y="223" width="52" height="45" rx="8" fill="#e8dfce" stroke="#73917d"/><text x="131" y="254" text-anchor="middle" font-size="28" fill="#263f36" font-weight="400">−</text><rect x="171" y="223" width="52" height="45" rx="8" fill="#f1f2ec" stroke="#73917d"/><text x="197" y="254" text-anchor="middle" font-size="28" fill="#263f36" font-weight="400">/</text><text x="197" y="289" text-anchor="middle" font-size="15" fill="#748778" font-weight="400">조건 밖</text><rect x="237" y="223" width="52" height="45" rx="8" fill="#39775e" stroke="#73917d"/><text x="263" y="254" text-anchor="middle" font-size="28" fill="#fff" font-weight="400">✓</text><rect x="303" y="223" width="52" height="45" rx="8" fill="#39775e" stroke="#73917d"/><text x="329" y="254" text-anchor="middle" font-size="28" fill="#fff" font-weight="400">✓</text><rect x="369" y="223" width="52" height="45" rx="8" fill="#f1f2ec" stroke="#73917d"/><text x="395" y="254" text-anchor="middle" font-size="28" fill="#263f36" font-weight="400">/</text><text x="395" y="289" text-anchor="middle" font-size="15" fill="#748778" font-weight="400">조건 밖</text><text x="512" y="254" text-anchor="middle" font-size="24" fill="#39775e" font-weight="700">2/4 = 1/2</text><text x="300" y="337" text-anchor="middle" font-size="19" fill="#263f36" font-weight="400">한 칸은 확률 1/6 · 실제 여섯 번의 결과가 아닙니다</text></g></svg>
