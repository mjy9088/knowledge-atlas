<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 379" role="img" aria-labelledby="title desc"><title id="title">모르고 두 문 중 하나를 엽니다</title><desc id="desc">처음 선택은 1번. 진행자는 정답을 모르고 2번 또는 3번을 각각 1/2의 확률로 엽니다. 상품이 공개될 수도 있습니다.</desc><metadata>Original authored teaching illustration. Default first choice is door 1. Not measured data, learner evidence or publication approval.</metadata><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f4"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#8d8d8d" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f62fe"/></marker></defs><rect width="600" height="379" fill="#fff"/><g font-family="IBM Plex Sans,Noto Sans KR,Noto Sans CJK KR,system-ui,sans-serif" fill="#161616"><text x="24" y="34" font-size="24" fill="#161616" text-anchor="start" font-weight="600">모르는 진행자 · 남은 두 문 중 하나를 공개</text><path d="M24 51H576" stroke="#161616" stroke-width="2"/><text x="300" y="99" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">처음 선택은 1번</text><path d="M300 117L300 139" stroke="#8d8d8d" stroke-width="1" fill="none"/><path d="M155 139H445" stroke="#8d8d8d" stroke-width="1"/><path d="M155 139L155 162" stroke="#8d8d8d" stroke-width="1" fill="none"/><text x="155" y="196" font-size="26" fill="#0f62fe" text-anchor="middle" font-weight="400">2번 공개 · 1/2</text><text x="155" y="232" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">상품일 수도 있음</text><path d="M445 139L445 162" stroke="#8d8d8d" stroke-width="1" fill="none"/><text x="445" y="196" font-size="26" fill="#0f62fe" text-anchor="middle" font-weight="400">3번 공개 · 1/2</text><text x="445" y="232" font-size="22" fill="#525252" text-anchor="middle" font-weight="400">상품일 수도 있음</text><path d="M24 273H576" stroke="#161616" stroke-width="2"/><text x="300" y="314" font-size="24" fill="#161616" text-anchor="middle" font-weight="600">문제의 조건: 꽝이 열린 뒤</text><text x="300" y="353" font-size="23" fill="#525252" text-anchor="middle" font-weight="400">상품 공개는 이 조건의 집계 밖입니다</text></g></svg>
