<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">왜 그 말을 했는지 모른다면</title><desc id="desc">BB, BG, GB에서 부모가 그 말을 할 확률이 모두 미정이다. 보고 정책을 알기 전에는 유일한 답을 확정할 수 없다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">왜 그 말을 했는지 모른다면</text><rect x="25" y="75" width="170" height="145" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="110" y="125" text-anchor="middle" font-size="32" fill="#263e36">BB</text><text x="110" y="186" text-anchor="middle" font-size="24" fill="#263e36">말할 확률 ?</text><rect x="220" y="75" width="170" height="145" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="305" y="125" text-anchor="middle" font-size="32" fill="#263e36">BG</text><text x="305" y="186" text-anchor="middle" font-size="24" fill="#263e36">말할 확률 ?</text><rect x="415" y="75" width="170" height="145" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="500" y="125" text-anchor="middle" font-size="32" fill="#263e36">GB</text><text x="500" y="186" text-anchor="middle" font-size="24" fill="#263e36">말할 확률 ?</text><text x="300" y="278" text-anchor="middle" font-size="22" fill="#263e36">정보가 참이어도 보고 확률은 별도 조건</text></g></svg>