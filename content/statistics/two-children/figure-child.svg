<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">아이 한 명을 균등하게 골라 관측하면</title><desc id="desc">가족을 균등 추출한 뒤 아이 한 명을 균등 선택해 아들을 관측한다. 관측 우도는 1,1/2,1/2,0. 사후확률은 1/2,1/4,1/4,0이다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">아이 한 명을 균등하게 골라 관측하면</text><rect x="15" y="65" width="130" height="175" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="80" y="105" text-anchor="middle" font-size="29" fill="#263e36">BB</text><text x="80" y="150" text-anchor="middle" font-size="21" fill="#263e36">관측 1</text><text x="80" y="207" text-anchor="middle" font-size="24" fill="#263e36">결과 1/2</text><rect x="163" y="65" width="130" height="175" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="228" y="105" text-anchor="middle" font-size="29" fill="#263e36">BG</text><text x="228" y="150" text-anchor="middle" font-size="21" fill="#263e36">관측 1/2</text><text x="228" y="207" text-anchor="middle" font-size="24" fill="#263e36">결과 1/4</text><rect x="311" y="65" width="130" height="175" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="376" y="105" text-anchor="middle" font-size="29" fill="#263e36">GB</text><text x="376" y="150" text-anchor="middle" font-size="21" fill="#263e36">관측 1/2</text><text x="376" y="207" text-anchor="middle" font-size="24" fill="#263e36">결과 1/4</text><rect x="459" y="65" width="130" height="175" rx="12" fill="#eee" stroke="#c4d7cc" stroke-width="2"/><text x="524" y="105" text-anchor="middle" font-size="29" fill="#263e36">GG</text><text x="524" y="150" text-anchor="middle" font-size="21" fill="#263e36">관측 0</text><text x="524" y="207" text-anchor="middle" font-size="24" fill="#263e36">결과 0</text><text x="300" y="280" text-anchor="middle" font-size="22" fill="#263e36">관측 가중치: 1/4 · 1/8 · 1/8 · 0</text></g></svg>