<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">관측 뒤의 분모를 다시 만들기</title><desc id="desc">모집단 → 정보 과정 → 관측한 것 → 가중치 합. 몬티 홀·검사 결과에서도 먼저 관측 과정을 물어보세요</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">관측 뒤의 분모를 다시 만들기</text><rect x="18" y="95" width="119.5" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="77.75" y="155" text-anchor="middle" font-size="20" fill="#263e36">모집단</text><path d="M138.5 145 L151.5 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="155.5" y="95" width="119.5" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="215.25" y="155" text-anchor="middle" font-size="20" fill="#263e36">정보 과정</text><path d="M276 145 L289 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="293" y="95" width="119.5" height="100" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="352.75" y="155" text-anchor="middle" font-size="20" fill="#263e36">관측한 것</text><path d="M413.5 145 L426.5 145" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><rect x="430.5" y="95" width="119.5" height="100" rx="12" fill="#e1eee3" stroke="#c4d7cc" stroke-width="2"/><text x="490.25" y="155" text-anchor="middle" font-size="20" fill="#263e36">가중치 합</text><text x="300" y="252" text-anchor="middle" font-size="20" fill="#263e36">몬티 홀·검사 결과에서도 먼저 관측 과정을 물어보세요</text></g></svg>