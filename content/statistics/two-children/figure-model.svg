<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">출생순을 구분한 네 가지 경우</title><desc id="desc">독립이며 아들/딸 확률 각각 1/2인 모형. 출생순 BB, BG, GB, GG는 각각 1/4이다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">출생순을 구분한 네 가지 경우</text><rect x="15" y="70" width="130" height="165" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="80" y="130" text-anchor="middle" font-size="34" fill="#263e36">BB</text><text x="80" y="195" text-anchor="middle" font-size="30" fill="#263e36">1/4</text><rect x="163" y="70" width="130" height="165" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="228" y="130" text-anchor="middle" font-size="34" fill="#263e36">BG</text><text x="228" y="195" text-anchor="middle" font-size="30" fill="#263e36">1/4</text><rect x="311" y="70" width="130" height="165" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="376" y="130" text-anchor="middle" font-size="34" fill="#263e36">GB</text><text x="376" y="195" text-anchor="middle" font-size="30" fill="#263e36">1/4</text><rect x="459" y="70" width="130" height="165" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="524" y="130" text-anchor="middle" font-size="34" fill="#263e36">GG</text><text x="524" y="195" text-anchor="middle" font-size="30" fill="#263e36">1/4</text><text x="300" y="278" text-anchor="middle" font-size="21" fill="#263e36">독립 · 아들/딸 각각 1/2 로 둔 단순 모형</text></g></svg>