<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">두 관계 전제에서 바깥 관계를 얻는 추이성</title>
  <desc id="desc">A와 B가 관계 있고 B와 C가 관계 있다는 두 전제를 함께 사용해 A와 C가 관계 있다는 결론을 얻는다. 화살표는 관계 방향이 아니라 논리적 도출 순서다.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#365c42"/></marker></defs>
  <rect width="600" height="400" rx="20" fill="#f6f8f0"/>
  <text data-essential-label="true" x="300" y="42" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">중간 표기를 거쳐도 양 끝은 같은 묶음입니다</text>
  <g id="transitivity-premises" data-premises="A~B|B~C"><rect x="55" y="82" width="210" height="86" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="160" y="135" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">A~B</text><rect x="335" y="82" width="210" height="86" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="440" y="135" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">B~C</text></g>
  <text data-essential-label="true" x="300" y="202" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#526b58">두 전제를 함께 사용</text>
  <path d="M 300 216 L 300 276" data-from="transitivity-premises" data-to="transitivity-conclusion" data-rule="transitivity" stroke="#365c42" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <g id="transitivity-conclusion" data-conclusion="A~C"><rect x="180" y="276" width="240" height="82" rx="16" fill="#e1eee3" stroke="#365c42" stroke-width="4"/><text data-essential-label="true" x="300" y="328" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#365c42">따라서 A~C</text></g>
  <text x="300" y="386" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="500" fill="#526b58">화살표는 관계 방향이 아니라 전제에서 결론으로 가는 추론입니다.</text>
</svg>
