<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">정수의 영인수 성질과 0이 아닌 중간 분모</title>
  <desc id="desc">d 곱하기 af-be가 0이면 d=0 또는 af-be=0이다. 정의역 조건 d가 0이 아님이 첫 갈래를 제외하고 af=be를 남긴다.</desc>
  <defs><marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#365c42"/></marker><marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#9b3f35"/></marker></defs>
  <rect width="600" height="400" rx="20" fill="#f6f8f0"/>
  <text data-essential-label="true" x="300" y="40" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">유리수로 나누지 않고 정수에서 갈래를 좁힙니다</text>
  <g id="zero-product-split" data-domain="integers" data-branches="d=0|af-be=0"><rect x="145" y="62" width="310" height="72" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="300" y="107" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">d(af−be)=0</text></g>
  <g id="zero-product-rule-label"><text data-essential-label="true" x="300" y="164" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#526b58">영인수 성질이 두 갈래를 만듭니다</text></g>
  <path d="M 145 108 L 35 108 L 35 172 L 145 196" data-from="zero-product-split" data-to="excluded-d-zero" data-rule="zero-product-property" stroke="#365c42" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 455 108 L 565 108 L 565 172 L 455 196" data-from="zero-product-split" data-to="retained-difference-zero" data-rule="zero-product-property" stroke="#365c42" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>
  <g id="excluded-d-zero" data-branch="d=0" data-status="excluded"><rect x="45" y="196" width="220" height="82" rx="16" fill="#ffffff" stroke="#9b3f35" stroke-width="4"/><text data-essential-label="true" x="155" y="246" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#9b3f35">첫 갈래: d=0</text></g>
  <g id="retained-difference-zero" data-branch="af-be=0" data-status="retained" data-result="af=be"><rect x="335" y="196" width="220" height="82" rx="16" fill="#e1eee3" stroke="#365c42" stroke-width="4"/><text data-essential-label="true" x="445" y="229" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">둘째: af−be=0</text><text data-essential-label="true" x="445" y="263" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#365c42">따라서 af=be</text></g>
  <g id="middle-denominator-condition" data-condition="d!=0"><rect x="45" y="300" width="220" height="56" rx="16" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/><text data-essential-label="true" x="155" y="336" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">D에서는 d≠0</text></g>
  <path d="M 155 300 L 155 282" data-from="middle-denominator-condition" data-to="excluded-d-zero" data-rule="domain-excludes-d-zero" stroke="#9b3f35" stroke-width="5" fill="none" marker-end="url(#arrow-red)"/>
  <g id="method-note"><text x="400" y="386" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="500" fill="#526b58">정수 등식 · 영인수 성질 · 정의역 조건만 사용</text></g>
</svg>
