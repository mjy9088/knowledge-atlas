<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">공통 정수곱 bcf를 만드는 두 곱셈</title>
  <desc id="desc">ad=bc에는 f를, cf=de에는 b를 곱하여 두 식이 공통 항 bcf에서 이어지는 과정을 정렬한다.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#365c42"/></marker></defs>
  <rect width="600" height="400" rx="20" fill="#f6f8f0"/>
  <text data-essential-label="true" x="300" y="40" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">왜 첫 식에 f, 둘째 식에 b를 곱할까요?</text>
  <g id="multiply-first-by-f" data-input="ad=bc" data-factor="f" data-output="adf=bcf"><rect x="35" y="78" width="240" height="92" rx="16" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/><text data-essential-label="true" x="155" y="115" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">ad=bc</text><text data-essential-label="true" x="155" y="151" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#a56d30">양변 ×f → adf=bcf</text></g>
  <g id="multiply-second-by-b" data-input="cf=de" data-factor="b" data-output="bcf=bde"><rect x="325" y="78" width="240" height="92" rx="16" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/><text data-essential-label="true" x="445" y="115" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">cf=de</text><text data-essential-label="true" x="445" y="151" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#a56d30">양변 ×b → bcf=bde</text></g>
  <path d="M 155 170 L 245 245" data-from="multiply-first-by-f" data-to="common-product" data-rule="same-middle-product" stroke="#365c42" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 445 170 L 355 245" data-from="multiply-second-by-b" data-to="common-product" data-rule="same-middle-product" stroke="#365c42" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <g id="common-product" data-shared-term="bcf" data-chain="adf=bcf=bde"><rect x="150" y="242" width="300" height="110" rx="20" fill="#e1eee3" stroke="#365c42" stroke-width="4"/><text data-essential-label="true" x="300" y="281" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#526b58">같은 가운데 정수곱</text><text data-essential-label="true" x="300" y="324" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#365c42">adf = bcf = bde</text></g>
</svg>
