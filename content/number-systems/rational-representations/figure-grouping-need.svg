<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">같은 값을 나타내는 세 분수식의 묶음 질문</title>
  <desc id="desc">1/2와 2/4, 2/4와 3/6이 각각 같은 값을 나타낸다면 1/2와 3/6도 직접 같은 묶음이어야 하는지 묻는다. 아직 교차곱 관계는 정의하지 않는다.</desc>
  <rect width="600" height="400" rx="20" fill="#f6f8f0"/>
  <text data-essential-label="true" x="300" y="42" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">중간 표기가 바뀌어도 같은 묶음이어야 합니다</text>
  <g id="one-half" data-expression="1/2"><rect x="35" y="172" width="110" height="76" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="90" y="221" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">1/2</text></g>
  <g id="two-fourths" data-expression="2/4"><rect x="245" y="172" width="110" height="76" rx="16" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/><text data-essential-label="true" x="300" y="221" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">2/4</text></g>
  <g id="three-sixths" data-expression="3/6"><rect x="455" y="172" width="110" height="76" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="510" y="221" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">3/6</text></g>
  <path d="M 145 210 L 245 210" data-kind="grouping" data-direction="undirected" data-from="one-half" data-to="two-fourths" data-status="given" data-label="같은 값을 나타냄" stroke="#365c42" stroke-width="5"/>
  <text data-essential-label="true" x="195" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#365c42">같은 값</text>
  <path d="M 355 210 L 455 210" data-kind="grouping" data-direction="undirected" data-from="two-fourths" data-to="three-sixths" data-status="given" data-label="같은 값을 나타냄" stroke="#365c42" stroke-width="5"/>
  <text data-essential-label="true" x="405" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#365c42">같은 값</text>
  <path d="M 90 172 C 160 72 440 72 510 172" data-kind="grouping" data-direction="undirected" data-from="one-half" data-to="three-sixths" data-status="needed" data-label="같은 묶음이어야 하는가" stroke="#a56d30" stroke-width="5" stroke-dasharray="12 9" fill="none"/>
  <text data-essential-label="true" x="300" y="92" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#a56d30">양 끝도 같은 묶음이어야 할까요?</text>
  <text x="300" y="352" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="500" fill="#526b58">아직 묶는 규칙은 정의하지 않았습니다.</text>
</svg>
