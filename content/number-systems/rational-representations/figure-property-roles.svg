<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
  <title id="title">반사성과 대칭성이 표기 묶음에서 맡는 역할</title>
  <desc id="desc">반사성은 모든 표기를 자기 자신과 묶고, 대칭성은 관계를 어느 방향에서 읽어도 같은 묶음이 되게 한다.</desc>
  <rect width="600" height="440" rx="20" fill="#f6f8f0"/>
  <text data-essential-label="true" x="300" y="42" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">먼저 자기 포함과 방향 문제를 해결합니다</text>
  <g id="reflexive-role" data-property="reflexive" data-role="self-membership"><rect x="30" y="76" width="250" height="190" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="155" y="115" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">반사성</text><path d="M 125 160 C 125 130 185 130 185 160 C 185 188 125 188 125 160" fill="none" stroke="#365c42" stroke-width="5"/><text data-essential-label="true" x="155" y="221" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#365c42">A~A</text></g>
  <g id="symmetric-role" data-property="symmetric" data-role="direction-free"><rect x="320" y="76" width="250" height="190" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="3"/><text data-essential-label="true" x="445" y="115" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">대칭성</text><text data-essential-label="true" x="385" y="181" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">A</text><path d="M 410 172 L 480 172" data-kind="relation" data-direction="undirected" data-from="A" data-to="B" stroke="#365c42" stroke-width="5"/><text data-essential-label="true" x="505" y="181" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#293f35">B</text><text data-essential-label="true" x="445" y="228" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#526b58">어느 쪽에서 읽어도 같음</text></g>
  <g id="role-results">
  <text data-essential-label="true" x="155" y="310" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">표기를 빠뜨리지 않음</text>
  <text data-essential-label="true" x="445" y="310" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#293f35">읽는 방향과 무관</text>
  </g>
  <g id="next-step-panel"><rect x="20" y="336" width="560" height="88" rx="14" fill="#e1eee3" stroke="#365c42" stroke-width="3"/><text data-essential-label="true" x="300" y="372" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#365c42">두 역할을 확인했습니다</text><text data-essential-label="true" x="300" y="404" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#365c42">이제 중간 표기를 살핍니다</text></g>
</svg>
