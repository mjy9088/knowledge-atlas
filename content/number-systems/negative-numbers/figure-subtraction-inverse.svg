<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">음의 4를 빼는 일을 그 덧셈 역원 4를 더하는 일로 바꾸기</title>
  <desc id="desc">음의 2에서 음의 4를 빼는 식을 음의 4의 덧셈 역원인 양의 4를 더하는 식으로 바꾼다. 수직선에서 음의 2부터 오른쪽으로 같은 한 칸을 네 번 이동해 2에 도착한다.</desc>
  <metadata>Original worked subtraction geometry for Knowledge Atlas. The diagram exposes additive-inverse replacement before movement; it is not a mnemonic-only sign rule or learner assessment. Source, learner, rights, browser and publication review remain separate.</metadata>
  <defs>
    <marker id="right-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="640" height="320" rx="20" fill="#f8fafc"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#172033">
    <g id="transformation" data-operation="add-inverse" data-minuend="-2" data-subtrahend="-4" data-added="4" data-result="2">
      <rect x="24" y="24" width="592" height="82" rx="14" fill="#ffffff" stroke="#8792a6" stroke-width="2"/>
      <text x="320" y="58" text-anchor="middle" font-size="20" font-weight="600" fill="#526078">빼는 수 −4의 덧셈 역원은 +4</text>
      <text x="320" y="92" text-anchor="middle" font-size="26" font-weight="700">−2 − (−4) = −2 + 4 = 2</text>
    </g>
    <text x="320" y="140" text-anchor="middle" font-size="20" font-weight="600" fill="#6d28d9">−(−4)를 +4로 바꾼 뒤 오른쪽으로 네 칸</text>
    <line x1="64" y1="214" x2="576" y2="214" stroke="#8792a6" stroke-width="4" stroke-linecap="round"/>
    <g id="integer-ticks" stroke="#8792a6" stroke-width="3">
      <line data-tick="-3" x1="80" y1="198" x2="80" y2="230"/>
      <line data-tick="-2" x1="160" y1="194" x2="160" y2="234" stroke="#b54708" stroke-width="5"/>
      <line data-tick="-1" x1="240" y1="198" x2="240" y2="230"/>
      <line data-tick="0" x1="320" y1="194" x2="320" y2="234" stroke="#087f5b" stroke-width="5"/>
      <line data-tick="1" x1="400" y1="198" x2="400" y2="230"/>
      <line data-tick="2" x1="480" y1="194" x2="480" y2="234" stroke="#1d4ed8" stroke-width="5"/>
      <line data-tick="3" x1="560" y1="198" x2="560" y2="230"/>
    </g>
    <g id="four-unit-steps" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" marker-end="url(#right-arrow)">
      <line data-step="1" data-from="-2" data-to="-1" x1="160" x2="240" y1="172" y2="172"/>
      <line data-step="2" data-from="-1" data-to="0" x1="240" x2="320" y1="172" y2="172"/>
      <line data-step="3" data-from="0" data-to="1" x1="320" x2="400" y1="172" y2="172"/>
      <line data-step="4" data-from="1" data-to="2" x1="400" x2="480" y1="172" y2="172"/>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="600">
      <text x="80" y="262">−3</text><text x="160" y="262" fill="#b54708">−2</text><text x="240" y="262">−1</text>
      <text x="320" y="262" fill="#087f5b">0</text><text x="400" y="262">1</text><text x="480" y="262" fill="#1d4ed8">2</text><text x="560" y="262">3</text>
    </g>
    <circle cx="160" cy="172" r="10" fill="#b54708" stroke="#ffffff" stroke-width="3"/>
    <circle cx="480" cy="172" r="11" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <text x="320" y="300" text-anchor="middle" font-size="20" font-weight="600" fill="#526078">구호가 아니라 덧셈 역원을 취한 결과</text>
  </g>
</svg>
