<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">덧셈 역원의 대칭과 음수의 순서</title>
  <desc id="desc">같은 간격의 수직선에서 3과 음의 3은 0에서 세 칸씩 떨어져 방향이 반대이다. 둘의 합은 0이다. 음의 2는 음의 5보다 오른쪽에 있으므로 더 크다.</desc>
  <metadata>Original additive-inverse and order geometry for Knowledge Atlas. Equal distances encode the authored integer number-line convention, not empirical measurement. Source, learner, rights, browser and publication review remain separate.</metadata>
  <rect width="640" height="320" rx="20" fill="#f8fafc"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#172033">
    <text x="320" y="38" text-anchor="middle" font-size="24" font-weight="700">0에서 같은 거리, 반대 방향</text>
    <path data-opposite-from="3" data-opposite-to="-3" data-zero-x="320" data-from-x="464" data-to-x="176" d="M464 108Q320 42 176 108" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="176" cy="108" r="9" fill="#b54708"/><circle cx="464" cy="108" r="9" fill="#1d4ed8"/>
    <text x="176" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#b54708">−3</text>
    <text x="464" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">3</text>
    <g data-sum-left="3" data-sum-right="-3" data-sum-result="0">
      <text x="320" y="142" text-anchor="middle" font-size="26" font-weight="700" fill="#6d28d9">3 + (−3) = 0</text>
    </g>
    <line x1="64" y1="178" x2="576" y2="178" stroke="#8792a6" stroke-width="4" stroke-linecap="round"/>
    <g id="integer-ticks" stroke="#8792a6" stroke-width="3">
      <line data-tick="-5" x1="80" y1="164" x2="80" y2="192"/>
      <line data-tick="-4" x1="128" y1="168" x2="128" y2="188"/>
      <line data-tick="-3" x1="176" y1="164" x2="176" y2="192" stroke="#b54708"/>
      <line data-tick="-2" x1="224" y1="164" x2="224" y2="192" stroke="#b54708"/>
      <line data-tick="-1" x1="272" y1="168" x2="272" y2="188"/>
      <line data-tick="0" x1="320" y1="158" x2="320" y2="198" stroke="#087f5b" stroke-width="5"/>
      <line data-tick="1" x1="368" y1="168" x2="368" y2="188"/>
      <line data-tick="2" x1="416" y1="168" x2="416" y2="188"/>
      <line data-tick="3" x1="464" y1="164" x2="464" y2="192" stroke="#1d4ed8"/>
      <line data-tick="4" x1="512" y1="168" x2="512" y2="188"/>
      <line data-tick="5" x1="560" y1="164" x2="560" y2="192"/>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="600">
      <text x="80" y="224">−5</text><text x="176" y="224">−3</text><text x="224" y="224">−2</text>
      <text x="320" y="224" fill="#087f5b">0</text><text x="464" y="224">3</text><text x="560" y="224">5</text>
    </g>
    <path d="M80 250H224" fill="none" stroke="#b54708" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="250" r="8" fill="#b54708"/><circle cx="224" cy="250" r="10" fill="#b54708"/>
    <text x="152" y="292" text-anchor="middle" font-size="24" font-weight="700" fill="#b54708">−5 &lt; −2</text>
    <text x="430" y="284" text-anchor="middle" font-size="20" font-weight="600" fill="#526078">오른쪽에 있는 수가 더 큽니다</text>
  </g>
</svg>
