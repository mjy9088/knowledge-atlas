<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">p가 짝수라는 결론의 조건부 귀류 구조</title>
  <desc id="desc">앞서 얻은 p제곱은 2q제곱이라는 식에서 p제곱이 짝수임을 얻는다. 오른쪽에서는 p가 홀수라고 국소적으로 가정하고 p는 2j 더하기 1, 따라서 p제곱은 2 곱하기 괄호 안의 2j제곱 더하기 2j, 더하기 1이어서 홀수임을 얻는다. 같은 p제곱이 짝수이면서 홀수라는 모순으로 홀수 가정을 버리고 p가 짝수, 즉 p는 2k라고 결론낸다.</desc>
  <metadata>Original static proof-dependency diagram authored for Knowledge Atlas. It visualizes independently authored algebra and assumption discharge; it is not external artwork, source evidence, or learner evidence.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#365c42"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="16" fill="#f6f8f0"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text x="360" y="30" text-anchor="middle" font-size="22" font-weight="700">홀수라고 가정하면 어디서 모순이 날까요?</text>
    <path data-from="prior-equation" data-to="p-square-even" data-rule="factor-two" d="M170 116V148" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="180" y="140" font-size="15" fill="#526b58">2×정수</text>
    <path data-from="odd-assumption" data-to="odd-square" data-rule="expand-odd-square" d="M550 116V148" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="560" y="140" font-size="15" fill="#526b58">제곱·정리</text>
    <path data-from="p-square-even" data-to="parity-contradiction" data-rule="even-claim" d="M170 222C170 252 278 252 306 278" fill="none" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
    <path data-from="odd-square" data-to="parity-contradiction" data-rule="odd-claim" d="M550 222C550 252 442 252 414 278" fill="none" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
    <path data-from="parity-contradiction" data-to="p-even" data-rule="discharge-odd-assumption" d="M360 326V348" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="374" y="344" font-size="15" fill="#526b58">홀수 가정 기각</text>
    <path data-from="p-even" data-to="p-two-k" data-rule="even-definition" d="M474 384H520" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
    <g id="prior-equation" data-owner="global-rational-assumption" data-equation="p2=2q2" data-parity="even">
      <rect x="24" y="54" width="292" height="62" rx="14" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/>
      <text x="170" y="76" text-anchor="middle" font-size="15" fill="#526b58">앞 장면에서 얻은 식</text>
      <text x="170" y="104" text-anchor="middle" font-size="25" font-weight="700">p² = 2q²</text>
    </g>
    <g id="odd-assumption" data-owner="local-odd-case" data-assumption="p-odd">
      <rect x="404" y="54" width="292" height="62" rx="14" fill="#f3dcb0" stroke="#a56d30" stroke-width="2"/>
      <text x="550" y="76" text-anchor="middle" font-size="15" fill="#526b58">조건부 가정</text>
      <text x="550" y="104" text-anchor="middle" font-size="25" font-weight="700">p = 2j + 1</text>
    </g>
    <g id="p-square-even" data-owner="global-rational-assumption" data-parity="even">
      <rect x="24" y="158" width="292" height="64" rx="14" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/>
      <text x="170" y="198" text-anchor="middle" font-size="25" font-weight="700">p²은 짝수</text>
    </g>
    <g id="odd-square" data-owner="local-odd-case" data-parity="odd">
      <rect x="404" y="148" width="292" height="74" rx="14" fill="#f3dcb0" stroke="#a56d30" stroke-width="2"/>
      <text x="550" y="178" text-anchor="middle" font-size="21" font-weight="700">p² = 2(2j²+2j)+1</text>
      <text x="550" y="207" text-anchor="middle" font-size="17" font-weight="700">따라서 p²은 홀수</text>
    </g>
    <g id="parity-contradiction" data-conflict="even-and-odd">
      <rect x="250" y="276" width="220" height="50" rx="14" fill="#ffffff" stroke="#a56d30" stroke-width="3"/>
      <text x="360" y="307" text-anchor="middle" font-size="21" font-weight="700">같은 p²: 짝수 ∧ 홀수</text>
    </g>
    <g id="p-even" data-status="discharged-conclusion" data-parity="even">
      <rect x="246" y="354" width="228" height="52" rx="14" fill="#e1eee3" stroke="#365c42" stroke-width="2"/>
      <text x="360" y="387" text-anchor="middle" font-size="25" font-weight="700">p는 짝수</text>
    </g>
    <g id="p-two-k" data-definition="even-integer">
      <rect x="530" y="354" width="166" height="52" rx="14" fill="#e1eee3" stroke="#365c42" stroke-width="2"/>
      <text x="613" y="387" text-anchor="middle" font-size="25" font-weight="700">p = 2k</text>
    </g>
  </g>
</svg>
