<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">i를 곱할 때 한 눈금에서 보이는 반시계 90도 회전</title>
  <desc id="desc">한 원점과 같은 눈금을 쓰는 복소평면에서 0이 아닌 벡터 z=(a,b)가 iz=(-b,a)로 반시계 90도 회전한다. 두 벡터의 제곱 길이는 모두 a제곱 더하기 b제곱이다. 원점은 고정되며 각도는 정의하지 않는다.</desc>
  <defs>
    <marker id="axis-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526b58"/></marker>
    <marker id="input-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#2563a6"/></marker>
    <marker id="output-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#b54a1b"/></marker>
    <marker id="turn-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7047a8"/></marker>
  </defs>
  <rect width="600" height="360" rx="16" fill="#f6f8f0"/>
  <g id="axes" data-origin="300,280" data-scale="55">
    <line x1="48" y1="280" x2="566" y2="280" stroke="#526b58" stroke-width="3" marker-end="url(#axis-arrow)"/>
    <line x1="300" y1="308" x2="300" y2="35" stroke="#526b58" stroke-width="3" marker-end="url(#axis-arrow)"/>
    <text data-essential-label="" x="548" y="316" fill="#293f35" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700">Re</text>
    <text data-essential-label="" x="316" y="50" fill="#293f35" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700">Im</text>
  </g>
  <g id="input-vector" data-complex-point="a,b" data-map-input="a,b">
    <line data-x1="300" data-y1="280" data-x2="465" data-y2="170" x1="300" y1="280" x2="465" y2="170" stroke="#2563a6" stroke-width="7" stroke-linecap="round" marker-end="url(#input-arrow)"/>
    <circle cx="465" cy="170" r="7" fill="#2563a6"/>
    <text data-essential-label="" x="438" y="142" fill="#2563a6" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700">z=(a,b)</text>
  </g>
  <g id="output-vector" data-complex-point="-b,a" data-map-output="-b,a">
    <line data-x1="300" data-y1="280" data-x2="190" data-y2="115" x1="300" y1="280" x2="190" y2="115" stroke="#b54a1b" stroke-width="7" stroke-linecap="round" marker-end="url(#output-arrow)"/>
    <circle cx="190" cy="115" r="7" fill="#b54a1b"/>
    <text data-essential-label="" x="44" y="88" fill="#b54a1b" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700">iz=(-b,a)</text>
  </g>
  <g id="coordinate-guides" data-shared-scale="true">
    <path d="M465 170V280M300 170H465M190 115V280M190 115H300" fill="none" stroke="#d5dfcc" stroke-width="2" stroke-dasharray="7 7"/>
    <text data-essential-label="" x="450" y="312" fill="#526b58" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24">a</text>
    <text data-essential-label="" x="268" y="166" fill="#526b58" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24">b</text>
    <text data-essential-label="" x="164" y="312" fill="#526b58" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24">-b</text>
    <text data-essential-label="" x="312" y="122" fill="#526b58" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24">a</text>
  </g>
  <g id="quarter-turn" data-turn="counterclockwise-quarter" data-angle-domain="nonzero-mod-360">
    <path d="M365 237A78 78 0 0 0 257 215" fill="none" stroke="#7047a8" stroke-width="5" stroke-linecap="round" marker-end="url(#turn-arrow)"/>
    <text data-essential-label="" x="326" y="202" fill="#7047a8" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700">× i</text>
  </g>
  <g id="length-and-zero" data-input-squared-length="a^2+b^2" data-output-squared-length="a^2+b^2" data-zero-fixed="true" data-zero-angle="undefined">
    <circle cx="300" cy="280" r="6" fill="#293f35"/>
    <text data-essential-label="" x="584" y="344" text-anchor="end" fill="#293f35" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="24">길이²: a²+b² · 0은 고정, 각도 없음</text>
  </g>
</svg>
