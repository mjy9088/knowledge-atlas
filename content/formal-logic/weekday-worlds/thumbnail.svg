<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">이걸로 IQ를 재겠다고?</title>
  <desc id="description">어제가 내일이었으면 좋겠다. 그럼 오늘이 금요일일 텐데… 그렇다면 오늘은 무슨 요일일까? 수요일, 목요일, 금요일, 일요일. 가능세계와 양상논리로 기준을 살펴보는 글의 표지.</desc>
  <metadata>asset:logic.weekday-worlds.thumbnail. Independently authored editable SVG, 2026-10-17. A user-supplied viral-puzzle image was a composition reference only. No reference pixels, logos, stopwatch artwork or IQ/time-limit claims are included. Publication remains unapproved.</metadata>
