<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">IQ 좀 높다면 도전!</title>
  <desc id="description">어제가 내일이었으면 좋겠다. 그럼 오늘이 금요일일 텐데… 그렇다면 오늘은 무슨 요일일까? 수요일, 목요일, 금요일, 일요일. 요일 수수께끼를 함께 풀어 보는 글의 표지.</desc>
  <metadata>asset:logic.weekday-worlds.cover. Independently drawn editable SVG, 2026-10-17, inspired by the user-supplied puzzle meme. The challenge heading and 20-second motif reproduce its rhetorical framing for discussion, not a validated IQ assessment or an enforced timer. No reference pixels or logos are imported. This is cover artwork, not a catalog thumbnail. Rights review and publication remain pending.</metadata>
