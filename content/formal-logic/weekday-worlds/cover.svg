<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-labelledby="title description"><title id="title">어제가 내일이라면</title><desc id="description">20초 선택을 제안하는 요일 수수께끼. 원문과 네 요일 선택지를 제시하며 풀이의 답은 표시하지 않습니다.</desc><metadata>Original owned SVG. User-authorized Carbon white-theme system redesign, 2026-10-25. Existing mathematical interpretation retained; no source pixels, logos or external artwork. No learner/expert/rights/publication approval asserted.</metadata><g font-family="Noto Sans KR,Malgun Gothic,sans-serif"><rect width="600" height="660" fill="#fff"/><rect width="600" height="6" fill="#0f62fe"/>
<text x="28" y="46" font-size="20" fill="#525252">LOGIC / LANGUAGE</text><text x="572" y="46" font-size="20" fill="#525252" text-anchor="end">20초 · 선택은 자유롭게</text>
<text x="28" y="134" font-size="58" fill="#161616">어제가</text><text x="28" y="206" font-size="58" fill="#161616">내일이라면.</text><path d="M28 244H572" stroke="#161616"/>
<text x="28" y="294" font-size="28" fill="#161616">“어제가 내일이었으면 좋겠다.</text><text x="28" y="338" font-size="28" fill="#161616">그럼 오늘이 금요일일 텐데…”</text><text x="28" y="402" font-size="28" fill="#161616">그렇다면 오늘은 무슨 요일일까?</text>
<rect x="28" y="450" width="124" height="84" fill="#f4f4f4" stroke="#e0e0e0"/><text x="40" y="478" font-size="20" fill="#525252">01</text><text x="40" y="516" font-size="24" fill="#161616">수요일</text><rect x="168" y="450" width="124" height="84" fill="#f4f4f4" stroke="#e0e0e0"/><text x="180" y="478" font-size="20" fill="#525252">02</text><text x="180" y="516" font-size="24" fill="#161616">목요일</text><rect x="308" y="450" width="124" height="84" fill="#f4f4f4" stroke="#e0e0e0"/><text x="320" y="478" font-size="20" fill="#525252">03</text><text x="320" y="516" font-size="24" fill="#161616">금요일</text><rect x="448" y="450" width="124" height="84" fill="#f4f4f4" stroke="#e0e0e0"/><text x="460" y="478" font-size="20" fill="#525252">04</text><text x="460" y="516" font-size="24" fill="#161616">일요일</text><text x="28" y="590" font-size="22" fill="#525252">하나의 문장, 서로 다른 기준.</text><text x="28" y="628" font-size="22" fill="#525252">지금은 정답을 판정하지 않습니다.</text></g></svg>