<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title description"><title id="title">서로 다른 달력의 같은 요일</title><desc id="description">가정한 오늘 금요일의 어제 목요일과 현실의 내일 목요일을 같게 놓아 현실의 오늘 수요일을 얻습니다.</desc><metadata>Original owned SVG. User-authorized Carbon white-theme system redesign,2026-10-25. Existing mathematical interpretation retained; no source pixels,logos or external artwork. No learner/expert/rights/publication approval asserted.</metadata><g font-family="Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="600" height="390" fill="#f4f4f4" stroke="#f4f4f4" stroke-width="1"/><text x="20" y="40" font-size="22" fill="#005d5d" font-weight="500" text-anchor="start">가정 1의 달력</text><rect x="20" y="56" width="180" height="86" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="20" y="56" width="180" height="4" fill="#007d79" stroke="#007d79" stroke-width="1"/><text x="36" y="88" font-size="20" fill="#525252" font-weight="400" text-anchor="start">어제</text><text x="36" y="123" font-size="28" fill="#161616" font-weight="400" text-anchor="start">목요일</text><rect x="20" y="136" width="180" height="6" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><rect x="210" y="56" width="180" height="86" fill="#fff" stroke="#007d79" stroke-width="2"/><rect x="210" y="56" width="180" height="4" fill="#007d79" stroke="#007d79" stroke-width="1"/><text x="226" y="88" font-size="20" fill="#525252" font-weight="400" text-anchor="start">오늘</text><text x="226" y="123" font-size="28" fill="#161616" font-weight="400" text-anchor="start">금요일</text><rect x="400" y="56" width="180" height="86" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="400" y="56" width="180" height="4" fill="#007d79" stroke="#007d79" stroke-width="1"/><text x="416" y="88" font-size="20" fill="#525252" font-weight="400" text-anchor="start">내일</text><text x="416" y="123" font-size="28" fill="#161616" font-weight="400" text-anchor="start">토요일</text><text x="20" y="244" font-size="22" fill="#0043ce" font-weight="500" text-anchor="start">현실의 달력</text><rect x="20" y="260" width="180" height="86" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="20" y="260" width="180" height="4" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="36" y="292" font-size="20" fill="#525252" font-weight="400" text-anchor="start">어제</text><text x="36" y="327" font-size="28" fill="#161616" font-weight="400" text-anchor="start">화요일</text><rect x="210" y="260" width="180" height="86" fill="#fff" stroke="#0f62fe" stroke-width="2"/><rect x="210" y="260" width="180" height="4" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="226" y="292" font-size="20" fill="#525252" font-weight="400" text-anchor="start">오늘</text><text x="226" y="327" font-size="28" fill="#161616" font-weight="400" text-anchor="start">수요일</text><rect x="400" y="260" width="180" height="86" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="400" y="260" width="180" height="4" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="416" y="292" font-size="20" fill="#525252" font-weight="400" text-anchor="start">내일</text><text x="416" y="327" font-size="28" fill="#161616" font-weight="400" text-anchor="start">목요일</text><rect x="400" y="340" width="180" height="6" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><path d="M110 142C110 190 490 210 490 260" fill="none" stroke="#0f62fe" stroke-width="2"/><rect x="276" y="184" width="48" height="36" fill="#fff" stroke="#0f62fe" stroke-width="1"/><text x="300" y="211" font-size="28" fill="#0f62fe" font-weight="400" text-anchor="middle">=</text><text x="20" y="378" font-size="22" fill="#525252" font-weight="400" text-anchor="start">가정의 어제 = 현실의 내일</text></g></svg>
