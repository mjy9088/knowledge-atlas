<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title description"><title id="title">현실의 참과 가능·필연 비교</title><desc id="description">첫 예시는 현실 일요일, 가정 금요일과 월요일입니다. 현실에서 P는 거짓이지만 가능하고 필연적이지 않습니다. 둘째 예시는 세 세계 모두 금요일이므로 P와 가능·필연이 모두 참입니다. 각 예시에서 현실은 표시한 세 세계에 접근합니다.</desc><metadata>Original owned SVG. User-authorized Carbon white-theme system redesign,2026-10-25. Existing mathematical interpretation retained; no source pixels,logos or external artwork. No learner/expert/rights/publication approval asserted.</metadata><g font-family="Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="600" height="650" fill="#f4f4f4" stroke="#f4f4f4" stroke-width="1"/><text x="20" y="36" font-size="24" fill="#161616" font-weight="500" text-anchor="start">P: 이 세계의 오늘은 금요일</text><rect x="20" y="62" width="560" height="266" fill="#fff" stroke="#e0e0e0" stroke-width="1"/><rect x="20" y="62" width="560" height="3" fill="#161616" stroke="#161616" stroke-width="1"/><text x="36" y="98" font-size="24" fill="#161616" font-weight="500" text-anchor="start">가능하지만 필연적이지는 않다</text><rect x="36" y="134" width="168" height="104" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="36" y="134" width="168" height="4" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="48" y="165" font-size="21" fill="#0043ce" font-weight="400" text-anchor="start">현실</text><text x="48" y="199" font-size="26" fill="#161616" font-weight="400" text-anchor="start">일요일</text><text x="48" y="225" font-size="20" fill="#525252" font-weight="400" text-anchor="start">P 거짓</text><rect x="216" y="134" width="168" height="104" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="216" y="134" width="168" height="4" fill="#007d79" stroke="#007d79" stroke-width="1"/><text x="228" y="165" font-size="21" fill="#005d5d" font-weight="400" text-anchor="start">가정 1</text><text x="228" y="199" font-size="26" fill="#161616" font-weight="400" text-anchor="start">금요일</text><text x="228" y="225" font-size="20" fill="#525252" font-weight="400" text-anchor="start">P 참</text><rect x="396" y="134" width="168" height="104" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="396" y="134" width="168" height="4" fill="#8a3ffc" stroke="#8a3ffc" stroke-width="1"/><text x="408" y="165" font-size="21" fill="#6929c4" font-weight="400" text-anchor="start">가정 2</text><text x="408" y="199" font-size="26" fill="#161616" font-weight="400" text-anchor="start">월요일</text><text x="408" y="225" font-size="20" fill="#525252" font-weight="400" text-anchor="start">P 거짓</text><path d="M120 134V114H480V134M300 114V134" fill="none" stroke="#8d8d8d" stroke-width="1.5"/><text x="36" y="273" font-size="22" fill="#161616" font-weight="400" text-anchor="start">현실 P: 거짓</text><text x="218" y="273" font-size="22" fill="#161616" font-weight="400" text-anchor="start">◇P: 참</text><text x="398" y="273" font-size="22" fill="#161616" font-weight="400" text-anchor="start">□P: 거짓</text><text x="36" y="309" font-size="20" fill="#525252" font-weight="400" text-anchor="start">살펴볼 세계: 현실, 가정 1, 가정 2</text><rect x="20" y="344" width="560" height="266" fill="#fff" stroke="#e0e0e0" stroke-width="1"/><rect x="20" y="344" width="560" height="3" fill="#161616" stroke="#161616" stroke-width="1"/><text x="36" y="380" font-size="24" fill="#161616" font-weight="500" text-anchor="start">필연적이다</text><rect x="36" y="416" width="168" height="104" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="36" y="416" width="168" height="4" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="48" y="447" font-size="21" fill="#0043ce" font-weight="400" text-anchor="start">현실</text><text x="48" y="481" font-size="26" fill="#161616" font-weight="400" text-anchor="start">금요일</text><text x="48" y="507" font-size="20" fill="#525252" font-weight="400" text-anchor="start">P 참</text><rect x="216" y="416" width="168" height="104" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="216" y="416" width="168" height="4" fill="#007d79" stroke="#007d79" stroke-width="1"/><text x="228" y="447" font-size="21" fill="#005d5d" font-weight="400" text-anchor="start">가정 1</text><text x="228" y="481" font-size="26" fill="#161616" font-weight="400" text-anchor="start">금요일</text><text x="228" y="507" font-size="20" fill="#525252" font-weight="400" text-anchor="start">P 참</text><rect x="396" y="416" width="168" height="104" fill="#fff" stroke="#c6c6c6" stroke-width="1"/><rect x="396" y="416" width="168" height="4" fill="#8a3ffc" stroke="#8a3ffc" stroke-width="1"/><text x="408" y="447" font-size="21" fill="#6929c4" font-weight="400" text-anchor="start">가정 2</text><text x="408" y="481" font-size="26" fill="#161616" font-weight="400" text-anchor="start">금요일</text><text x="408" y="507" font-size="20" fill="#525252" font-weight="400" text-anchor="start">P 참</text><path d="M120 416V396H480V416M300 396V416" fill="none" stroke="#8d8d8d" stroke-width="1.5"/><text x="36" y="555" font-size="22" fill="#161616" font-weight="400" text-anchor="start">현실 P: 참</text><text x="218" y="555" font-size="22" fill="#161616" font-weight="400" text-anchor="start">◇P: 참</text><text x="398" y="555" font-size="22" fill="#161616" font-weight="400" text-anchor="start">□P: 참</text><text x="36" y="591" font-size="20" fill="#525252" font-weight="400" text-anchor="start">살펴볼 세계: 현실, 가정 1, 가정 2</text><text x="20" y="642" font-size="21" fill="#525252" font-weight="400" text-anchor="start">수수께끼와 별개인 개념 예시 · 접근 범위를 고정</text></g></svg>
