<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 555" role="img" aria-labelledby="title desc"><title id="title">현실의 참, 하나 이상의 참, 모두의 참</title><desc id="desc">수수께끼 풀이와 별도인 두 개념 예시입니다. 현실 일요일과 가정 금요일·월요일에서는 P가 현실에서 거짓이지만 접근하는 세계 하나에서 참이므로 가능하고 필연적이지 않습니다. 세 세계가 모두 금요일이면 현실 P와 가능·필연이 모두 참입니다. 연결선은 현실에서 살펴볼 세 세계를 나타냅니다.</desc><metadata>Original owned vector projection of MODAL_INTRO_EXAMPLES and the existing modal valuation. No probability weights, measured data or external art. Visual revision trial; learner, expert and publication approval pending.</metadata><rect width="600" height="555" rx="14" fill="#f6f9f2"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="31" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">P: 이 세계의 오늘은 금요일</text><rect x="14" y="49" width="572" height="224" rx="14" fill="#fff" stroke="#bccdbb"/><text x="300" y="78" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">가능하지만 필연적이지는 않다</text><path d="M100 122 C40 89 160 89 100 122" fill="none" stroke="#738a7c" stroke-width="2"/><path d="M100 122 C100 89 300 89 300 122" fill="none" stroke="#738a7c" stroke-width="2"/><path d="M100 122 C100 89 500 89 500 122" fill="none" stroke="#738a7c" stroke-width="2"/><circle cx="100" cy="163" r="40" fill="#e7f2df" stroke="#73985c" stroke-width="4"/><text x="100" y="151" text-anchor="middle" font-size="18" fill="#35542b" font-weight="400">현실</text><text x="100" y="177" text-anchor="middle" font-size="24" fill="#35542b" font-weight="700">일요일</text><text x="100" y="221" text-anchor="middle" font-size="18" fill="#35542b" font-weight="400">× P 거짓</text><circle cx="300" cy="163" r="40" fill="#e3effb" stroke="#628eb9" stroke-width="2"/><text x="300" y="151" text-anchor="middle" font-size="18" fill="#214f7c" font-weight="400">가정 1</text><text x="300" y="177" text-anchor="middle" font-size="24" fill="#214f7c" font-weight="700">금요일</text><text x="300" y="221" text-anchor="middle" font-size="18" fill="#214f7c" font-weight="400">✓ P 참</text><circle cx="500" cy="163" r="40" fill="#fff2c9" stroke="#b7973e" stroke-width="2"/><text x="500" y="151" text-anchor="middle" font-size="18" fill="#705417" font-weight="400">가정 2</text><text x="500" y="177" text-anchor="middle" font-size="24" fill="#705417" font-weight="700">월요일</text><text x="500" y="221" text-anchor="middle" font-size="18" fill="#705417" font-weight="400">× P 거짓</text><text x="155" y="252" text-anchor="middle" font-size="21" fill="#263f36" font-weight="400">현실 P: 거짓</text><text x="350" y="252" text-anchor="middle" font-size="21" fill="#357758" font-weight="700">◇P: 참</text><text x="493" y="252" text-anchor="middle" font-size="21" fill="#6d7067" font-weight="700">□P: 거짓</text><rect x="14" y="286" width="572" height="224" rx="14" fill="#fff" stroke="#bccdbb"/><text x="300" y="315" text-anchor="middle" font-size="24" fill="#263f36" font-weight="700">필연적이다</text><path d="M100 359 C40 326 160 326 100 359" fill="none" stroke="#738a7c" stroke-width="2"/><path d="M100 359 C100 326 300 326 300 359" fill="none" stroke="#738a7c" stroke-width="2"/><path d="M100 359 C100 326 500 326 500 359" fill="none" stroke="#738a7c" stroke-width="2"/><circle cx="100" cy="400" r="40" fill="#e7f2df" stroke="#73985c" stroke-width="4"/><text x="100" y="388" text-anchor="middle" font-size="18" fill="#35542b" font-weight="400">현실</text><text x="100" y="414" text-anchor="middle" font-size="24" fill="#35542b" font-weight="700">금요일</text><text x="100" y="458" text-anchor="middle" font-size="18" fill="#35542b" font-weight="400">✓ P 참</text><circle cx="300" cy="400" r="40" fill="#e3effb" stroke="#628eb9" stroke-width="2"/><text x="300" y="388" text-anchor="middle" font-size="18" fill="#214f7c" font-weight="400">가정 1</text><text x="300" y="414" text-anchor="middle" font-size="24" fill="#214f7c" font-weight="700">금요일</text><text x="300" y="458" text-anchor="middle" font-size="18" fill="#214f7c" font-weight="400">✓ P 참</text><circle cx="500" cy="400" r="40" fill="#fff2c9" stroke="#b7973e" stroke-width="2"/><text x="500" y="388" text-anchor="middle" font-size="18" fill="#705417" font-weight="400">가정 2</text><text x="500" y="414" text-anchor="middle" font-size="24" fill="#705417" font-weight="700">금요일</text><text x="500" y="458" text-anchor="middle" font-size="18" fill="#705417" font-weight="400">✓ P 참</text><text x="155" y="489" text-anchor="middle" font-size="21" fill="#263f36" font-weight="400">현실 P: 참</text><text x="350" y="489" text-anchor="middle" font-size="21" fill="#357758" font-weight="700">◇P: 참</text><text x="493" y="489" text-anchor="middle" font-size="21" fill="#357758" font-weight="700">□P: 참</text><text x="300" y="535" text-anchor="middle" font-size="19" fill="#263f36" font-weight="400">표시한 세 세계를 모두 살펴볼 수 있다고 둔 예시</text></g></svg>
