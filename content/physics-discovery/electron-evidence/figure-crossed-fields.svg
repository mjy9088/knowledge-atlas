<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
  <title id="title">교차 장에서 음전하 빔의 힘이 상쇄되는 모형</title>
  <desc id="desc">빔은 오른쪽, 전기장은 위, 자기장은 종이 밖을 향한다. 음전하에는 전기력이 아래, 자기력이 위로 작용해 두 힘의 크기가 같을 때 직진한다.</desc>
  <defs>
    <marker id="velocity-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#365c42"/></marker>
    <marker id="force-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#a56d30"/></marker>
    <marker id="field-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526b58"/></marker>
  </defs>
  <rect x="8" y="8" width="584" height="364" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/>
  <text data-essential-label="model" x="28" y="42" font-size="24" font-weight="600" fill="#293f35">MODEL · 역사 장치 재구성 아님</text>
  <rect data-panel="field-panel" x="24" y="62" width="308" height="260" rx="14" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/>
  <g id="field-orientation">
    <rect x="36" y="72" width="284" height="28" rx="8" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/>
    <rect x="36" y="282" width="284" height="28" rx="8" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/>
    <text data-essential-label="negative-plate" data-panel-ref="field-panel" x="52" y="96" font-size="24" font-weight="600" fill="#293f35">위 판 −</text>
    <text data-essential-label="positive-plate" data-panel-ref="field-panel" x="52" y="306" font-size="24" font-weight="600" fill="#293f35">아래 판 +</text>
    <line data-vector="electric-field" x1="76" y1="260" x2="76" y2="126" stroke="#526b58" stroke-width="5" marker-end="url(#field-arrow)"/>
    <text data-essential-label="electric-field" data-panel-ref="field-panel" x="96" y="164" font-size="24" font-weight="600" fill="#526b58">E ↑</text>
    <circle data-field="magnetic" data-direction="out-of-page" cx="286" cy="124" r="16" fill="#ffffff" stroke="#365c42" stroke-width="3"/>
    <circle cx="286" cy="124" r="6" fill="#365c42"/>
    <text data-essential-label="magnetic-field" data-panel-ref="field-panel" x="112" y="126" font-size="24" font-weight="600" fill="#365c42">B · 종이 밖</text>
  </g>
  <g id="beam-path">
    <path d="M40 210H320" fill="none" stroke="#365c42" stroke-width="6"/>
    <circle cx="220" cy="210" r="11" fill="#293f35"/>
    <text data-essential-label="negative-charge" data-panel-ref="field-panel" x="96" y="232" font-size="24" font-weight="600" fill="#293f35">q&lt;0</text>
    <line data-vector="velocity" x1="120" y1="186" x2="204" y2="186" stroke="#365c42" stroke-width="5" marker-end="url(#velocity-arrow)"/>
    <text data-essential-label="velocity" data-panel-ref="field-panel" x="92" y="194" font-size="24" font-weight="600" fill="#365c42">v</text>
  </g>
  <g id="force-vectors">
    <line data-vector="electric-force" x1="220" y1="210" x2="220" y2="262" stroke="#a56d30" stroke-width="5" marker-end="url(#force-arrow)"/>
    <line data-vector="magnetic-force" x1="220" y1="210" x2="220" y2="150" stroke="#a56d30" stroke-width="5" marker-end="url(#force-arrow)"/>
    <text data-essential-label="electric-force" data-panel-ref="field-panel" x="236" y="274" font-size="24" font-weight="600" fill="#a56d30">F_E ↓</text>
    <text data-essential-label="magnetic-force" data-panel-ref="field-panel" x="236" y="188" font-size="24" font-weight="600" fill="#a56d30">F_B ↑</text>
  </g>
  <g id="equation-ledger">
    <rect data-panel="equation-panel" x="344" y="62" width="232" height="260" rx="14" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/>
    <text data-essential-label="straight" data-panel-ref="equation-panel" x="360" y="100" font-size="24" font-weight="600" fill="#293f35">직진 조건</text>
    <text data-essential-label="balance" data-panel-ref="equation-panel" x="360" y="142" font-size="24" font-weight="600" fill="#293f35">|q|E=|q|vB</text>
    <text data-essential-label="speed" data-panel-ref="equation-panel" x="360" y="184" font-size="24" font-weight="600" fill="#365c42">v=E/B</text>
    <text data-essential-label="conditions" data-panel-ref="equation-panel" x="360" y="226" font-size="24" font-weight="600" fill="#526b58">q≠0 · B≠0</text>
    <text data-essential-label="conditions-two" data-panel-ref="equation-panel" x="360" y="264" font-size="24" font-weight="600" fill="#526b58">v⊥B · 균일장</text>
    <text data-essential-label="conditions-three" data-panel-ref="equation-panel" x="360" y="300" font-size="24" font-weight="600" fill="#526b58">저속 근사</text>
  </g>
  <text data-essential-label="caveat" x="36" y="354" font-size="24" font-weight="600" fill="#526b58">B 점 = 종이 밖 · MODEL 경로</text>
</svg>
