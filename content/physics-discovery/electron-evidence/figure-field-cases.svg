<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
  <title id="title">전기장만, 교차 장, 자기장만을 비교하는 세 모형</title>
  <desc id="desc">왼쪽은 전기장을 위와 아래로 뒤집으면 음전하 모형 경로가 각각 아래와 위로 바뀌지만 속도를 모르면 비를 정할 수 없음을 보인다. 가운데 교차 장은 직진 조건으로 속도를 고르고, 오른쪽 자기장만의 곡률은 그 속도와 함께 전하 크기 대 질량비를 준다.</desc>
  <defs>
    <marker id="path-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#365c42"/></marker>
    <marker id="field-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526b58"/></marker>
  </defs>
  <rect x="8" y="8" width="584" height="364" rx="16" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/>
  <text data-essential-label="heading" x="28" y="42" font-size="24" font-weight="600" fill="#293f35">같은 빔 방향, 바뀐 장 조건</text>
  <g id="electric-only-case">
    <rect x="24" y="66" width="176" height="254" rx="14" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/>
    <text data-essential-label="electric-only" x="44" y="102" font-size="22" font-weight="560" fill="#293f35">1 · E만</text>
    <path data-path="electric-up" d="M42 160Q112 160 176 210" fill="none" stroke="#365c42" stroke-width="5" marker-end="url(#path-arrow)"/>
    <line x1="62" y1="218" x2="62" y2="142" stroke="#526b58" stroke-width="4" marker-end="url(#field-arrow)"/>
    <text data-essential-label="electric-up" x="78" y="238" font-size="22" font-weight="560" fill="#526b58">E↑ → 아래 휨</text>
    <path data-path="electric-down" d="M42 276Q112 276 176 232" fill="none" stroke="#a56d30" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#path-arrow)"/>
    <text data-essential-label="electric-down" x="44" y="306" font-size="22" font-weight="560" fill="#a56d30">E↓ → 위 휨</text>
  </g>
  <g id="crossed-field-case">
    <rect x="212" y="66" width="176" height="254" rx="14" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/>
    <text data-essential-label="crossed" x="232" y="102" font-size="22" font-weight="560" fill="#293f35">2 · E+B</text>
    <path data-path="balanced" d="M230 190H366" fill="none" stroke="#365c42" stroke-width="6" marker-end="url(#path-arrow)"/>
    <line x1="250" y1="242" x2="250" y2="142" stroke="#526b58" stroke-width="4" marker-end="url(#field-arrow)"/>
    <circle data-field="magnetic" data-direction="out-of-page" cx="338" cy="240" r="16" fill="#ffffff" stroke="#365c42" stroke-width="3"/>
    <circle cx="338" cy="240" r="5" fill="#365c42"/>
    <text data-essential-label="selected" x="234" y="286" font-size="22" font-weight="560" fill="#365c42">직진 → v=E/B</text>
  </g>
  <g id="magnetic-only-case">
    <rect x="400" y="66" width="176" height="254" rx="14" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/>
    <text data-essential-label="magnetic-only" x="420" y="102" font-size="22" font-weight="560" fill="#293f35">3 · B만</text>
    <path data-path="magnetic-curve" d="M418 246Q486 246 548 156" fill="none" stroke="#365c42" stroke-width="6" marker-end="url(#path-arrow)"/>
    <circle data-field="magnetic" data-direction="out-of-page" cx="440" cy="142" r="16" fill="#ffffff" stroke="#365c42" stroke-width="3"/>
    <circle cx="440" cy="142" r="5" fill="#365c42"/>
    <text data-essential-label="ratio" x="420" y="286" font-size="22" font-weight="560" fill="#365c42">r → |q|/m</text>
  </g>
  <text data-essential-label="unknown" x="28" y="354" font-size="22" font-weight="560" fill="#526b58">E만: 부호 단서, 그러나 v 미지 → q/m 미식별 · 모든 경로는 MODEL, 측정 궤적 아님</text>
</svg>
