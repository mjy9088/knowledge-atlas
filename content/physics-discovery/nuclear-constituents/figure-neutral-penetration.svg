<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">같은 질량과 속도에서 전하에 따른 정성적 투과 비교</title>
  <desc id="desc">질량과 입사 속도를 같게 둔 두 줄의 정성 비교다. 양전하 양성자는 물질 안에서 멈추고, 베릴륨 방사선은 더 깊이 진행한다. 이 관찰은 전하가 매우 작거나 0인 입자 해석을 지지하지만 투과만으로 감마선 대안을 끝내지는 않는다. 경로와 물질 폭은 측정값이나 축척이 아니다.</desc>
  <metadata>Original qualitative schematic authored for Knowledge Atlas, 2026-10-19. No external figure, photograph, prose, data table, or measured trajectory is reproduced. Path lengths are not scaled measurements. The particle interpretation is conditional on equal mass and equal incident speed; penetration alone does not resolve the gamma alternative.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#365c42"/></marker>
    <pattern id="matter" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#d5dfcc" stroke-width="3"/></pattern>
  </defs>
  <rect width="560" height="360" rx="16" fill="#f6f8f0"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text x="280" y="30" text-anchor="middle" font-size="22" font-weight="700">조건부 비교: 질량·속도가 같다면</text>
    <rect x="16" y="48" width="528" height="94" rx="12" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
    <g id="proton-lane">
      <text x="32" y="76" font-size="19" font-weight="700">양성자 · 양전하</text>
      <circle data-projectile="proton" data-mass="1" data-speed="1" data-charge="1" cx="104" cy="108" r="12" fill="#f3dcb0" stroke="#293f35" stroke-width="2"/>
      <line data-velocity="incident" x1="120" y1="108" x2="164" y2="108" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="176" y="88" width="336" height="40" rx="8" fill="url(#matter)" stroke="#d5dfcc" stroke-width="2"/>
      <line data-path="qualitative" x1="184" y1="108" x2="280" y2="108" stroke="#a56d30" stroke-width="5"/>
      <line x1="280" y1="94" x2="280" y2="122" stroke="#a56d30" stroke-width="5"/>
      <text x="304" y="115" font-size="18">더 일찍 멈춤</text>
    </g>
    <rect x="16" y="154" width="528" height="94" rx="12" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
    <g id="beryllium-radiation-lane">
      <text x="32" y="182" font-size="19" font-weight="700">베릴륨 방사선 · 입자 가설 q≈0</text>
      <circle data-projectile="neutral-hypothesis" data-mass="1" data-speed="1" data-charge="0" cx="104" cy="214" r="12" fill="#e1eee3" stroke="#293f35" stroke-width="2" stroke-dasharray="4 3"/>
      <line data-velocity="incident" x1="120" y1="214" x2="164" y2="214" stroke="#365c42" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="176" y="194" width="336" height="40" rx="8" fill="url(#matter)" stroke="#d5dfcc" stroke-width="2"/>
      <line data-path="qualitative" x1="184" y1="214" x2="500" y2="214" stroke="#365c42" stroke-width="5" marker-end="url(#arrow)"/>
      <text x="320" y="188" font-size="18">깊이 진행</text>
    </g>
    <rect x="16" y="264" width="528" height="72" rx="12" fill="#fff" stroke="#a56d30" stroke-width="2"/>
    <text x="32" y="290" font-size="19" font-weight="700" fill="#a56d30">관찰 → 전하가 매우 작거나 0인 입자 해석 지지</text>
    <text x="32" y="318" font-size="18" fill="#526b58">한계: 투과만으로 감마선 대안은 미해결 · 원본 정성 구성도</text>
  </g>
</svg>
