<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" preserveAspectRatio="xMidYMid meet" role="img" data-threshold-cases="less-equal-greater">
  <title>단일광자 에너지 장부의 세 문턱 경우</title><desc>문턱 아래, 정확한 문턱, 문턱 위를 나누고 정확한 문턱에서는 최대 운동에너지 0이지만 측정 가능한 전류를 보장하지 않으며, 문턱 위에서도 방출을 가능 조건으로만 표시한 원본 모형도.</desc>
  <defs><marker id="electron" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365c42"/></marker></defs><rect width="600" height="440" rx="16" fill="#f6f8f0"/><text x="24" y="40" font-size="26" font-weight="600" fill="#293f35">Eγ=hf 와 일함수 φ 비교</text>
  <g id="blocked-branch" data-emission="blocked"><rect x="20" y="64" width="176" height="204" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="42" y="102" font-size="24" font-weight="600" fill="#293f35">hf&lt;φ</text><rect x="46" y="188" width="54" height="54" rx="8" fill="#f3dcb0"/><line x1="36" y1="154" x2="180" y2="154" stroke="#a56d30" stroke-width="4"/><text x="108" y="144" font-size="24" font-weight="600" fill="#a56d30">φ</text><text x="42" y="252" font-size="24" font-weight="600" fill="#a56d30">방출 불허</text></g>
  <g id="threshold-branch" data-emission="not-guaranteed" data-kinetic-energy-ev="0"><rect x="212" y="64" width="176" height="204" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="232" y="102" font-size="24" font-weight="600" fill="#293f35">hf=φ</text><rect x="240" y="154" width="54" height="88" rx="8" fill="#e1eee3"/><line x1="228" y1="154" x2="372" y2="154" stroke="#a56d30" stroke-width="4"/><text x="304" y="144" font-size="24" font-weight="600" fill="#a56d30">φ</text><text x="230" y="214" font-size="24" font-weight="600" fill="#293f35">Kmax=0</text><text x="230" y="252" font-size="24" font-weight="600" fill="#526b58">전류 보장 아님</text></g>
  <g id="permitted-branch" data-emission="conditional" data-kinetic-energy-sign="positive"><rect x="404" y="64" width="176" height="204" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="424" y="102" font-size="24" font-weight="600" fill="#293f35">hf&gt;φ</text><rect x="430" y="126" width="54" height="116" rx="8" fill="#e1eee3"/><line x1="420" y1="180" x2="564" y2="180" stroke="#a56d30" stroke-width="4"/><path data-electron-arrow="emitted" d="M488 126H554" stroke="#365c42" stroke-width="5" marker-end="url(#electron)"/><text x="420" y="214" font-size="24" font-weight="600" fill="#365c42">Kmax&gt;0</text><text x="420" y="252" font-size="24" font-weight="600" fill="#526b58">방출 가능</text></g>
  <rect data-comparator="simple-continuous-accumulation" x="20" y="292" width="270" height="124" rx="16" fill="#fff" stroke="#a56d30" stroke-width="2"/><text x="40" y="330" font-size="24" font-weight="600" fill="#a56d30">단순 연속 누적 가설</text><text x="40" y="368" font-size="24" font-weight="600" fill="#293f35">밝기↑면 부족분 보충?</text><text x="40" y="402" font-size="24" font-weight="600" fill="#526b58">비교용 가설</text>
  <rect data-observation="below-cutoff-no-ordinary-photocurrent" x="310" y="292" width="270" height="124" rx="16" fill="#e1eee3" stroke="#365c42" stroke-width="2"/><text x="330" y="330" font-size="24" font-weight="600" fill="#365c42">관찰된 구별</text><text x="330" y="368" font-size="24" font-weight="600" fill="#293f35">f&lt;fc: 보통 전류 없음</text><text x="330" y="402" font-size="24" font-weight="600" fill="#526b58">정해진 영역 안에서</text>
</svg>
