<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" role="img">
  <title>고정 진동수에서 세기만 바꾼 관계 비교</title><desc>표면, 진동수, 수집 기하, 충분한 수집 전압을 고정하고 광자 도착과 포화 전류를 낮음에서 높음으로만 표시하며 광자당 에너지, 최대 운동에너지, 정지전위 크기를 같은 단위로 유지한 비교.</desc>
  <rect width="600" height="420" rx="16" fill="#f6f8f0"/><text x="24" y="40" font-size="26" font-weight="600" fill="#293f35">밝기만 바꾸고 나머지는 고정</text>
  <g id="before-intensity-change"><rect x="20" y="64" width="272" height="286" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="42" y="104" font-size="24" font-weight="600" fill="#365c42">기준 세기</text><path data-arrival-cue="lower" d="M46 136H266" fill="none" stroke="#365c42" stroke-width="6" stroke-dasharray="12 10"/><text x="54" y="174" font-size="24" font-weight="600" fill="#365c42">광자 도착률 낮음</text><rect data-fixture="outcomes" data-arrival-order="lower" data-current-order="lower" x="42" y="188" width="222" height="36" rx="10" fill="#e1eee3"/><text x="54" y="215" font-size="24" font-weight="600" fill="#293f35">포화전류: 낮음</text><rect data-fixture="conditions" data-frequency-hz="800000000000000" data-photon-energy-ev="3.3088" data-kinetic-energy-ev="1.0088" data-stopping-magnitude-v="1.0088" x="40" y="236" width="232" height="100" rx="12" fill="#f6f8f0"/></g>
  <g id="after-intensity-change"><rect x="308" y="64" width="272" height="286" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="330" y="104" font-size="24" font-weight="600" fill="#a56d30">더 높은 세기</text><path data-arrival-cue="higher" d="M334 136H554" fill="none" stroke="#a56d30" stroke-width="6"/><text x="342" y="174" font-size="24" font-weight="600" fill="#a56d30">광자 도착률 높음</text><rect data-fixture="outcomes" data-arrival-order="higher" data-current-order="higher" x="330" y="188" width="222" height="36" rx="10" fill="#f3dcb0"/><text x="342" y="215" font-size="24" font-weight="600" fill="#293f35">포화전류: 높음 가능</text><rect data-fixture="conditions" data-frequency-hz="800000000000000" data-photon-energy-ev="3.3088" data-kinetic-energy-ev="1.0088" data-stopping-magnitude-v="1.0088" x="328" y="236" width="232" height="100" rx="12" fill="#f6f8f0"/></g>
  <text x="54" y="264" font-size="24" font-weight="600" fill="#293f35">hf 3.31 eV</text><text x="54" y="298" font-size="24" font-weight="600" fill="#293f35">Kmax 1.01 eV</text><text x="54" y="330" font-size="24" font-weight="600" fill="#526b58">|Vs| 1.01 V</text><text x="342" y="264" font-size="24" font-weight="600" fill="#293f35">hf 3.31 eV</text><text x="342" y="298" font-size="24" font-weight="600" fill="#293f35">Kmax 1.01 eV</text><text x="342" y="330" font-size="24" font-weight="600" fill="#526b58">|Vs| 1.01 V</text>
  <rect x="20" y="366" width="560" height="38" rx="12" fill="#e1eee3"/><text x="42" y="394" font-size="24" font-weight="600" fill="#293f35">도착률: 낮음→높음 · 포화 전류: 낮음→높음 가능</text>
</svg>
