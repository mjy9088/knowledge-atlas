<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid meet" role="img">
  <title>단일광자 문턱의 적용 범위와 두 과잉 결론</title><desc>낮은 세기 단일광자 조건과 제외 영역을 분리하고, 모든 고전 이론이 모든 조건에서 반박됐다는 결론과 양자역학 전체가 단독 증명됐다는 결론을 모두 명시적으로 배제한다.</desc>
  <rect width="600" height="460" rx="16" fill="#f6f8f0"/><text x="24" y="40" font-size="26" font-weight="600" fill="#293f35">문턱은 조건이 있는 결론입니다</text>
  <rect data-regime="single-photon-low-intensity" x="28" y="66" width="352" height="236" rx="20" fill="#fff" stroke="#365c42" stroke-width="4"/><text x="50" y="106" font-size="24" font-weight="600" fill="#365c42">적용: 낮은 세기 단일광자</text><text x="50" y="150" font-size="24" font-weight="600" fill="#293f35">깨끗하고 균일한 금속</text><text x="50" y="190" font-size="24" font-weight="600" fill="#293f35">진공 · 단색광</text><text x="50" y="230" font-size="24" font-weight="600" fill="#293f35">hf&gt;φ → Kmax&gt;0 가능</text><text x="50" y="270" font-size="24" font-weight="600" fill="#293f35">hf&lt;φ → 조건 불충족</text>
  <rect data-regime="multiphoton-strong-field" data-scope="excluded" x="400" y="66" width="172" height="112" rx="16" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/><text x="420" y="106" font-size="24" font-weight="600" fill="#a56d30">범위 밖</text><text x="420" y="146" font-size="24" font-weight="600" fill="#293f35">다광자·강한 장</text><rect x="400" y="194" width="172" height="108" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="420" y="234" font-size="24" font-weight="600" fill="#526b58">이 글 밖</text><text x="420" y="274" font-size="24" font-weight="600" fill="#526b58">열·반도체·오염</text>
  <rect data-limit="not-all-classical-theories" x="28" y="322" width="544" height="52" rx="12" fill="#fff" stroke="#a56d30" stroke-width="2"/><text x="48" y="356" font-size="24" font-weight="600" fill="#293f35">모든 고전 이론·모든 조건의 반박 아님</text><rect data-limit="not-all-quantum-mechanics" x="28" y="390" width="544" height="52" rx="12" fill="#e1eee3" stroke="#365c42" stroke-width="2"/><text x="48" y="424" font-size="24" font-weight="600" fill="#293f35">양자역학 전체의 단독 증명 아님</text>
</svg>
