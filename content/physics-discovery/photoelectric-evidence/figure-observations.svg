<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid meet" role="img" data-figure-kind="qualitative-schematic" data-current-kind="magnitude">
  <title>세기 비교의 정성 광전류-전압 곡선</title><desc>같은 진동수의 두 세기에서 같은 화면상 정지전압 위치와 낮고 높은 포화 광전류 크기를 보이는 원본 정성도. 물리량 비율이나 일반 전압값을 부여하지 않는다.</desc>
  <rect width="600" height="380" rx="16" fill="#f6f8f0"/><rect x="24" y="20" width="552" height="306" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
  <text x="44" y="56" font-size="24" font-weight="600" fill="#293f35">같은 f &gt; fc · 같은 표면·수집 기하</text><line x1="88" y1="280" x2="548" y2="280" stroke="#293f35" stroke-width="3"/><line x1="236" y1="300" x2="236" y2="82" stroke="#293f35" stroke-width="3"/>
  <text x="260" y="314" font-size="24" font-weight="600" fill="#526b58">V수집−V방출</text><text x="44" y="92" font-size="24" font-weight="600" fill="#526b58">광전류 크기</text><text x="104" y="312" font-size="24" font-weight="600" fill="#a56d30">−Vs</text>
  <g id="low-intensity-curve"><circle data-fixture="stopping-intercept" cx="142" cy="280" r="7" fill="#365c42"/><path d="M142 280C184 268 210 236 236 224C300 194 382 190 536 190" fill="none" stroke="#365c42" stroke-width="5"/><line data-fixture="saturation-plateau" x1="402" y1="190" x2="536" y2="190" stroke="#365c42" stroke-width="5"/></g>
  <g id="high-intensity-curve"><circle data-fixture="stopping-intercept" cx="142" cy="280" r="7" fill="#a56d30"/><path d="M142 280C180 252 206 180 236 158C300 116 382 112 536 112" fill="none" stroke="#a56d30" stroke-width="5"/><line data-fixture="saturation-plateau" x1="402" y1="112" x2="536" y2="112" stroke="#a56d30" stroke-width="5"/></g>
  <text x="398" y="180" font-size="24" font-weight="600" fill="#365c42">낮은 세기</text><text x="398" y="102" font-size="24" font-weight="600" fill="#a56d30">높은 세기</text><rect x="24" y="338" width="552" height="34" rx="12" fill="#e1eee3"/><text x="42" y="364" font-size="24" font-weight="600" fill="#293f35">f&lt;fc: 보통 광전류 없음 · 정성도, 자료 아님</text>
</svg>
