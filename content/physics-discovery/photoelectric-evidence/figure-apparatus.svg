<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" preserveAspectRatio="xMidYMid meet" role="img" data-polarity="collector-negative">
  <title>조절 전원과 두 계기가 연결된 진공 광전관</title>
  <desc>금속 방출면과 수집 전극이 조절 직류 전원에 연결되고 전류계는 직렬, 전압계는 같은 두 전극 노드에 병렬로 연결된 원본 개념도. 저지 극성에서 수집 전극은 음전위이고 전기장은 오른쪽, 음전자 힘은 왼쪽이다.</desc>
  <defs><marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365c42"/></marker><marker id="amber-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a56d30"/></marker></defs>
  <rect width="600" height="480" rx="16" fill="#f6f8f0"/><text x="24" y="38" font-size="26" font-weight="600" fill="#293f35">조절 전압 · 직렬 전류계 · 병렬 전압계</text>
  <rect x="28" y="60" width="544" height="188" rx="16" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><path d="M48 104L132 142" stroke="#a56d30" stroke-width="7" marker-end="url(#amber-arrow)"/><text x="44" y="92" font-size="24" font-weight="600" fill="#a56d30">단색광 f</text>
  <rect data-fixture="emitter-label-band" data-label-band="emitter-metal" x="168" y="64" width="168" height="36" rx="10" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><path data-label-leader="emitter" d="M168 92L160 104" fill="none" stroke="#365c42" stroke-width="3"/><text x="180" y="91" font-size="24" font-weight="600" fill="#293f35">금속 방출면</text><rect data-obstacle-component="emitter-electrode" x="140" y="92" width="20" height="128" rx="6" fill="#365c42"/>
  <rect data-fixture="collector-label-band" data-label-band="collector-metal" x="430" y="64" width="138" height="36" rx="10" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><path data-label-leader="collector" d="M430 92L420 104" fill="none" stroke="#a56d30" stroke-width="3"/><text x="440" y="91" font-size="24" font-weight="600" fill="#293f35">수집 전극</text><rect data-obstacle-component="collector-electrode" x="410" y="92" width="20" height="128" rx="6" fill="#f3dcb0" stroke="#a56d30" stroke-width="2"/>
  <circle cx="238" cy="142" r="14" fill="#fff" stroke="#365c42" stroke-width="3"/><text x="230" y="150" font-size="24" font-weight="600" fill="#365c42">−</text><path d="M214 142H380" stroke="#365c42" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#green-arrow)"/><text x="224" y="118" font-size="24" font-weight="600" fill="#365c42">전자 →</text>
  <line data-fixture="electric-field" data-obstacle-line="electric-field" data-direction-x="1" x1="214" y1="176" x2="370" y2="176" stroke="#365c42" stroke-width="4" marker-end="url(#green-arrow)"/><text x="264" y="204" font-size="24" font-weight="600" fill="#365c42">E →</text><line data-fixture="electron-force" data-obstacle-line="electron-force" data-direction-x="-1" x1="382" y1="214" x2="226" y2="214" stroke="#a56d30" stroke-width="4" marker-end="url(#amber-arrow)"/><text x="264" y="238" font-size="24" font-weight="600" fill="#a56d30">Fₑ ←</text>
  <rect data-label-band="emitter-polarity" x="38" y="178" width="94" height="36" rx="10" fill="#f6f8f0" stroke="#d5dfcc" stroke-width="2"/><text x="48" y="205" font-size="24" font-weight="600" fill="#526b58">방출면 +</text><rect data-label-band="collector-polarity" x="438" y="178" width="110" height="36" rx="10" fill="#fff" stroke="#d5dfcc" stroke-width="2"/><text x="448" y="205" font-size="24" font-weight="600" fill="#a56d30">수집 −</text>
  <circle data-node="emitter-metal" cx="150" cy="220" r="4" fill="#293f35"/><circle data-node="emitter-node" cx="150" cy="270" r="5" fill="#293f35"/><circle data-node="collector-metal" cx="420" cy="220" r="4" fill="#293f35"/><circle data-node="collector-node" cx="420" cy="270" r="5" fill="#293f35"/>
