  <circle data-node="source-left" cx="250" cy="408" r="4" fill="#293f35"/><circle data-node="source-right" cx="350" cy="408" r="4" fill="#293f35"/><g data-component="adjustable-dc-bias" data-terminal-a="source-left" data-terminal-b="source-right"><line data-obstacle-line="source-left-terminal" x1="250" y1="408" x2="282" y2="408" stroke="#293f35" stroke-width="3"/><line data-obstacle-line="source-right-terminal" x1="318" y1="408" x2="350" y2="408" stroke="#293f35" stroke-width="3"/><line data-obstacle-line="source-long-plate" x1="282" y1="386" x2="282" y2="430" stroke="#365c42" stroke-width="4"/><line data-obstacle-line="source-short-plate" x1="318" y1="394" x2="318" y2="422" stroke="#365c42" stroke-width="7"/><line data-obstacle-line="source-adjust-arrow" x1="382" y1="374" x2="326" y2="400" stroke="#a56d30" stroke-width="4" marker-end="url(#amber-arrow)"/><rect data-label-band="source" x="180" y="438" width="240" height="34" rx="10" fill="#f6f8f0"/><text x="192" y="464" font-size="24" font-weight="600" fill="#293f35">조절 직류 바이어스</text></g>
  <line data-fixture="emitter-electrode-lead" data-wire="emitter-metal-lead" x1="150" y1="220" x2="150" y2="270" stroke="#293f35" stroke-width="3"/><line data-fixture="collector-electrode-lead" data-wire="collector-metal-lead" x1="420" y1="220" x2="420" y2="270" stroke="#293f35" stroke-width="3"/><line data-wire="collector-to-ammeter" x1="420" y1="270" x2="476" y2="270" stroke="#293f35" stroke-width="3"/>
  <line data-wire="ammeter-return-top" x1="524" y1="270" x2="550" y2="270" stroke="#293f35" stroke-width="3"/><line data-wire="ammeter-return-side" x1="550" y1="270" x2="550" y2="408" stroke="#293f35" stroke-width="3"/><line data-wire="ammeter-return-bottom" x1="550" y1="408" x2="350" y2="408" stroke="#293f35" stroke-width="3"/>
  <line data-wire="source-emitter-bottom" x1="250" y1="408" x2="80" y2="408" stroke="#293f35" stroke-width="3"/><line data-wire="source-emitter-side" x1="80" y1="408" x2="80" y2="270" stroke="#293f35" stroke-width="3"/><line data-wire="source-emitter-top" x1="80" y1="270" x2="150" y2="270" stroke="#293f35" stroke-width="3"/>
  <line data-wire="voltmeter-emitter-side" x1="150" y1="270" x2="150" y2="340" stroke="#293f35" stroke-width="3"/><line data-wire="voltmeter-emitter-lead" x1="150" y1="340" x2="261" y2="340" stroke="#293f35" stroke-width="3"/><line data-wire="voltmeter-collector-side" x1="420" y1="270" x2="420" y2="340" stroke="#293f35" stroke-width="3"/><line data-wire="voltmeter-collector-lead" x1="420" y1="340" x2="309" y2="340" stroke="#293f35" stroke-width="3"/>
