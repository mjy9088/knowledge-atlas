<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">빛시계의 고유시간 왕복과 다른 관성계의 반쪽 빛길</title>
  <desc id="desc">왼쪽은 빛시계와 함께 움직이는 기준계에서 거울 사이 수직 간격 L을 빛이 왕복하여 전체 빛길 2L, 고유시간 델타 타우는 2L 나누기 c가 되는 모습이다. 오른쪽은 다른 관성계에서 반 왕복 동안 빛길 c 델타 t 나누기 2가 빗변, 시계의 수평 이동 v 델타 t 나누기 2가 밑변, 두 기준계에서 변하지 않는 횡방향 거울 간격 L이 높이인 직각삼각형이다. 일정한 관성 상대속도 v는 c보다 작고 진공의 빛 속력 c는 불변이라고 가정한다. v=0.6c인 3 대 4 대 5 비율은 설명용 구성도이며 측정 자료가 아니다.</desc>
  <metadata>Original diagram authored for Knowledge Atlas, 2026-10-18. No external figure, text, or data is reproduced. This is an idealized geometric construction under constant inertial relative speed v&lt;c, invariant vacuum light speed c, and unchanged transverse mirror separation L; it is not a literal measurement, historical dataset, or proof for every clock mechanism. The displayed 3:4:5 geometry is an illustrative v=0.6c ratio.</metadata>
  <defs>
    <marker id="light-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c2410c"/>
    </marker>
    <marker id="motion-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#377b68"/>
    </marker>
  </defs>
  <rect width="600" height="300" rx="18" fill="#f4f8f3"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#263e36">
    <text x="150" y="30" text-anchor="middle" font-size="21" font-weight="700">시계와 함께: 한 왕복</text>
    <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700">다른 관성계: 반 왕복</text>

    <rect x="14" y="43" width="272" height="200" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/>
    <rect x="314" y="43" width="272" height="200" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/>

    <path d="M78 63H210M78 207H210" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M124 196V74" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" marker-end="url(#light-arrow)"/>
    <path d="M164 74V196" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" marker-end="url(#light-arrow)"/>
    <line id="rest-L" x1="54" y1="63" x2="54" y2="207" stroke="#377b68" stroke-width="3"/>
    <path d="M47 63H61M47 207H61" fill="none" stroke="#377b68" stroke-width="3"/>
    <text x="35" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#377b68">L</text>
    <text x="144" y="139" text-anchor="middle" font-size="24" font-weight="700">왕복 2L</text>
    <text x="150" y="228" text-anchor="middle" font-size="24" font-weight="700">Δτ = 2L/c</text>

    <path d="M337 207L445 63L445 207Z" fill="#e1eee3" fill-opacity="0.62" stroke="#c4d7cc" stroke-width="2"/>
    <line id="light-distance" x1="337" y1="207" x2="445" y2="63" stroke="#c2410c" stroke-width="6" stroke-linecap="round" marker-end="url(#light-arrow)"/>
    <line id="clock-displacement" x1="337" y1="207" x2="445" y2="207" stroke="#377b68" stroke-width="5" stroke-linecap="round" marker-end="url(#motion-arrow)"/>
    <line id="moving-L" x1="445" y1="63" x2="445" y2="207" stroke="#64748b" stroke-width="4" stroke-dasharray="7 6"/>
    <path d="M427 207V189H445" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M413 63H477M413 207H477" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <text x="348" y="151" font-size="24" font-weight="700" fill="#9a3412" transform="rotate(-53.13 348 151)">cΔt/2</text>
    <text x="391" y="237" text-anchor="middle" font-size="24" font-weight="700" fill="#377b68">vΔt/2</text>
    <text x="465" y="145" font-size="26" font-weight="700" fill="#475569">L</text>
    <text x="522" y="92" text-anchor="middle" font-size="16" fill="#526b58">3:4:5 비율</text>
    <text x="522" y="114" text-anchor="middle" font-size="16" fill="#526b58">v = 0.6c 예</text>

    <text x="300" y="269" text-anchor="middle" font-size="17" font-weight="600">가정: 등속 관성 v&lt;c · 빛 속력 c 불변 · 횡간격 L 동일</text>
    <text x="300" y="292" text-anchor="middle" font-size="16" fill="#526b58">직각삼각형 구성도 · 실제 측정 자료 아님</text>
  </g>
</svg>
