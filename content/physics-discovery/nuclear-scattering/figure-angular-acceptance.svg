<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">같은 사건 방향에서 넓은 평면 범위와 좁은 앞쪽 범위 비교</title>
  <desc id="desc">왼쪽은 완전한 입체각 검출기가 아니라 산란 평면 안의 개념적인 넓은 각도 범위에서 같은 네 개의 설명용 사건 방향을 모두 본다. 오른쪽은 사건 방향과 끝점을 그대로 둔 채 좁은 앞쪽 범위만 적용하여 앞쪽 두 사건은 보이고 옆과 뒤 사건은 보이지 않게 한다. 보이지 않는 것은 사건이 0이라는 뜻이 아니다.</desc>
  <metadata>Original acceptance comparison authored for Knowledge Atlas, 2026-10-19. Event rays are identical illustrative directions in both panels, not historical data or measured trajectories.</metadata>
  <defs><marker id="ray-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="560" height="360" rx="16" fill="#f6f8f0"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text data-essential-label="heading" x="280" y="30" text-anchor="middle" font-size="26" font-weight="700">같은 방향들 · 달라지는 것은 검출 범위</text>
    <rect x="16" y="52" width="252" height="244" rx="14" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
    <rect x="292" y="52" width="252" height="244" rx="14" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
    <g id="full-acceptance" data-coverage="broad-in-plane" transform="translate(0 0)">
      <text data-essential-label="full" x="142" y="82" text-anchor="middle" font-size="24" font-weight="700">넓은 평면 범위</text>
      <circle cx="135" cy="196" r="12" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/>
      <line data-event="forward-a" data-status="seen" x1="135" y1="196" x2="238" y2="196" stroke="#365c42" stroke-width="4" marker-end="url(#ray-arrow)"/>
      <line data-event="forward-b" data-status="seen" x1="135" y1="196" x2="232" y2="168" stroke="#365c42" stroke-width="4" marker-end="url(#ray-arrow)"/>
      <line data-event="side" data-status="seen" x1="135" y1="196" x2="135" y2="96" stroke="#365c42" stroke-width="4" marker-end="url(#ray-arrow)"/>
      <line data-event="backward" data-status="seen" x1="135" y1="196" x2="54" y2="128" stroke="#365c42" stroke-width="4" marker-end="url(#ray-arrow)"/>
      <text data-essential-label="all-seen" x="142" y="274" text-anchor="middle" font-size="22">앞 · 옆 · 뒤를 비교</text>
    </g>
    <g id="narrow-forward-acceptance" transform="translate(276 0)">
      <text data-essential-label="narrow" x="142" y="82" text-anchor="middle" font-size="24" font-weight="700">좁은 앞쪽 수용</text>
      <path d="M135 196L242 158A114 114 0 0 1 242 234Z" fill="#e1eee3" opacity=".72" stroke="#365c42" stroke-width="2"/>
      <circle cx="135" cy="196" r="12" fill="#f3dcb0" stroke="#a56d30" stroke-width="3"/>
      <line data-event="forward-a" data-status="seen" x1="135" y1="196" x2="238" y2="196" stroke="#365c42" stroke-width="4" marker-end="url(#ray-arrow)"/>
      <line data-event="forward-b" data-status="seen" x1="135" y1="196" x2="232" y2="168" stroke="#365c42" stroke-width="4" marker-end="url(#ray-arrow)"/>
      <line data-event="side" data-status="unseen" x1="135" y1="196" x2="135" y2="96" stroke="#a56d30" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#ray-arrow)"/>
      <line data-event="backward" data-status="unseen" x1="135" y1="196" x2="54" y2="128" stroke="#a56d30" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#ray-arrow)"/>
      <text data-essential-label="masked" x="142" y="274" text-anchor="middle" font-size="22">옆 · 뒤는 수용 범위 밖</text>
    </g>
    <text data-essential-label="scope" x="280" y="326" text-anchor="middle" font-size="22" fill="#526b58">같은 설명용 사건 방향 · 보이지 않음 ≠ 사건 0</text>
    <text data-essential-label="scope-detail" x="280" y="350" text-anchor="middle" font-size="22" fill="#526b58">평면 안 개념도 · 완전한 4π 검출기 아님</text>
  </g>
</svg>
