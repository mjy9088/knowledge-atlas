<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc" data-representation="qualitative-schematic" data-source-data="none" data-quantity="nu-W2" data-range-Q2="greater-than-1-GeV2" data-range-omega="greater-than-4">
  <title id="title">R이 0인 경우와 무한대인 경우의 서로 다른 결과</title>
  <desc id="desc">R이 0인 횡편광 우세에서는 Q 제곱 1 GeV 제곱 초과와 오메가 4 초과에서 뉴 W2가 오메가의 함수라는 결과와 측정 오차 안에 양립했다. R이 무한대로 가는 종편광 우세에서는 보편 곡선으로 모이지 않고 고정 오메가에서 뉴 W2가 Q 제곱과 함께 증가했다.</desc>
  <rect width="600" height="380" rx="16" fill="#f6f8f0"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text x="300" y="34" text-anchor="middle" font-size="26" font-weight="700">같은 자료, 다른 R 가정, 다른 결론</text>
    <rect x="24" y="58" width="552" height="268" rx="14" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
    <g data-r-case="zero" data-behavior="universal-compatible">
      <rect data-geometry="upper-row" x="42" y="78" width="516" height="100" rx="12" fill="#edf4e9" stroke="#365c42" stroke-width="2"/>
      <rect data-geometry="upper-label" x="58" y="88" width="240" height="86" fill="none"/>
      <text x="62" y="112" font-size="24" font-weight="700">R=0 · 횡편광 우세</text>
      <text x="62" y="144" font-size="24">νW₂ ≈ F(ω)</text>
      <text x="62" y="170" font-size="24">측정 오차 안에 양립</text>
      <rect data-geometry="upper-curve" x="338" y="92" width="200" height="48" fill="none"/>
      <path d="M350 106C404 110 458 120 526 132" fill="none" stroke="#365c42" stroke-width="6"/>
      <rect data-geometry="upper-range" x="338" y="146" width="200" height="28" fill="none"/>
      <text x="342" y="170" font-size="24">Q²&gt;1 GeV² · ω&gt;4</text>
    </g>
    <g data-r-case="infinity" data-behavior="rises-with-Q2-at-fixed-omega">
      <rect data-geometry="lower-row" x="42" y="188" width="516" height="134" rx="12" fill="#fff7e8" stroke="#a56d30" stroke-width="2"/>
      <rect data-geometry="lower-label" x="58" y="194" width="250" height="108" fill="none"/>
      <text x="62" y="220" font-size="24" font-weight="700">R→∞ · 종편광 우세</text>
      <text x="62" y="254" font-size="24">보편 곡선으로</text>
      <text x="62" y="286" font-size="24">모이지 않음</text>
      <rect data-geometry="lower-curve" x="338" y="198" width="200" height="44" fill="none"/>
      <line x1="350" y1="234" x2="520" y2="202" stroke="#a56d30" stroke-width="6"/>
      <rect data-geometry="lower-trend" x="318" y="244" width="224" height="68" fill="none"/>
      <text data-fit="lower-trend-condition" x="322" y="270" font-size="24">ω 고정</text>
      <text data-fit="lower-trend-result" x="322" y="302" font-size="24">Q²↑ ⇒ νW₂↑</text>
    </g>
    <text x="300" y="360" text-anchor="middle" font-size="24" fill="#526b58">ω=2Mν/Q² · 정성 대비 · 자료점·오차 띠 아님</text>
  </g>
</svg>
