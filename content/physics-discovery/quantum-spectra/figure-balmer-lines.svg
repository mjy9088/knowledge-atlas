<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc" data-spectrum-scope="selected-table-rows">
  <title id="title">선택한 수소 발머 전이의 공기 파장 위치</title>
  <desc id="desc">400에서 670 나노미터까지의 선형 축에 선택한 원자 수소 전이의 공기 파장 410.2, 434.0, 486.1, 656.3 나노미터가 놓인다. 선 높이는 같으며 밝기 자료가 아니다.</desc>
  <metadata>Original schematic by Knowledge Atlas; no external figure or dataset geometry copied.</metadata>
  <rect width="600" height="380" rx="16" fill="#f6f8f0"/>
  <text x="32" y="42" font-size="26" font-weight="700" fill="#293f35">선택한 원자 수소 발머 전이</text>
  <text x="32" y="76" font-size="24" font-weight="600" fill="#526b58">NIST 표 네 행 · 반올림한 공기 파장</text>
  <rect x="32" y="96" width="536" height="216" rx="14" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/>
  <g id="linear-air-wavelength-axis" data-axis-min="400" data-x="64" data-axis-max="670" data-axis-end-x="548">
    <line x1="64" y1="252" x2="548" y2="252" stroke="#365c42" stroke-width="4"/>
    <line x1="64" y1="244" x2="64" y2="264" stroke="#365c42" stroke-width="3"/>
    <line x1="548" y1="244" x2="548" y2="264" stroke="#365c42" stroke-width="3"/>
    <text x="64" y="292" text-anchor="middle" font-size="24" font-weight="600" fill="#293f35">400</text>
    <text x="548" y="292" text-anchor="middle" font-size="24" font-weight="600" fill="#293f35">670 nm</text>
    <line data-wavelength-nm="410.2" x1="82.3" y1="184" x2="82.3" y2="252" stroke="#a56d30" stroke-width="6"/>
    <line data-wavelength-nm="434.0" x1="124.9" y1="184" x2="124.9" y2="252" stroke="#a56d30" stroke-width="6"/>
    <line data-wavelength-nm="486.1" x1="218.3" y1="184" x2="218.3" y2="252" stroke="#a56d30" stroke-width="6"/>
    <line data-wavelength-nm="656.3" x1="523.4" y1="184" x2="523.4" y2="252" stroke="#a56d30" stroke-width="6"/>
  </g>
  <line data-leader-for="410.2" x1="82.3" y1="180" x2="82.3" y2="126" stroke="#526b58" stroke-width="2"/>
  <text data-label-for="410.2" x="42" y="122" font-size="24" font-weight="600" fill="#293f35">410.2</text>
  <line data-leader-for="434.0" x1="124.9" y1="180" x2="154" y2="160" stroke="#526b58" stroke-width="2"/>
  <text data-label-for="434.0" x="152" y="166" font-size="24" font-weight="600" fill="#293f35">434.0</text>
  <line data-leader-for="486.1" x1="218.3" y1="180" x2="238" y2="126" stroke="#526b58" stroke-width="2"/>
  <text data-label-for="486.1" x="236" y="122" font-size="24" font-weight="600" fill="#293f35">486.1</text>
  <line data-leader-for="656.3" x1="523.4" y1="180" x2="520" y2="160" stroke="#526b58" stroke-width="2"/>
  <text data-label-for="656.3" x="500" y="166" font-size="24" font-weight="600" fill="#293f35">656.3</text>
  <text x="300" y="344" text-anchor="middle" font-size="24" font-weight="600" fill="#526b58">같은 높이 = 위치 표시만 · 밝기 자료 아님</text>
  <text x="300" y="372" text-anchor="middle" font-size="24" font-weight="600" fill="#526b58">NIST 표에서 고른 네 전이만 표시</text>
</svg>
