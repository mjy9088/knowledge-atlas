<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">알짜 외력 0에서 가능한 두 일정한 속도</title>
  <desc id="desc">위쪽 정지 경우와 아래쪽 등속 직선 운동 경우 모두 물체에 왼쪽과 오른쪽의 같은 크기 외력이 반대 방향으로 작용해 벡터 합이 0이다. 정지 경우의 같은 시간 위치 네 개는 한곳에 겹치고, 운동 경우의 위치 네 개는 같은 간격으로 오른쪽에 놓인다. 알짜 힘 0은 힘이 없다는 뜻이 아니며 속도 0과 0이 아닌 일정한 속도를 모두 포함한다.</desc>
  <metadata>Original force-and-velocity schematic authored for Knowledge Atlas, 2026-10-19. No external figure, measurements, data, or prose are reproduced. Equal spacing and force-arrow lengths are qualitative teaching geometry, not measured or scaled values. The figure illustrates the scoped first-law conditional in an inertial frame and does not prove the law.</metadata>
  <defs>
    <marker id="force-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="560" height="360" rx="16" fill="#f6f8f0"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text data-essential-label="law" x="280" y="30" text-anchor="middle" font-size="26" font-weight="700">ΣF외력 = 0 → v는 일정</text>
    <text data-essential-label="scope" x="280" y="56" text-anchor="middle" font-size="22" fill="#526b58">관성 기준계 · 힘 없음이 아니라 외력이 상쇄됨</text>
    <g id="stationary-case" data-net-force="zero" data-velocity="zero">
      <rect x="16" y="68" width="528" height="120" rx="12" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
      <text data-essential-label="stationary-case" x="32" y="96" font-size="24" font-weight="700">정지: v = 0 일정</text>
      <line data-force="left" x1="420" y1="120" x2="380" y2="120" stroke="#c2410c" stroke-width="5" marker-end="url(#force-arrow)"/>
      <line data-force="right" x1="420" y1="120" x2="460" y2="120" stroke="#c2410c" stroke-width="5" marker-end="url(#force-arrow)"/>
      <circle cx="420" cy="120" r="14" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <text data-essential-label="stationary-forces" x="420" y="166" text-anchor="middle" font-size="22">같은 크기 · 반대 방향</text>
      <line x1="92" y1="148" x2="304" y2="148" stroke="#d5dfcc" stroke-width="3"/>
      <circle data-position="0" cx="148" cy="132" r="11" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <circle data-position="1" cx="148" cy="132" r="8" fill="none" stroke="#365c42" stroke-width="2"/>
      <circle data-position="2" cx="148" cy="132" r="5" fill="none" stroke="#526b58" stroke-width="2"/>
      <circle data-position="3" cx="148" cy="132" r="2" fill="#293f35"/>
      <text x="198" y="176" text-anchor="middle" font-size="22" data-essential-label="stationary-positions" data-position-relation="x(t0)=x(t1)=x(t2)=x(t3)">x(t₀)=x(t₁)=x(t₂)=x(t₃)</text>
    </g>
    <g id="constant-motion-case" data-net-force="zero" data-velocity="constant-nonzero">
      <rect x="16" y="204" width="528" height="120" rx="12" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
      <text data-essential-label="moving-case" x="32" y="232" font-size="24" font-weight="700">등속 직선: v ≠ 0 일정</text>
      <line data-force="left" x1="420" y1="256" x2="380" y2="256" stroke="#c2410c" stroke-width="5" marker-end="url(#force-arrow)"/>
      <line data-force="right" x1="420" y1="256" x2="460" y2="256" stroke="#c2410c" stroke-width="5" marker-end="url(#force-arrow)"/>
      <circle cx="420" cy="256" r="14" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <text data-essential-label="moving-forces" x="420" y="302" text-anchor="middle" font-size="22">같은 크기 · 반대 방향</text>
      <line x1="92" y1="284" x2="320" y2="284" stroke="#d5dfcc" stroke-width="3"/>
      <circle data-position="0" cx="148" cy="268" r="9" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <circle data-position="1" cx="192" cy="268" r="9" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <circle data-position="2" cx="236" cy="268" r="9" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <circle data-position="3" cx="280" cy="268" r="9" fill="#e1eee3" stroke="#293f35" stroke-width="2"/>
      <text data-essential-label="moving-positions" x="216" y="310" text-anchor="middle" font-size="22">같은 Δt → 같은 간격</text>
    </g>
  </g>
</svg>
