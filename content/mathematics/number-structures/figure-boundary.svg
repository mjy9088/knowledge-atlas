<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title">
<title id="title">0과 1 사이 집합의 가장 낮은 천장은 1이지만 1은 집합 밖</title><rect width="600" height="360" rx="16" fill="#f7f8fb"/>
<g font-family="system-ui,sans-serif" font-size="26" fill="#172033"><text x="25" y="45">가장 낮은 천장과 가장 큰 원소</text><text x="30" y="100">집합: 0보다 크고 1보다 작은 수</text>
<path d="M55 190 H550" stroke="#536d7e" stroke-width="3"/><path d="M60 170 H440" stroke="#087f72" stroke-width="9"/>
<circle cx="60" cy="170" r="9" fill="white" stroke="#087f72" stroke-width="3"/><circle cx="440" cy="170" r="9" fill="white" stroke="#087f72" stroke-width="3"/>
<text x="50" y="235">0</text><text x="430" y="235">1</text><text x="520" y="235">2</text><text x="25" y="295">상한: 1, 2, … · 최소 상한: 1</text><text x="25" y="340">1은 집합 밖 → 최대 원소는 없음</text></g></svg>
