<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title"><title id="title">완비 순서체 비교 증명의 의존 관계 안내</title><rect width="600" height="400" rx="16" fill="#f7f8fb"/>
<g font-family="system-ui,sans-serif" font-size="25" fill="#172033"><text x="25" y="45">선택 증명: 어느 단계에 무엇이 필요할까요?</text><text x="35" y="105">정수 경계 → 절단 집합의 상한 존재</text><text x="35" y="160">두 유리수 → 두 원소의 순서 분리</text><text x="35" y="215">같은 유리수 → 비교를 두 체로 전달</text><text x="35" y="270">역절단 → 모든 목표 원소에 도달</text><text x="35" y="325">최소 상한 보존 → 합·곱의 보존</text><text x="25" y="380">의존 관계 안내 · 증명은 각 장면에서 전개</text></g></svg>
