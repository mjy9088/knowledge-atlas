<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title">
<title id="title">한 변이 1인 정사각형의 대각선과 짝홀수 모순</title><rect width="600" height="360" rx="16" fill="#f7f8fb"/>
<path d="M40 90 H210 V260 H40 Z M40 260 L210 90" fill="none" stroke="#087f72" stroke-width="5"/>
<g font-family="system-ui,sans-serif" font-size="26" fill="#172033"><text x="35" y="45">정확한 길이 √2는 분수가 아닙니다</text><text x="115" y="80">1</text><text x="220" y="185">1</text><text x="85" y="185">√2</text>
<text x="285" y="110">√2 = p/q 가정</text><text x="285" y="165">p² = 2q² → p 짝수</text><text x="285" y="220">q² = 2k² → q 짝수</text><text x="285" y="275">약분 끝남과 모순</text><text x="35" y="335">이 길이 하나 추가 ≠ 실수 전체 구성</text></g></svg>
