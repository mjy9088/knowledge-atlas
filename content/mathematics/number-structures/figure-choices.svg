<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title">
<title id="title">계산이 막힌 네 질문</title>
<rect width="600" height="360" rx="16" fill="#f7f8fb"/>
<g font-family="system-ui,sans-serif" font-size="27" fill="#172033">
<text x="30" y="50">지금 가진 수로 답을 적을 수 있나요?</text>
<text x="45" y="115">2 − 5 = ?</text><text x="320" y="115">2 × ? = 1</text>
<text x="45" y="200">대각선² = 2</text><text x="320" y="200">?² = −1</text>
<path d="M45 245 H550" stroke="#c8d0de"/>
<text x="30" y="300">풀 문제 + 지킬 규칙 → 확장의 선택</text>
</g></svg>
