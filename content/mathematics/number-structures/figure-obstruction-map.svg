<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1360" viewBox="0 0 600 1360" role="img" aria-labelledby="title desc">
  <title id="title">국소 수리와 보편 구조 요구의 갈림길</title>
  <desc id="desc">2 빼기 5와 2x는 1은 각각 정수와 유리수의 연산 수리로 이어진다. d 제곱은 2라는 장애에서는 제곱근 2 하나를 붙이는 국소 수리와 모든 비어 있지 않고 위로 제한된 집합에 최소 상한을 요구하는 보편 구조 선택이 갈라진다. x 제곱은 음의 1이라는 장애는 복소수의 대수적 확장으로 이어지며, 실수 순서를 확장하는 순서체 전순서는 포기한다.</desc>
  <metadata>Original Knowledge Atlas obstruction map, revised 2026-10-20. No external artwork, font, data, or measured geometry is reproduced. Source, mathematical, learner, rights, browser, and publication review remain separate.</metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcf6"/><stop offset="1" stop-color="#edf2e5"/></linearGradient>
    <filter id="lift" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#293f35" flood-opacity=".12"/></filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#365c42"/></marker>
    <marker id="branch" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#a56d30"/></marker>
  </defs>
  <rect width="600" height="1360" rx="24" fill="url(#paper)"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text x="300" y="48" text-anchor="middle" font-size="28" font-weight="700">장애가 다음 체계를 강제하지는 않습니다</text>

    <g filter="url(#lift)">
      <rect x="36" y="82" width="528" height="154" rx="18" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
      <rect x="36" y="286" width="528" height="154" rx="18" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
      <rect x="36" y="490" width="528" height="116" rx="18" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
      <rect x="72" y="682" width="492" height="148" rx="18" fill="#fff8ea" stroke="#d5b67d" stroke-width="2"/>
      <rect x="72" y="906" width="492" height="174" rx="18" fill="#e1eee3" stroke="#7c9a83" stroke-width="2"/>
      <rect x="36" y="1130" width="528" height="154" rx="18" fill="#fff" stroke="#d5dfcc" stroke-width="2"/>
    </g>

    <g font-size="24">
      <text x="62" y="120" font-weight="700">막힘 · ℕ에서 2−5</text>
      <path d="M300 138V166" stroke="#365c42" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="300" y="198" text-anchor="middle" font-weight="700">선택한 연산 수리 · ℤ</text>
      <text x="300" y="226" text-anchor="middle" fill="#526b58">덧셈 역원을 주어 2−5=−3</text>

      <text x="62" y="324" font-weight="700">막힘 · ℤ에서 2x=1</text>
      <path d="M300 342V370" stroke="#365c42" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="300" y="402" text-anchor="middle" font-weight="700">선택한 연산 수리 · ℚ</text>
      <text x="300" y="430" text-anchor="middle" fill="#526b58">0 아닌 원소의 곱셈 역원을 추가</text>

      <text x="300" y="532" text-anchor="middle" font-weight="700">막힘 · ℚ에서 d²=2</text>
      <text x="300" y="574" text-anchor="middle" fill="#526b58">어떤 범위의 수리를 고를까요?</text>

      <path d="M300 606V674" fill="none" stroke="#a56d30" stroke-width="3" marker-end="url(#branch)"/>
      <text x="98" y="724" fill="#a56d30" font-weight="700">선택 A · 국소 수리 · ℚ(√2)</text>
      <text x="98" y="764">이름 붙인 한 근 √2를 추가</text>
      <text x="98" y="802" fill="#526b58">주어진 실수체 안의 생성된 부분체</text>

      <path d="M300 606H52V872H96V898" fill="none" stroke="#365c42" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="98" y="948" fill="#365c42" font-weight="700">선택 B · 보편 구조 요구</text>
      <text x="98" y="988">ℝ · 모든 비어 있지 않고</text>
      <text x="98" y="1024">위로 제한된 집합에 최소 상한</text>
      <text x="98" y="1060" fill="#526b58">한 방정식보다 강한 전역 조건</text>

      <text x="62" y="1172" font-weight="700">막힘 · ℝ에서 x²=−1</text>
      <text x="62" y="1212">대수 수리 · ℂ: 새 근과 체 구조</text>
      <text x="62" y="1248" fill="#a56d30">비용 · 실수 순서를 확장하며 체 연산과</text>
      <text x="62" y="1278" fill="#a56d30">양립하는 전순서는 포기</text>
    </g>
    <text x="300" y="1340" text-anchor="middle" font-size="24" fill="#a56d30">해 하나와 모든 경계는 서로 다른 선택입니다.</text>
  </g>
</svg>
