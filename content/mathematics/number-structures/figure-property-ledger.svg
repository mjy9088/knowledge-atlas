<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">자연수에서 복소수까지의 성질 장부</title>
  <desc id="desc">네 행으로 자연수에서 정수는 덧셈 역원과 뺄셈, 정수에서 유리수는 0이 아닌 곱셈 역원과 나눗셈, 유리수에서 실수는 최소 상한, 실수에서 복소수는 제곱이 음의 1인 수를 얻는다고 정리한다. 마지막 행은 실수 순서를 확장하는 순서체 조건을 보존하지 못함을 따로 표시한다.</desc>
  <metadata>Original Knowledge Atlas property ledger, 2026-10-20. It is an explanatory synthesis, not external data or a claim that these are the only extensions. Review and publication remain pending.</metadata>
  <rect width="720" height="460" rx="20" fill="#f6f8f0"/>
  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#293f35">
    <text x="360" y="38" text-anchor="middle" font-size="23" font-weight="700">확장할 때의 성질 장부</text>
    <g font-size="17" font-weight="700"><text x="48" y="78">전환</text><text x="178" y="78">새로 해결</text><text x="395" y="78">계속 보존</text></g>
    <g id="ledger" font-size="18">
      <g data-transition="N-Z"><rect x="24" y="92" width="672" height="70" rx="12" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/><text x="48" y="133" font-weight="700">ℕ → ℤ</text><text x="178" y="122">덧셈 역원</text><text x="178" y="147" fill="#526b58">2−5=−3</text><text x="395" y="133">자연수 덧셈·순서</text></g>
      <g data-transition="Z-Q"><rect x="24" y="172" width="672" height="70" rx="12" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/><text x="48" y="213" font-weight="700">ℤ → ℚ</text><text x="178" y="202">곱셈 역원</text><text x="178" y="227" fill="#526b58">2x=1</text><text x="395" y="213">정수 사칙연산의 값</text></g>
      <g data-transition="Q-R"><rect x="24" y="252" width="672" height="70" rx="12" fill="#ffffff" stroke="#d5dfcc" stroke-width="2"/><text x="48" y="293" font-weight="700">ℚ → ℝ</text><text x="178" y="282">최소 상한</text><text x="178" y="307" fill="#526b58">sup A=√2</text><text x="395" y="293">순서체 구조</text></g>
      <g data-transition="R-C"><rect x="24" y="332" width="672" height="82" rx="12" fill="#e1eee3" stroke="#365c42" stroke-width="2"/><text x="48" y="379" font-weight="700">ℝ → ℂ</text><text x="178" y="366">i²=−1</text><text x="178" y="393" fill="#526b58">다항방정식의 해</text><text x="395" y="366">실수 체 연산</text><text x="395" y="393" fill="#a56d30" font-weight="700">순서체 전순서는 포기</text></g>
    </g>
    <text x="360" y="444" text-anchor="middle" font-size="17" fill="#526b58">더 큰 체도 존재합니다. 이 장부는 ‘마지막 수’의 순위표가 아닙니다.</text>
  </g>
</svg>
