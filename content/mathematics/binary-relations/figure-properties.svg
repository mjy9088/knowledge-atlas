<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">관계의 성질은 전체 조건</title><desc id="desc">반사성은 모든 자기 연결, 대칭성은 모든 화살표의 역방향, 추이성은 이어진 모든 두 화살표의 직통 연결을 요구한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">관계의 성질은 전체 조건</text><rect x="15" y="65" width="180" height="180" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><rect x="210" y="65" width="180" height="180" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><rect x="405" y="65" width="180" height="180" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="105" y="105" text-anchor="middle" font-size="24" fill="#263e36">반사성</text><text x="300" y="105" text-anchor="middle" font-size="24" fill="#263e36">대칭성</text><text x="495" y="105" text-anchor="middle" font-size="24" fill="#263e36">추이성</text><text x="105" y="162" text-anchor="middle" font-size="28" fill="#263e36">a → a</text><text x="300" y="162" text-anchor="middle" font-size="26" fill="#263e36">a → b</text><text x="300" y="199" text-anchor="middle" font-size="23" fill="#263e36">b → a 도</text><text x="495" y="155" text-anchor="middle" font-size="21" fill="#263e36">a → b → c</text><text x="495" y="200" text-anchor="middle" font-size="23" fill="#263e36">a → c 도</text><text x="105" y="199" text-anchor="middle" font-size="23" fill="#263e36">모든 a</text><text x="300" y="280" text-anchor="middle" font-size="21" fill="#263e36">한 화살표만 확인해서는 충분하지 않아요</text></g></svg>