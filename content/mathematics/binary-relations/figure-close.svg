<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">표현은 달라도 같은 관계</title><desc id="desc">왼쪽의 세 화살표와 오른쪽 표의 세 1이 같은 순서쌍을 나타낸다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">표현은 달라도 같은 관계</text><g transform="translate(0,45) scale(0.53)"><rect x="30" y="15" width="120" height="190" rx="12" fill="#e4edf9" stroke="#c4d7cc" stroke-width="2"/><rect x="350" y="15" width="170" height="190" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="24" fill="#263e36">사람 A</text><text x="435" y="43" text-anchor="middle" font-size="24" fill="#263e36">수업 B</text><text x="90" y="100" text-anchor="middle" font-size="28" fill="#263e36">민</text><text x="90" y="175" text-anchor="middle" font-size="28" fill="#263e36">수</text><text x="435" y="100" text-anchor="middle" font-size="28" fill="#263e36">논리</text><text x="435" y="175" text-anchor="middle" font-size="28" fill="#263e36">확률</text><path d="M150 91 L347 91" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><path d="M150 98 L347 160" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><path d="M150 166 L347 166" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/></g><rect x="350" y="70" width="220" height="170" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="405" y="105" text-anchor="middle" font-size="23" fill="#263e36">논리</text><text x="500" y="105" text-anchor="middle" font-size="23" fill="#263e36">확률</text><text x="330" y="150" text-anchor="middle" font-size="23" fill="#263e36">민</text><text x="330" y="210" text-anchor="middle" font-size="23" fill="#263e36">수</text><rect x="365" y="120" width="75" height="45" rx="12" fill="#d2e9d8" stroke="#c4d7cc" stroke-width="2"/><text x="402" y="151" text-anchor="middle" font-size="27" fill="#263e36">1</text><rect x="460" y="120" width="75" height="45" rx="12" fill="#d2e9d8" stroke="#c4d7cc" stroke-width="2"/><text x="497" y="151" text-anchor="middle" font-size="27" fill="#263e36">1</text><rect x="365" y="180" width="75" height="45" rx="12" fill="#f4f5ef" stroke="#c4d7cc" stroke-width="2"/><text x="402" y="211" text-anchor="middle" font-size="27" fill="#263e36">0</text><rect x="460" y="180" width="75" height="45" rx="12" fill="#d2e9d8" stroke="#c4d7cc" stroke-width="2"/><text x="497" y="211" text-anchor="middle" font-size="27" fill="#263e36">1</text><text x="300" y="280" text-anchor="middle" font-size="22" fill="#263e36">R = {(민, 논리), (민, 확률), (수, 확률)}</text></g></svg>