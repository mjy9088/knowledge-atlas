<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">같은 연결을 순서쌍과 표로</title><desc id="desc">순서쌍 세 개와 같은 연결을 표시한 2행 2열 표. 민 행은 1,1이고 수 행은 0,1이다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">같은 연결을 순서쌍과 표로</text><text x="155" y="115" text-anchor="middle" font-size="26" fill="#263e36">(민, 논리)</text><text x="155" y="173" text-anchor="middle" font-size="26" fill="#263e36">(민, 확률)</text><text x="155" y="231" text-anchor="middle" font-size="26" fill="#263e36">(수, 확률)</text><rect x="350" y="70" width="220" height="170" rx="12" fill="#fff" stroke="#c4d7cc" stroke-width="2"/><text x="405" y="105" text-anchor="middle" font-size="23" fill="#263e36">논리</text><text x="500" y="105" text-anchor="middle" font-size="23" fill="#263e36">확률</text><text x="330" y="150" text-anchor="middle" font-size="23" fill="#263e36">민</text><text x="330" y="210" text-anchor="middle" font-size="23" fill="#263e36">수</text><rect x="365" y="120" width="75" height="45" rx="12" fill="#d2e9d8" stroke="#c4d7cc" stroke-width="2"/><text x="402" y="151" text-anchor="middle" font-size="27" fill="#263e36">1</text><rect x="460" y="120" width="75" height="45" rx="12" fill="#d2e9d8" stroke="#c4d7cc" stroke-width="2"/><text x="497" y="151" text-anchor="middle" font-size="27" fill="#263e36">1</text><rect x="365" y="180" width="75" height="45" rx="12" fill="#f4f5ef" stroke="#c4d7cc" stroke-width="2"/><text x="402" y="211" text-anchor="middle" font-size="27" fill="#263e36">0</text><rect x="460" y="180" width="75" height="45" rx="12" fill="#d2e9d8" stroke="#c4d7cc" stroke-width="2"/><text x="497" y="211" text-anchor="middle" font-size="27" fill="#263e36">1</text></g></svg>