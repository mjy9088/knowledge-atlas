<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">관계와 함수의 차이</title><desc id="desc">왼쪽 관계에서 민은 두 수업과 연결된다. 오른쪽 함수에서는 민과 수 각각 수업 하나와 연결된다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#377b68"/></marker></defs><rect width="600" height="300" rx="18" fill="#f4f8f3"/><g font-family="system-ui,Malgun Gothic,sans-serif"><text x="300" y="32" text-anchor="middle" font-size="23" fill="#263e36">관계와 함수의 차이</text><g transform="translate(0,45) scale(0.53)"><rect x="30" y="15" width="120" height="190" rx="12" fill="#e4edf9" stroke="#c4d7cc" stroke-width="2"/><rect x="350" y="15" width="170" height="190" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="24" fill="#263e36">사람 A</text><text x="435" y="43" text-anchor="middle" font-size="24" fill="#263e36">수업 B</text><text x="90" y="100" text-anchor="middle" font-size="28" fill="#263e36">민</text><text x="90" y="175" text-anchor="middle" font-size="28" fill="#263e36">수</text><text x="435" y="100" text-anchor="middle" font-size="28" fill="#263e36">논리</text><text x="435" y="175" text-anchor="middle" font-size="28" fill="#263e36">확률</text><path d="M150 91 L347 91" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><path d="M150 98 L347 160" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><path d="M150 166 L347 166" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/></g><g transform="translate(300,45) scale(0.53)"><rect x="30" y="15" width="120" height="190" rx="12" fill="#e4edf9" stroke="#c4d7cc" stroke-width="2"/><rect x="350" y="15" width="170" height="190" rx="12" fill="#fff0d0" stroke="#c4d7cc" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="24" fill="#263e36">사람 A</text><text x="435" y="43" text-anchor="middle" font-size="24" fill="#263e36">수업 B</text><text x="90" y="100" text-anchor="middle" font-size="28" fill="#263e36">민</text><text x="90" y="175" text-anchor="middle" font-size="28" fill="#263e36">수</text><text x="435" y="100" text-anchor="middle" font-size="28" fill="#263e36">논리</text><text x="435" y="175" text-anchor="middle" font-size="28" fill="#263e36">확률</text><path d="M150 91 L347 91" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/><path d="M150 166 L347 166" fill="none" stroke="#377b68" stroke-width="4" marker-end="url(#arrow)"/></g><text x="150" y="235" text-anchor="middle" font-size="22" fill="#263e36">관계: 출력 둘도 허용</text><text x="450" y="235" text-anchor="middle" font-size="22" fill="#263e36">함수: 각 입력에 하나</text></g></svg>