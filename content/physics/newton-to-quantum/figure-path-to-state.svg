<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1340" viewBox="0 0 600 1340" role="img" aria-labelledby="title desc">
  <title id="title">결정 방향에 따른 진폭의 보강과 상쇄</title>
  <desc id="desc">같게 준비된 전자가 결정에 입사하고 두 검출 방향에서 설명용 진폭과 그 절댓값 제곱을 비교합니다. 방향 A는 진폭 2와 비정규화 상대 가중치 4, 방향 B는 진폭 0과 비정규화 상대 가중치 0입니다. 이 값들은 정규화된 확률, 측정값, 개별 전자 궤적이 아닙니다.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2C63B5"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B36A17"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087F72"/></marker>
  </defs>
  <rect width="600" height="1340" rx="24" fill="#F7F8FB"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="300" y="42" font-size="32" font-weight="700" text-anchor="middle">진폭을 먼저 더하고</text>
    <text x="300" y="77" font-size="32" font-weight="700" text-anchor="middle">그다음 절댓값을 제곱합니다</text>

    <g transform="translate(32 102)">
      <rect width="536" height="196" rx="16" fill="#FFFFFF" stroke="#C8D0DE" stroke-width="3"/>
      <text x="268" y="40" font-size="27" font-weight="700" text-anchor="middle">1 · 같은 준비</text>
      <g transform="translate(118 74)" stroke="#2C63B5" stroke-width="5" fill="none">
        <path d="M0 20 Q25 0 50 20 T100 20 T150 20 T200 20 T250 20"/>
        <path d="M0 62 Q25 42 50 62 T100 62 T150 62 T200 62 T250 62"/>
      </g>
      <text x="268" y="174" font-size="24" text-anchor="middle" fill="#526079">운동량이 같은 전자 준비</text>
    </g>

    <path d="M300 306 V354" stroke="#2C63B5" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

    <g transform="translate(32 370)">
      <rect width="536" height="246" rx="16" fill="#FFFFFF" stroke="#C8D0DE" stroke-width="3"/>
      <text x="268" y="40" font-size="27" font-weight="700" text-anchor="middle">2 · 규칙적인 결정 간격</text>
      <g transform="translate(151 76)" fill="#C8D0DE" stroke="#526079" stroke-width="3">
        <circle cx="0" cy="0" r="15"/><circle cx="58" cy="0" r="15"/><circle cx="116" cy="0" r="15"/><circle cx="174" cy="0" r="15"/><circle cx="232" cy="0" r="15"/>
        <circle cx="29" cy="54" r="15"/><circle cx="87" cy="54" r="15"/><circle cx="145" cy="54" r="15"/><circle cx="203" cy="54" r="15"/>
        <circle cx="0" cy="108" r="15"/><circle cx="58" cy="108" r="15"/><circle cx="116" cy="108" r="15"/><circle cx="174" cy="108" r="15"/><circle cx="232" cy="108" r="15"/>
      </g>
      <text x="268" y="222" font-size="24" text-anchor="middle" fill="#526079">간격이 방향별 보강·상쇄 조건을 만듦</text>
    </g>

    <text x="300" y="656" font-size="24" text-anchor="middle" fill="#526079">두 검출 방향의 기여를 각각 합산</text>
    <path d="M300 673 C300 706 196 705 196 744" fill="none" stroke="#B36A17" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
    <path d="M300 673 C300 706 404 705 404 744" fill="none" stroke="#087F72" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrow-teal)"/>

    <g transform="translate(32 768)">
      <rect width="536" height="218" rx="16" fill="#FFFFFF" stroke="#B36A17" stroke-width="3"/>
      <text x="28" y="42" font-size="27" font-weight="700" fill="#B36A17">3A · 방향 A · 같은 위상</text>
      <text x="268" y="94" font-size="34" font-weight="700" text-anchor="middle">A = 1 + 1 = 2</text>
      <path d="M268 110 V137" stroke="#B36A17" stroke-width="5" marker-end="url(#arrow-amber)"/>
      <text x="268" y="178" font-size="32" font-weight="700" text-anchor="middle">|A|² = 4</text>
      <text x="268" y="207" font-size="24" text-anchor="middle" fill="#526079">비정규화 상대 가중치</text>
    </g>

    <g transform="translate(32 1008)">
      <rect width="536" height="218" rx="16" fill="#FFFFFF" stroke="#087F72" stroke-width="3"/>
      <text x="28" y="42" font-size="27" font-weight="700" fill="#087F72">3B · 방향 B · 반대 위상</text>
      <text x="268" y="94" font-size="34" font-weight="700" text-anchor="middle">A = 1 − 1 = 0</text>
      <path d="M268 110 V137" stroke="#087F72" stroke-width="5" marker-end="url(#arrow-teal)"/>
      <text x="268" y="178" font-size="32" font-weight="700" text-anchor="middle">|A|² = 0</text>
      <text x="268" y="207" font-size="24" text-anchor="middle" fill="#526079">비정규화 상대 가중치</text>
    </g>

    <line x1="52" y1="1256" x2="548" y2="1256" stroke="#C8D0DE" stroke-width="3"/>
    <text x="300" y="1292" font-size="24" text-anchor="middle" fill="#526079">4와 0은 정규화된 확률이나 측정값이 아닙니다.</text>
    <text x="300" y="1325" font-size="24" text-anchor="middle" fill="#526079">화살표도 개별 전자의 궤적을 나타내지 않습니다.</text>
  </g>
</svg>
