<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title">
<title id="title">서로 다른 실험으로 핵의 구성요소를 추론</title><rect width="600" height="400" rx="16" fill="#f7f8fb"/>
<g font-family="system-ui,sans-serif" font-size="25" fill="#172033"><text x="25" y="45">핵의 위치와 핵의 재료는 다른 질문</text>
<text x="25" y="110">질소에 알파 입자 → 빠른 수소 핵</text><path d="M40 155 H540" stroke="#b36a17" stroke-width="4"/><circle cx="280" cy="155" r="20" fill="#b36a17"/><text x="25" y="210">수소 핵이 구성요소일 수 있다는 추론</text>
<text x="25" y="285">베릴륨 복사 → 다른 물질 핵의 반동</text><path d="M40 320 H540" stroke="#087f72" stroke-width="4"/><text x="25" y="380">중성 입자의 질량·전하를 비교로 추론</text></g></svg>
