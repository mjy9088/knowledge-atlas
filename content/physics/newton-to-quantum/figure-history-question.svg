<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title">
<title id="title">운동 예측에서 원자의 내부와 빛의 색으로</title><rect width="600" height="360" rx="16" fill="#f7f8fb"/>
<g font-family="system-ui,sans-serif" font-size="28" fill="#172033"><text x="25" y="50">무엇을 보았기에 생각이 바뀌었을까요?</text>
<path d="M60 140 Q150 50 245 170" fill="none" stroke="#2c63b5" stroke-width="4"/><circle cx="180" cy="110" r="12" fill="#2c63b5"/>
<circle cx="400" cy="140" r="55" fill="none" stroke="#b36a17" stroke-width="3"/><text x="390" y="150">?</text>
<text x="40" y="245">계산할 수 있는 길</text><text x="310" y="245">보이지 않는 안쪽</text><text x="40" y="320">운동 · 빛 · 원자핵의 서로 다른 증거</text></g></svg>
