<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title"><title id="title">진폭을 더한 뒤 제곱하면 상대 가중치가 달라짐</title><rect width="600" height="380" rx="16" fill="#f7f8fb"/>
<path d="M35 130 H560 M35 250 H560" stroke="#c8d0de"/><g font-family="system-ui,sans-serif" font-size="28" fill="#172033"><text x="25" y="45">방향별 결과: 진폭을 먼저 더해요</text><text x="30" y="105">같은 부호</text><text x="220" y="105">1 + 1 = 2 → 4</text><text x="30" y="220">반대 부호</text><text x="220" y="220">1 − 1 = 0 → 0</text><text x="25" y="305">합의 제곱은 아직 상대 가중치입니다.</text><text x="25" y="355">4는 확률 4가 아닙니다 · 설명용 값</text></g></svg>
