<g font-family="system-ui,sans-serif" font-size="25" fill="#172033"><text x="25" y="42">방전관: 기체에 전압을 걸어 만든 빔</text><text x="45" y="305">음극</text><text x="195" y="305">전기장</text><text x="455" y="320">검출 화면</text><text x="220" y="100">+ + +</text><text x="220" y="275">− − −</text><text x="335" y="215">전기장 ↓</text><text x="25" y="355">속도와 휘어짐 → 전하량 / 질량의 비</text><text x="25" y="390">개념도 · 실제 전자의 궤적 사진 아님</text></g></svg>
