name: content-model-and-browser-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Korean and mathematical review fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-dejavu-core
          fc-match 'Noto Sans CJK KR'
          fc-match 'DejaVu Sans'
      - name: Validate source and content references
        run: pnpm validate
      - name: Check TypeScript contracts
        run: pnpm typecheck
      - name: Run deterministic model tests
        run: pnpm test
      - name: Check static readers in Chromium
        run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
